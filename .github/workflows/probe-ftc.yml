# 임시 점검: ftc_press 가 setup-python 3.12 에서만 404 인지, 어느 버전이면 되는지 본다. 결과를 확인하면 이 파일은 지운다.
name: Probe FTC feeds (temporary)

on:
  push:
    branches: [claude/fervent-hamilton-cp41yw]
    paths: [.github/workflows/probe-ftc.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: python3 -m pip install --quiet -r fetch/requirements.txt
      - name: fetch.py 로 ftc_press 와 다른 소스 몇 개
        run: |
          python3 --version
          python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "fetch")
          import fetch as f
          srcs = f.build_sources(48)
          for name in ["ftc_press", "federal_register", "sec_press", "doj_antitrust", "pew_research", "gnews_tariff"]:
              ua = f.BROWSER_UA if f.SOURCES[name]["ua"] == "browser" else None
              try:
                  items, warn = f.parse_items(f.fetch_bytes(srcs[name], 30, 0, ua))
                  print("PY", sys.version.split()[0], name, "OK", len(items))
              except Exception as e:
                  print("PY", sys.version.split()[0], name, "FAIL", str(e)[:60])
          EOF
