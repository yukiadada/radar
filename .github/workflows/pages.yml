name: Deploy radar to GitHub Pages

# main 에 push 될 때, 그리고 매일 07:00 KST(22:00 UTC)에 사이트를 빌드·배포한다.
# 07:00 실행은 루틴이 push 하지 못한 날에도 날짜와 수집 현황을 갱신하기 위한 것.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 최근 14일 raw 폴더 목록
        run: |
          { echo "RAW_DIRS<<EOF"; for i in $(seq 0 13); do date -d "-$i day" +raw/%F; done; echo "EOF"; } >> "$GITHUB_ENV"
      - name: radar-raw 체크아웃 (수집 현황용, 실패해도 계속)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: yukiadada/radar-raw
          ssh-key: ${{ secrets.RAW_DEPLOY_KEY }}
          path: radar-raw
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.RAW_DIRS }}
      - name: raw 연결
        run: |
          if [ -d radar-raw/raw ]; then rm -rf raw && ln -s "$GITHUB_WORKSPACE/radar-raw/raw" raw && echo "raw 연결됨: $(ls raw | wc -l) 일치"; else echo "radar-raw 없음, 수집 현황 없이 빌드"; fi
      - name: Build site/out (ubuntu-latest 의 python3. build.py 는 표준 라이브러리만)
        run: python3 --version && python3 site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
