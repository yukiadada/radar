# 임시: 2026-10-27~11-01 ftc_press 수집 실패 기간의 FTC 보도자료 목록 확인. 확인 뒤 지운다.
name: FTC gap check (temporary)
on:
  push:
    branches: [claude/fervent-hamilton-cp41yw]
    paths: [.github/workflows/ftc-gap.yml]
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 시스템 python3 가상환경
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r fetch/requirements.txt
      - name: FTC 분야별 피드에서 10/24~11/01 항목
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import sys
          sys.path.insert(0, "fetch")
          import fetch
          ua = fetch.BROWSER_UA if fetch.SOURCES["ftc_press"].get("ua") == "browser" else None
          seen = set()
          for url in ["https://www.ftc.gov/feeds/press-release.xml",
                      "https://www.ftc.gov/feeds/press-release-competition.xml",
                      "https://www.ftc.gov/feeds/press-release-consumer-protection.xml"]:
              try:
                  items, err = fetch.parse_items(fetch.fetch_bytes(url, 30, 2, ua=ua))
              except Exception as e:
                  print("FAIL", url, e); continue
              pubs = sorted(i.get("published") or "" for i in items)
              print("FEED", url, len(items), "oldest", pubs[0] if pubs else None)
              for i in items:
                  p = i.get("published") or ""
                  if "2026-10-24" <= p[:10] <= "2026-11-01" and i["link"] not in seen:
                      seen.add(i["link"])
                      print("ITEM", p, "|", i["title"], "|", i["link"])
                      print("  SUM", (i.get("summary") or "")[:500])
          PY
