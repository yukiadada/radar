name: Fetch raw feeds

# 매일 06:00 KST(21:00 UTC)에 6개 소스를 수집해 raw/<KST 날짜>/ 를 커밋한다.
# 클라우드 루틴(06:20 KST)은 이 커밋을 읽어 브리프를 쓴다. 샌드박스는 외부 RSS 접근이 막혀 있기 때문.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet feedparser
      - name: Fetch
        run: |
          DATE="$(date +%F)"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python3 fetch/fetch.py --date "$DATE" || echo "일부 소스 실패 (성공한 소스는 저장됨)"
      - name: Commit raw
        run: |
          git config user.name "radar fetch"
          git config user.email "radar-fetch@users.noreply.github.com"
          git add "raw/$DATE"
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "raw $DATE: 자동 수집 (actions)"
          git pull --rebase origin main
          git push origin main
