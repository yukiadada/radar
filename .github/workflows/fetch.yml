name: Fetch raw feeds

# 매일 04:30 KST(19:30 UTC) 예약으로 6개 소스를 수집해 비공개 저장소 radar-raw 의 raw/<KST 날짜>/ 에 커밋한다.
# GitHub 예약 실행은 1~2시간 늦거나 빠질 수 있다(9/12 첫 실행이 2시간 11분 지연). 그래서 06:20 KST 클라우드 루틴은
# raw 가 없으면 이 워크플로를 workflow_dispatch 로 직접 실행하고 기다린다. 예약은 백업이다.
# 공개 저장소(여기)에는 raw 를 남기지 않는다. radar-raw 의 오늘 폴더를 먼저 받아 그 위에서 fetch.py 를 실행하므로
# 같은 날 다시 돌려도 실패한 소스는 이전 정상 파일이 유지된다.
on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 날짜 (KST)
        run: echo "DATE=$(date +%F)" >> "$GITHUB_ENV"
      - name: radar-raw 체크아웃 (오늘 폴더만)
        uses: actions/checkout@v4
        with:
          repository: yukiadada/radar-raw
          ssh-key: ${{ secrets.RAW_DEPLOY_KEY }}
          path: radar-raw
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: raw/${{ env.DATE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet feedparser
      - name: 수집 (radar-raw 안에 씀, 실패 소스는 기존 파일 유지)
        run: |
          mkdir -p radar-raw/raw
          rm -rf raw && ln -s "$GITHUB_WORKSPACE/radar-raw/raw" raw
          set +e
          python3 fetch/fetch.py --date "$DATE" 2>&1 | tee fetch.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^\[fail\]|피드 캡' fetch.log | while IFS= read -r line; do echo "::warning::$line"; done || true
          n=$(ls "raw/$DATE"/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "저장된 파일 $n 개, fetch.py exit $rc"
          if [ "$rc" -ge 2 ] || [ "$n" -eq 0 ]; then echo "::error::수집 실패 (exit $rc, 파일 $n 개). 인자·환경 오류이거나 전 소스 실패"; exit 1; fi
      - name: radar-raw 커밋·push
        working-directory: radar-raw
        run: |
          git config user.name "radar fetch"
          git config user.email "radar-fetch@users.noreply.github.com"
          git add "raw/$DATE"
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "raw $DATE: 자동 수집 (actions)"
          git pull -q --rebase origin main || true
          git push -q origin HEAD:main
          echo "pushed raw/$DATE to radar-raw"
