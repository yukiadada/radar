name: Fetch raw feeds

# 매일 06:00 KST(21:00 UTC)에 6개 소스를 수집해 비공개 저장소 radar-raw 의 raw/<KST 날짜>/ 에 커밋한다.
# 공개 저장소(여기)에는 raw 를 남기지 않는다. 클라우드 루틴(06:20 KST)은 radar-raw 를 함께 클론해 읽는다.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet feedparser
      - name: Fetch
        run: |
          DATE="$(date +%F)"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          python3 fetch/fetch.py --date "$DATE" || echo "일부 소스 실패 (성공한 소스는 저장됨)"
      - name: Push raw to private radar-raw
        env:
          RAW_DEPLOY_KEY: ${{ secrets.RAW_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RAW_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --quiet --depth 1 git@github.com:yukiadada/radar-raw.git /tmp/radar-raw
          mkdir -p /tmp/radar-raw/raw
          rm -rf "/tmp/radar-raw/raw/$DATE"
          cp -r "raw/$DATE" /tmp/radar-raw/raw/
          cd /tmp/radar-raw
          git config user.name "radar fetch"
          git config user.email "radar-fetch@users.noreply.github.com"
          git add raw
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "raw $DATE: 자동 수집 (actions)"
          git push -q origin HEAD:main
          echo "pushed raw/$DATE to radar-raw"
