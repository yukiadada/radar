name: Fetch raw feeds

# 매일 04:30 KST(19:30 UTC)와 05:15 KST(20:15 UTC) 예약으로 소스 전부(framework/sources.yaml, fetch.py --list)를 수집해
# 비공개 저장소 radar-raw 의 raw/<KST 날짜>/ 에 커밋한다. 두 번 도는 이유: GitHub 예약 실행은 1~2시간 늦거나 빠질 수 있다.
# 워크플로는 멱등이라 두 번째 실행은 새 항목이 있을 때만 커밋한다. 그래도 없으면 06:20 KST 클라우드 루틴이 workflow_dispatch 로 직접 실행한다.
# 공개 저장소(여기)에는 raw 를 남기지 않는다. radar-raw 의 오늘 폴더를 먼저 받아 그 위에서 fetch.py 를 실행하므로
# 같은 날 다시 돌려도 실패한 소스는 이전 정상 파일이 유지된다.
# 수집 뒤 fetch/market.py --update 로 sector_map 티커의 종가(Cboe 지연 시세)를 radar-raw 의 prices/prices.json 에 갱신한다 (시장 반응 계산용).
on:
  schedule:
    - cron: "30 19 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 날짜 (KST)
        run: echo "DATE=$(date +%F)" >> "$GITHUB_ENV"
      - name: radar-raw 체크아웃 (오늘 폴더만)
        uses: actions/checkout@v4
        with:
          repository: yukiadada/radar-raw
          ssh-key: ${{ secrets.RAW_DEPLOY_KEY }}
          path: radar-raw
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            raw/${{ env.DATE }}
            prices
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetch/requirements.txt
      - run: python3 -m pip install --quiet -r fetch/requirements.txt
      - name: 수집 (radar-raw 안에 씀, 실패 소스는 기존 파일 유지)
        run: |
          mkdir -p radar-raw/raw
          rm -rf raw && ln -s "$GITHUB_WORKSPACE/radar-raw/raw" raw
          set +e
          python3 fetch/fetch.py --date "$DATE" 2>&1 | tee fetch.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^\[fail\]|피드 캡' fetch.log | while IFS= read -r line; do echo "::warning::$line"; done || true
          n=$(ls "raw/$DATE"/*.json 2>/dev/null | wc -l | tr -d ' ')
          expected=$(python3 fetch/fetch.py --list | wc -l | tr -d ' ')
          echo "저장된 파일 $n 개 (소스 $expected 개), fetch.py exit $rc"
          if [ "$n" -lt "$expected" ]; then echo "::warning::소스 $expected 개 중 $n 개만 저장됨. 없는 소스는 루틴 요약에 나온다"; fi
          if [ "$rc" -ge 2 ] || [ "$n" -eq 0 ]; then echo "::error::수집 실패 (exit $rc, 파일 $n 개). 인자·환경·sources.yaml 오류이거나 전 소스 실패"; exit 1; fi
      - name: 종가 갱신 (radar-raw/prices/prices.json, 실패해도 수집은 커밋)
        run: |
          mkdir -p radar-raw/prices
          rm -rf prices && ln -s "$GITHUB_WORKSPACE/radar-raw/prices" prices
          set +e
          python3 fetch/market.py --update 2>&1 | tee market.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -E '^\[fail\]' market.log | while IFS= read -r line; do echo "::warning::$line"; done || true
          if [ "$rc" -ge 2 ]; then echo "::warning::종가 갱신 못 함 (exit $rc: 인자·환경·sector_map 오류). 시장 반응은 이전 자료로 계산된다"; elif [ "$rc" -ne 0 ]; then echo "::warning::종가 일부 종목 실패 (exit $rc). 실패 종목은 이전 자료 유지"; fi
      - name: radar-raw 커밋·push
        working-directory: radar-raw
        run: |
          git config user.name "radar fetch"
          git config user.email "radar-fetch@users.noreply.github.com"
          git add "raw/$DATE" prices
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "raw $DATE: 자동 수집 (actions)"
          git pull -q --rebase origin main || { git rebase --abort 2>/dev/null || true; echo "::error::radar-raw rebase 실패. 이 날 raw 를 push 하지 못함"; exit 1; }
          git push -q origin HEAD:main
          echo "pushed raw/$DATE to radar-raw"
