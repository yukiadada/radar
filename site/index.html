<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radar</title>
<meta name="description" content="코인, 기술권력, 정치권력, 자본권력 네 축의 일간 관측 장부">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F3F4F2; --ink:#1E2A3A; --ink2:#5A6675; --muted:#6F7A86;
  --hair:#D8DCE0; --hair2:#E7EAED; --wash:#E9ECEF;
  --accent:#2A6FBF; --grow:#2A6FBF; --shrink:#BD5A19; --hold:#A6ADB4;
  --panel:#FBFBFA; --ax0:#B03A6B; --ax1:#1F8A8A; --ax2:#9A6F00; --ax3:#6B5BD2;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Apple SD Gothic Neo","Nanum Myeongjo",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#14171B; --ink:#ECEEF0; --ink2:#A9B1BA; --muted:#8A939D;
    --hair:#2B3138; --hair2:#22272D; --wash:#1C2026;
    --accent:#4A8FD6; --grow:#4A8FD6; --shrink:#D9743F; --hold:#5B646E;
    --panel:#1A1E24; --ax0:#E06A9A; --ax1:#4FC1C1; --ax2:#E0B33F; --ax3:#9C8CF0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.7;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mast,#app,.foot{max-width:920px;margin:0 auto;padding-left:24px;padding-right:24px}
.mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-top:22px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.brand{font-weight:600;font-size:21px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.tagline{margin:0;font-size:13.5px;color:var(--ink2)}
.mast nav{margin-left:auto;display:flex;gap:16px;font-size:14px}
.mast nav a{color:var(--ink2);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
.mast nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
#app{padding-bottom:72px;min-height:60vh}
.foot{padding-top:18px;padding-bottom:40px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:16px}
.foot a{color:var(--muted)}
h2.sec{font-size:15px;font-weight:600;margin:40px 0 12px;padding-top:14px;border-top:1px solid var(--hair)}
h2.sec .dim,.dim{color:var(--ink2);font-weight:400}
.empty,.loading{color:var(--ink2);font-size:15px;margin:16px 0}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:6px 0;border-bottom:1px solid var(--hair2);font-size:15px}
.pager{display:flex;justify-content:space-between;font-size:14px;margin:28px 0 0}

/* 축 저울 */
.dateline{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.35;margin:30px 0 2px}
.hero-sub{color:var(--ink2);font-size:14px;margin:0}
.scale{margin:22px 0 4px}
.scale figcaption{font-size:15px;font-weight:500;margin-bottom:4px}
.scale figcaption span{color:var(--ink2);font-weight:400;margin-left:8px;font-size:13.5px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.sw.grow{background:var(--grow)}.sw.shrink{background:var(--shrink)}
.srow{display:grid;grid-template-columns:76px 1fr 96px;align-items:center;gap:10px;height:34px}
.srow .lab{font-size:14px;font-weight:500}
.track{display:grid;grid-template-columns:1fr 2px 1fr;align-items:center;height:100%}
.arm{display:flex;align-items:center;gap:6px;height:16px;min-width:0}
.arm.left{justify-content:flex-end}
.arm i{display:block;height:16px;width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.arm.left i{background:var(--shrink);border-radius:4px 0 0 4px}
.arm.right i{background:var(--grow);border-radius:0 4px 4px 0}
.arm b{font-size:13px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.mid{width:2px;height:24px;background:var(--hair)}
.srow .hold{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.arm i{transition:none}}
@media (max-width:560px){.srow{grid-template-columns:64px 1fr 72px;gap:6px}.dateline{font-size:22px}}
@media (max-width:640px){.mast nav{margin-left:0;width:100%;gap:14px;overflow-x:auto;padding-bottom:2px}.tagline{display:none}}

/* 표 */
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
th{font-size:12.5px;font-weight:500;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap;vertical-align:bottom}
td{padding:9px 10px;border-bottom:1px solid var(--hair2);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:0 0 6px}
.tbl.wide table{min-width:960px}
th.fact,td.fact{min-width:360px}
th.note,td.note{min-width:300px}
td.date{white-space:nowrap;font-variant-numeric:tabular-nums}
td.small{font-size:13px;color:var(--ink2)}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px;font-size:14px}
.filters label{color:var(--ink2)}
select,input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--hair);border-radius:6px;background:var(--ground);color:var(--ink)}
input[type=search]{min-width:200px}
.count{color:var(--ink2);font-size:13.5px}

/* 브리프 본문 (markdown) */
.md{font-family:var(--serif);font-size:17px;line-height:1.85}
.md>*:not(.tbl){max-width:74ch}
.md h1{font-family:var(--sans);font-size:20px;font-weight:600;line-height:1.4;margin:6px 0 18px}
.md>h1:first-child{display:none}
.md>h1:first-child+h2{border-top:0;margin-top:4px}
.md h2{font-family:var(--sans);font-size:15px;font-weight:600;margin:36px 0 10px;padding-top:12px;border-top:1px solid var(--hair)}
.md p{margin:0 0 14px}
.md ul{padding-left:20px;margin:0 0 14px}
.md li{margin:5px 0}
.md .tbl{margin:0 0 16px}
.md table{font-family:var(--sans);font-size:14px;line-height:1.55;min-width:760px}
.md td{font-size:14px}
.md table td:first-child,.md table th:first-child,td.nowrap{white-space:nowrap}
.md code{font-family:var(--sans);background:var(--wash);padding:1px 5px;border-radius:4px;font-size:.92em}
/* 쉬운 말로 패널, 방향·확신·구조적 배지 */
.easy{background:var(--wash);border-radius:12px;padding:18px 22px 6px;margin:6px 0 26px}
.easy>h2{font-family:var(--sans);font-size:15px;font-weight:600;margin:0 0 10px}
.easy .md{font-size:16.5px}
.easy .md>ul{padding-left:0;list-style:none}
.easy .md>ul>li{margin:0 0 16px}
.easy .md>ul>li>ul{padding-left:18px;margin-top:4px}
.easy .md strong{font-family:var(--sans);font-weight:600;font-size:15.5px}
.keys{font-size:13px;color:var(--ink2);margin:0 0 8px;line-height:1.8}
.dir,.conf,.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink)}
.dir i,.conf i{font-style:normal}
.dir i{font-size:11px;width:12px;text-align:center}
.dir.up i{color:var(--grow)}.dir.down i{color:var(--shrink)}.dir.both i{color:var(--hold)}
.conf i{display:inline-flex;gap:3px;align-items:center}
.conf s{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);text-decoration:none}
.conf s.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.st{padding:1px 8px;border-radius:999px;border:1px solid var(--hair);font-size:12px}
.st.yes{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.st.no{color:var(--ink2)}
.md table td{vertical-align:top}
/* 대시보드 (트렌드) */
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 0;font-size:14px}
.seg a{padding:4px 13px;border:1px solid var(--hair);border-radius:999px;text-decoration:none;color:var(--ink2)}
.seg a[aria-selected=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg .dim{margin-left:4px;font-size:13px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 0}
.dash .full{grid-column:1/-1}
.panel{border:1px solid var(--hair);border-radius:12px;padding:14px 16px 12px;background:var(--panel);min-width:0}
.panel h3{font-size:14px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h3 .dim{font-size:12.5px}
.panel .scale{margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{padding:10px 14px;border:1px solid var(--hair);border-radius:10px;background:var(--panel);min-width:0}
.kpi b{display:block;font-size:24px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi b.txt{font-size:17px}
.kpi b small{font-size:13px;font-weight:500;color:var(--ink2)}
.kpi em{font-style:normal}.kpi em.g{color:var(--grow)}.kpi em.s{color:var(--shrink)}
.kpi span{font-size:12.5px;color:var(--ink2)}
.ax0{--c:var(--ax0)}.ax1{--c:var(--ax1)}.ax2{--c:var(--ax2)}.ax3{--c:var(--ax3)}
.leg{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);vertical-align:-1px;margin-right:5px}
.chart-box{min-height:120px}
svg.chart{display:block;width:100%;height:auto;font-family:var(--sans)}
svg.chart .grid{stroke:var(--hair2);stroke-width:1}
svg.chart .grid.zero{stroke:var(--hair)}
svg.chart .tick{font-size:11px;fill:var(--muted)}
svg.chart .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.chart .pt{fill:var(--c);stroke:var(--panel);stroke-width:1.5}
svg.chart .bar{fill:var(--c)}
svg.chart .lab{font-size:12px;font-weight:500;fill:var(--c)}
svg.chart .hit{fill:transparent}
.bars{display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:500;margin-bottom:2px}
.brow{display:grid;grid-template-columns:56px 1fr 28px;align-items:center;gap:8px;height:22px;font-size:13px}
.blab{font-weight:500;white-space:nowrap}
.btrack{display:flex;height:12px;background:var(--wash);border-radius:3px;overflow:hidden}
.btrack i{display:block;height:100%}
.btrack i.up{background:var(--grow)}.btrack i.down{background:var(--shrink)}.btrack i.both{background:var(--hold)}
.bval{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.more{margin:10px 0 0;font-size:14px}
.more summary{cursor:pointer;color:var(--ink2);padding:4px 0}
@media (max-width:760px){.dash{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:20px}}
/* 기업 관찰 */
table.matrix th,table.matrix td{text-align:center;vertical-align:middle}
table.matrix th:first-child,table.matrix td:first-child{text-align:left}
table.matrix td.cell{background:color-mix(in srgb,var(--c) calc(var(--a) * 100%),transparent);font-variant-numeric:tabular-nums;line-height:1.5}
table.matrix th i.sw2{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
.gs{color:var(--grow);font-weight:500}.ss{color:var(--shrink);font-weight:500}
.axtag{display:inline-block;padding:0 7px;border-radius:999px;font-size:12px;font-weight:500;color:var(--c);border:1px solid var(--c);white-space:nowrap}
ul.feed{list-style:none;padding:0;margin:0}
ul.feed li{padding:9px 0;border-bottom:1px solid var(--hair2);font-size:14px;line-height:1.6}
ul.feed li:last-child{border-bottom:0}
ul.feed .date{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;margin-right:4px}
ul.feed .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:2px}
/* 티커 집계 */
h3.sub{font-size:14px;font-weight:600;margin:24px 0 8px}
h3.sub .dim{font-weight:400;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:2px 10px;border:1px solid var(--hair);border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--ground)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.chip .dir{font-size:12px;font-weight:400;color:var(--ink2);gap:2px}
.chip .dir i{width:auto}
table.tickers{min-width:600px}
td.chips-cell{padding-top:6px;padding-bottom:6px}
p.multi{font-size:13px;color:var(--ink2);margin:8px 0 0}
pre.yaml{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.6;background:var(--wash);padding:16px 18px;border-radius:8px;overflow-x:auto;color:var(--ink)}
</style>
</head>
<body>
<header class="mast">
  <a class="brand" href="#/">radar</a>
  <p class="tagline">코인, 기술권력, 정치권력, 자본권력 네 축의 일간 관측 장부</p>
  <nav id="nav" aria-label="주 메뉴">
    <a href="#/" data-route="home">오늘</a>
    <a href="#/trend" data-route="trend">트렌드</a>
    <a href="#/companies" data-route="companies">기업</a>
    <a href="#/ledger" data-route="ledger">장부</a>
    <a href="#/briefs" data-route="briefs">브리프</a>
    <a href="#/framework" data-route="framework">기준</a>
  </nav>
</header>
<main id="app"><p class="loading">불러오는 중</p></main>
<footer class="foot"><span id="gen"></span><a href="https://github.com/yukiadada/radar">저장소</a><span>판단 재료이지 매매 신호가 아닙니다</span></footer>
<noscript><p style="padding:24px">이 페이지는 JavaScript 로 장부와 브리프를 읽습니다. data.json 과 briefs/ 는 저장소에서 직접 볼 수 있습니다.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.12/lib/marked.umd.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  let D = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = s => { const [y, m, d] = s.split('-').map(Number); const w = '일월화수목금토'[new Date(y, m - 1, d).getDay()]; return `${y}년 ${m}월 ${d}일 ${w}요일`; };
  const pct = x => `${Math.round(x * 100)}%`;
  const list = (arr, n) => arr.slice(0, n).map(([k, v]) => `${esc(k)}(${v})`).join(', ') || '';

  const DIR = { '+': ['up', '▲', '유리'], '-': ['down', '▼', '불리'], '±': ['both', '◆', '양쪽'] };
  const dots = n => `<i aria-hidden="true">${[1, 2, 3].map(k => `<s${k <= n ? '' : ' class="off"'}></s>`).join('')}</i>`;
  const CONF = { '0.3': ['conf-low', 1, '낮음'], '0.6': ['conf-mid', 2, '보통'], '0.8': ['conf-high', 3, '높음'] };  // 'mid' 는 축 저울 중앙선 클래스와 겹치므로 접두어
  const dirBadge = v => { const d = DIR[String(v).trim()]; return d ? `<span class="dir ${d[0]}" title="방향 ${esc(v)}"><i>${d[1]}</i>${d[2]}</span>` : esc(v); };
  const confBadge = v => { const c = CONF[String(Number(v))]; return c ? `<span class="conf ${c[0]}" title="확신 ${esc(v)}">${dots(c[1])}${c[2]}</span>` : esc(v); };
  const stBadge = v => { const t = String(v).trim().toLowerCase(); return t === 'true' ? `<span class="st yes" title="문서로 남은 확정 사실">확정</span>` : t === 'false' ? `<span class="st no" title="발언·보도·조사 단계">미확정</span>` : esc(v); };
  const KEYS = `<p class="keys">구조적은 <span class="st yes">확정</span> 문서로 남은 것, <span class="st no">미확정</span> 발언·보도 단계. 방향은 그 섹터·티커에 <span class="dir up"><i>▲</i>유리</span> <span class="dir down"><i>▼</i>불리</span> <span class="dir both"><i>◆</i>양쪽</span>. 확신은 <span class="conf conf-low">${dots(1)}낮음 0.3</span> <span class="conf conf-mid">${dots(2)}보통 0.6</span> <span class="conf conf-high">${dots(3)}높음 0.8</span></p>`;

  /* 표의 방향·확신·구조적 열을 배지로 */
  function decorateTables(root) {
    root.querySelectorAll('table').forEach(t => {
      const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
      const cols = { dir: heads.indexOf('방향') >= 0 ? heads.indexOf('방향') : heads.indexOf('회사에'), conf: heads.indexOf('확신'), st: heads.indexOf('구조적') };
      if (cols.dir < 0 && cols.conf < 0 && cols.st < 0) return;
      t.querySelectorAll('tbody tr').forEach(tr => {
        const tds = tr.children;
        if (cols.dir >= 0 && tds[cols.dir]) tds[cols.dir].innerHTML = dirBadge(tds[cols.dir].textContent);
        if (cols.conf >= 0 && tds[cols.conf]) tds[cols.conf].innerHTML = confBadge(tds[cols.conf].textContent);
        if (cols.st >= 0 && tds[cols.st]) tds[cols.st].innerHTML = stBadge(tds[cols.st].textContent);
      });
    });
  }

  /* 브리프 마크다운을 ## 섹션으로 나눈다 */
  function splitSections(text) {
    return text.split(/^## /m).slice(1).map(p => { const nl = p.indexOf('\n'); return { title: p.slice(0, nl).trim(), md: p.slice(nl + 1) }; });
  }

  /* 읽는 순서: 쉬운 말로 → 누가 유리하고 불리한가 → 오늘의 축 시그널 → 나머지 */
  function renderBrief(container, b) {
    const secs = splitSections(b.md);
    const pick = t => { const i = secs.findIndex(x => x.title.startsWith(t)); return i >= 0 ? secs.splice(i, 1)[0] : null; };
    const easy = pick('쉬운 말로'), who = pick('누가 유리'), sig = pick('오늘의 축 시그널');
    if (easy) { const p = document.createElement('section'); p.className = 'easy'; p.innerHTML = '<h2>쉬운 말로</h2>'; p.appendChild(md(easy.md)); container.appendChild(p); }
    if (who || sig) container.insertAdjacentHTML('beforeend', KEYS);
    for (const x of [who, sig, ...secs].filter(Boolean)) container.appendChild(md('## ' + x.title + '\n' + x.md));
    decorateTables(container);
  }

  function md(text) {
    const el = document.createElement('div');
    el.className = 'md';
    // 브리프는 "3.50~3.75%", "9/15~16" 처럼 물결표를 범위로 쓴다. GFM 은 ~ 두 개를 취소선으로 읽으므로 코드 스팬 밖의 ~ 를 엔티티로 바꾼다
    const safe = text.split(/(`[^`]*`)/).map((seg, i) => i % 2 ? seg : seg.replace(/~/g, '&#126;')).join('');
    el.innerHTML = marked.parse(safe, { gfm: true, breaks: false });
    el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    el.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    return el;
  }

  /* 축 저울: 작아짐은 왼팔, 커짐은 오른팔. 유보·미표기는 숫자로만 */
  function scaleChart(win, caption) {
    const max = Math.max(1, ...win.axes.flatMap(a => [a.grow, a.shrink]));
    const rows = win.axes.map(a => {
      const l = a.shrink ? `<b>${a.shrink}</b><i data-w="${(a.shrink / max * 86).toFixed(1)}"></i>` : '';
      const r = a.grow ? `<i data-w="${(a.grow / max * 86).toFixed(1)}"></i><b>${a.grow}</b>` : '';
      const side = [a.hold ? `유보 ${a.hold}` : '', a.untagged ? `미표기 ${a.untagged}` : ''].filter(Boolean).join(', ');
      const tip = `${a.axis}: 커짐 ${a.grow}, 작아짐 ${a.shrink}, 유보 ${a.hold}${a.untagged ? `, 미표기 ${a.untagged}` : ''}. 총 ${a.count}건`;
      return `<div class="srow" title="${esc(tip)}"><div class="lab">${a.axis}</div><div class="track"><div class="arm left">${l}</div><div class="mid"></div><div class="arm right">${r}</div></div><div class="hold">${side}</div></div>`;
    }).join('');
    return `<figure class="scale" aria-label="축 저울${caption ? ', ' + esc(caption) : ''}">${caption ? `<figcaption>축 저울<span>${esc(caption)}</span></figcaption>` : ''}` +
      `<div class="legend"><span><span class="sw shrink"></span>작아짐</span><span><span class="sw grow"></span>커짐</span></div>${rows}</figure>`;
  }
  function animateBars() {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      app.querySelectorAll('.arm i[data-w]').forEach(i => { i.style.width = i.dataset.w + '%'; });
    }));
  }

  function axisTable(win) {
    const rows = win.axes.map(a => `<tr><td class="nowrap">${a.axis}</td><td class="num">${a.count}</td><td class="num">${win.total ? pct(a.share) : '–'}</td>` +
      `<td class="num">${a.grow}</td><td class="num">${a.shrink}</td><td class="num">${a.hold}${a.untagged ? ` <span class="dim">(미표기 ${a.untagged})</span>` : ''}</td>` +
      `<td class="num">${a.wgrow ?? '–'} / ${a.wshrink ?? '–'}${a.unweighted ? ` <span class="dim">(옛 줄 ${a.unweighted})</span>` : ''}</td>` +
      `<td class="num">${a.dir['+']}/${a.dir['-']}/${a.dir['±']}</td><td class="num">${a.avg_conf ?? '–'}</td><td class="small">${list(a.themes, 3) || '–'}</td><td class="small">${list(a.sectors, 5) || '–'}</td></tr>`).join('');
    return `<div class="tbl wide"><table><thead><tr><th>축</th><th class="num">건수</th><th class="num">비중</th><th class="num">커짐</th><th class="num">작아짐</th><th class="num">유보</th><th class="num">가중 커짐 / 작아짐</th><th class="num">섹터 유리/불리/양쪽</th><th class="num">평균 확신</th><th>상위 테마</th><th>상위 섹터</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  /* 대시보드 차트. 표준 SVG 를 직접 그린다. 폭은 컨테이너에 맞추고 창 크기가 바뀌면 다시 그린다 */
  const AXC = ['ax0', 'ax1', 'ax2', 'ax3'];
  const GROW = /^(?:\[충돌:[^\]]*\]\s*)?(커짐|작아짐|유보)/;
  const growOf = r => r.grow || ((r.note || '').match(GROW) || [])[1] || '미표기';
  const mdShort = d => { const [, m, dd] = d.split('-').map(Number); return `${m}/${dd}`; };
  const signed = v => (v > 0 ? '+' : '') + v;
  function dateRange(from, to) { const out = []; for (let t = Date.parse(from + 'T00:00:00Z'); t <= Date.parse(to + 'T00:00:00Z'); t += 864e5) out.push(new Date(t).toISOString().slice(0, 10)); return out; }
  function series(win) {
    const days = dateRange(win.from, win.to);
    const idx = Object.fromEntries(days.map((d, i) => [d, i]));
    const per = D.axes.map(() => days.map(() => ({ n: 0, g: 0, s: 0 })));
    for (const r of D.ledger) {
      const i = idx[r.date], a = D.axes.indexOf(r.axis);
      if (i == null || a < 0) continue;
      const c = per[a][i], g = growOf(r); c.n++; if (g === '커짐') c.g++; else if (g === '작아짐') c.s++;
    }
    const cum = per.map(arr => { let v = 0; return arr.map(c => (v += c.g - c.s)); });
    return { days, per, cum };
  }
  const legend = () => `<div class="leg">${D.axes.map((a, i) => `<span class="${AXC[i]}"><i></i>${esc(a)}</span>`).join('')}</div>`;
  const xStep = n => (n > 40 ? 14 : 7);

  /* 축 추이: 축별 누적 (커짐 − 작아짐). 점은 그 날 시그널이 있던 곳 */
  function lineChart(el, win) {
    const W = Math.max(280, el.clientWidth || 440), H = 220, m = { l: 30, r: 84, t: 14, b: 26 };
    const { days, per, cum } = series(win), n = days.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const lo = Math.min(0, ...cum.flat()), hi = Math.max(1, ...cum.flat());
    const x = i => m.l + (n > 1 ? i / (n - 1) * iw : iw / 2), y = v => m.t + (hi - v) / (hi - lo) * ih;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="축별 누적 커짐 빼기 작아짐 추이, 최근 ${win.days}일">`;
    const step = Math.max(1, Math.ceil((hi - lo) / 5));
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) s += `<line class="grid${v === 0 ? ' zero' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="tick" x="${m.l - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${signed(v)}</text>`;
    for (let i = n - 1; i >= 0; i -= xStep(n)) s += `<text class="tick" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${mdShort(days[i])}</text>`;
    const ends = [];
    D.axes.forEach((a, ai) => {
      s += `<path class="ln ${AXC[ai]}" d="M${cum[ai].map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('L')}"/>`;
      per[ai].forEach((c, i) => { if (c.n) s += `<circle class="pt ${AXC[ai]}" cx="${x(i).toFixed(1)}" cy="${y(cum[ai][i]).toFixed(1)}" r="3.5"><title>${days[i]} ${esc(a)}: 커짐 ${c.g}, 작아짐 ${c.s}${c.n - c.g - c.s ? `, 유보·미표기 ${c.n - c.g - c.s}` : ''} (누적 ${signed(cum[ai][i])})</title></circle>`; });
      ends.push({ ai, a, v: cum[ai][n - 1], y: y(cum[ai][n - 1]) });
    });
    ends.sort((p, q) => p.y - q.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    for (let i = ends.length - 1; i >= 0; i--) { if (ends[i].y > H - m.b - 2) ends[i].y = H - m.b - 2; if (i < ends.length - 1 && ends[i + 1].y - ends[i].y < 13) ends[i].y = ends[i + 1].y - 13; }
    for (const e of ends) s += `<text class="lab ${AXC[e.ai]}" x="${W - m.r + 8}" y="${(e.y + 4).toFixed(1)}">${esc(e.a)} ${signed(e.v)}</text>`;
    el.innerHTML = s + `</svg>`;
  }

  /* 쌓은 막대: 날짜별 건수를 계열(축 또는 기업) 색으로 쌓는다 */
  function stackChart(el, days, ser, label) {
    const W = Math.max(280, el.clientWidth || 440), H = 180, m = { l: 26, r: 10, t: 12, b: 26 };
    const n = days.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const tot = days.map((_, i) => ser.reduce((acc, x) => acc + x.counts[i], 0)), hi = Math.max(1, ...tot);
    const bw = iw / n, gap = Math.min(3, bw * 0.3), y = v => m.t + (hi - v) / hi * ih;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">`;
    const step = Math.max(1, Math.ceil(hi / 4));
    for (let v = 0; v <= hi; v += step) s += `<line class="grid${v === 0 ? ' zero' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="tick" x="${m.l - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    for (let i = n - 1; i >= 0; i -= xStep(n)) s += `<text class="tick" x="${(m.l + (i + 0.5) * bw).toFixed(1)}" y="${H - 8}" text-anchor="middle">${mdShort(days[i])}</text>`;
    days.forEach((d, i) => {
      let acc = 0; const parts = [];
      ser.forEach(x => { const c = x.counts[i]; if (!c) return; s += `<rect class="bar ${x.cls}" x="${(m.l + i * bw + gap / 2).toFixed(1)}" y="${y(acc + c).toFixed(1)}" width="${Math.max(1, bw - gap).toFixed(1)}" height="${(y(acc) - y(acc + c)).toFixed(1)}"/>`; acc += c; parts.push(`${x.name} ${c}`); });
      if (acc) s += `<rect class="hit" x="${(m.l + i * bw).toFixed(1)}" y="${m.t}" width="${bw.toFixed(1)}" height="${ih}"><title>${d}: ${parts.join(', ')} (총 ${acc}건)</title></rect>`;
    });
    el.innerHTML = s + `</svg>`;
  }
  function dayChart(el, win) {
    const { days, per } = series(win);
    stackChart(el, days, D.axes.map((a, ai) => ({ name: a, cls: AXC[ai], counts: per[ai].map(c => c.n) })), `일별 구조적 시그널 건수, 최근 ${win.days}일`);
  }
  const COC = ['ax3', 'ax1', 'ax2', 'ax0'];   // 기업 계열 색 (축 팔레트 재사용, 순서만 다르게)
  function companyChart(el, cw) {
    const C = D.companies, days = dateRange(cw.from, cw.to), idx = Object.fromEntries(days.map((d, i) => [d, i]));
    const ser = C.config.map((c, i) => ({ name: c.name, cls: COC[i % COC.length], counts: days.map(() => 0) }));
    const pos = Object.fromEntries(C.config.map((c, i) => [c.name, i]));
    for (const r of C.rows) { const i = idx[r.date], k = pos[r.company]; if (i != null && k != null) ser[k].counts[i]++; }
    stackChart(el, days, ser, `기업별 일별 관찰 건수, 최근 ${cw.days}일`);
  }

  /* 티커 막대: 섹터(테마)별로 묶고 막대 색은 방향 */
  function tickerBars(win, limit) {
    const tk = win.tickers;
    if (!tk || !tk.by_ticker.length) return `<p class="empty">언급된 티커가 없습니다.</p>`;
    const max = Math.max(1, ...tk.by_ticker.map(t => t.n));
    const seg = (k, v) => v ? `<i class="${DIR[k][0]}" style="width:${(v / max * 100).toFixed(1)}%" title="${DIR[k][2]} ${v}건"></i>` : '';
    const secs = limit ? tk.by_sector.slice(0, limit) : tk.by_sector;
    return `<div class="bars">` + secs.map(s => `<div class="bgrp"><div class="bhead"><span>${esc(s.axis)} · ${esc(s.theme)}</span><span class="dim">시그널 ${s.signals}건</span></div>` +
      s.tickers.map(t => `<div class="brow" title="${esc(t.ticker)} ${t.n}회: 유리 ${t.dir['+']}, 불리 ${t.dir['-']}, 양쪽 ${t.dir['±']}"><span class="blab">${esc(t.ticker)}</span><span class="btrack">${seg('+', t.dir['+'])}${seg('-', t.dir['-'])}${seg('±', t.dir['±'])}</span><span class="bval">${t.n}</span></div>`).join('') + `</div>`).join('') +
      (limit && tk.by_sector.length > limit ? `<p class="multi">섹터 ${tk.by_sector.length - limit}개 더 있음</p>` : '') + `</div>`;
  }

  function kpis(w) {
    const g = w.axes.reduce((a, x) => a + x.grow, 0), sh = w.axes.reduce((a, x) => a + x.shrink, 0);
    const top = Math.max(0, ...w.axes.map(a => a.count)), tops = top ? w.axes.filter(a => a.count === top).map(a => a.axis) : [];
    const tk = w.tickers && w.tickers.by_ticker[0];
    const tile = (v, l, cls) => `<div class="kpi"><b${cls ? ` class="${cls}"` : ''}>${v}</b><span>${l}</span></div>`;
    const wg = w.axes.reduce((a, x) => a + (x.wgrow || 0), 0), ws = w.axes.reduce((a, x) => a + (x.wshrink || 0), 0);
    return `<div class="kpis full">` + tile(w.total, `최근 ${w.days}일 구조적 시그널`) + tile(`<em class="g">${g}</em> / <em class="s">${sh}</em> <small>가중 ${wg} / ${ws}</small>`, '커짐 / 작아짐 (건수, 가중은 크기×기간)') +
      tile(tops.length ? tops.map(esc).join(' · ') : '–', '가장 활발한 축', 'txt') + tile(tk ? `${esc(tk.ticker)} <small>${tk.n}회</small>` : '–', '최다 언급 티커', 'txt') + `</div>`;
  }

  /* 논지 점검: thesis.md 의 논지별 확인·반증 건수 */
  function thesisPanel(w) {
    if (!D.theses || !D.theses.length) return '';
    const byId = Object.fromEntries((w.thesis || []).map(t => [t.id, t]));
    const rows = D.theses.map(t => { const c = byId[t.id] || { confirm: 0, refute: 0 }; return `<tr><td class="nowrap">${esc(t.id)}</td><td>${esc(t.title)}</td><td class="nowrap small">${esc(t.status)}</td><td class="num"><span class="dir up"><i>▲</i>${c.confirm}</span></td><td class="num"><span class="dir down"><i>▼</i>${c.refute}</span></td></tr>`; }).join('');
    return `<div class="panel full"><h3>논지 점검 <span class="dim">framework/thesis.md. 확인·반증은 최근 ${w.days}일 장부의 thesis 필드. 상태는 Ken 이 /review 로 바꿉니다</span></h3><div class="tbl"><table class="theses"><thead><tr><th>번호</th><th>논지</th><th>상태</th><th class="num">확인</th><th class="num">반증</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  let CUR = null, CURC = null;
  function drawCharts() {
    app.querySelectorAll('[data-chart]').forEach(el => {
      const k = el.dataset.chart;
      if (k === 'line' && CUR) lineChart(el, CUR); else if (k === 'day' && CUR) dayChart(el, CUR); else if (k === 'co-day' && CURC) companyChart(el, CURC);
    });
  }

  /* 기업 관찰: 기업 × 축 매트릭스, 기업별 추이, 기업별 최근 시그널 */
  function companies(arg) {
    const C = D.companies;
    if (!C || !C.config.length) { app.innerHTML = `<p class="dateline">기업 관찰</p><p class="empty">framework/companies.yaml 이 없습니다.</p>`; return; }
    const days = arg === '90' ? 90 : 30, w = days === 90 ? C.w90 : C.w30;
    CUR = null; CURC = w;
    const cfg = Object.fromEntries(C.config.map(c => [c.name, c]));
    let h = `<p class="dateline">기업 관찰</p><p class="hero-sub">${C.config.map(c => esc(c.name)).join(' · ')}. 이 기업들의 뉴스가 네 축에 미치는 영향. "회사에" 유리·불리와 "축은" 커짐·작아짐을 따로 봅니다. 구조적(확정)과 미확정 보도를 함께 쌓고 구조적 건수는 괄호로 표시합니다.</p>`;
    h += `<div class="seg" role="tablist" aria-label="기간">` + [30, 90].map(n => `<a role="tab" aria-selected="${n === days}" href="#/companies/${n}">최근 ${n}일</a>`).join('') + `<span class="dim">${w.from} ~ ${w.to}, ${w.total}건 (구조적 ${w.companies.reduce((a, c) => a + c.structural, 0)})</span></div>`;
    if (!C.rows.length) h += `<p class="empty">아직 기업 관찰 기록이 없습니다. 다음 /brief 부터 쌓입니다.</p>`;
    const maxN = Math.max(1, ...w.companies.flatMap(c => c.axes.map(x => x.count)));
    const gsCell = x => [x.grow ? `<span class="gs">커짐 ${x.grow}</span>` : '', x.shrink ? `<span class="ss">작아짐 ${x.shrink}</span>` : '', x.hold ? `<span class="dim">유보 ${x.hold}</span>` : ''].filter(Boolean).join(' ') || '<span class="dim">–</span>';
    h += `<section class="dash"><div class="panel full"><h3>기업 × 축 <span class="dim">칸 = 관찰 건수 (구조적). 아래 줄은 그 축이 커짐/작아짐으로 읽힌 건수</span></h3><div class="tbl"><table class="matrix" style="min-width:640px"><thead><tr><th>기업</th>${D.axes.map((a, i) => `<th class="${AXC[i]}"><i class="sw2"></i>${esc(a)}</th>`).join('')}<th class="num">합계</th></tr></thead><tbody>` +
      w.companies.map(c => `<tr><td class="nowrap"><b>${esc(c.name)}</b><br><span class="dim small">${(cfg[c.name].tickers || []).map(esc).join(', ') || '비상장'}</span></td>` +
        c.axes.map((x, i) => `<td class="cell ${AXC[i]}" style="--a:${(x.count ? x.count / maxN * 0.4 + 0.1 : 0).toFixed(2)}"><b>${x.count}</b> <span class="dim">(${x.structural})</span><br><span class="small">${gsCell(x)}</span></td>`).join('') +
        `<td class="num"><b>${c.count}</b> <span class="dim">(${c.structural})</span><br><span class="small"><span class="dir up"><i>▲</i>${c.dir['+']}</span> <span class="dir down"><i>▼</i>${c.dir['-']}</span> <span class="dir both"><i>◆</i>${c.dir['±']}</span></span></td></tr>`).join('') + `</tbody></table></div><p class="keys" style="margin:8px 0 0">합계 칸의 ▲▼◆는 회사에 유리·불리·양쪽 건수</p></div>`;
    h += `<div class="panel full"><h3>기업별 일별 관찰 <span class="dim">구조적·미확정 합산</span></h3><div class="leg">${C.config.map((c, i) => `<span class="${COC[i % COC.length]}"><i></i>${esc(c.name)}</span>`).join('')}</div><div class="chart-box" data-chart="co-day"></div></div>`;
    h += C.config.map(c => {
      const cw = w.companies.find(x => x.name === c.name) || { count: 0, structural: 0, dir: { '+': 0, '-': 0, '±': 0 } };
      const rows = C.rows.filter(r => r.company === c.name && r.date > w.from && r.date <= w.to).sort((a, b) => b.date.localeCompare(a.date) || b.line - a.line).slice(0, 10);
      return `<div class="panel"><h3>${esc(c.name)} <span class="dim">${(c.tickers || []).map(esc).join(', ') || '비상장'} · ${days}일 ${cw.count}건 (구조적 ${cw.structural}) · 회사에 <span class="dir up"><i>▲</i>${cw.dir['+']}</span> <span class="dir down"><i>▼</i>${cw.dir['-']}</span> <span class="dir both"><i>◆</i>${cw.dir['±']}</span></span></h3>` +
        (c.note ? `<p class="small dim" style="margin:0 0 8px">${esc(c.note)}</p>` : '') +
        (rows.length ? `<ul class="feed">` + rows.map(r => `<li><div class="meta"><span class="date">${r.date}</span><span class="axtag ${AXC[D.axes.indexOf(r.axis)]}">${esc(r.axis)}</span>${stBadge(r.structural)}${dirBadge(r.direction)}<span class="${r.grow === '커짐' ? 'gs' : r.grow === '작아짐' ? 'ss' : 'dim'}">축 ${esc(r.grow)}</span>${confBadge(r.confidence)}</div>${esc(r.fact)} <a href="${esc(r.source)}" target="_blank" rel="noopener">출처</a><br><span class="small dim">${esc(r.note)}</span></li>`).join('') + `</ul>` : `<p class="empty">이 기간에 기록 없음</p>`) + `</div>`;
    }).join('');
    h += `</section>`;
    app.innerHTML = h;
    drawCharts();
  }
  let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(drawCharts, 150); });

  /* 티커 집계: 같은 섹터(테마)끼리 묶은 표 + 티커별 합계 */
  function tickerChip(t) {
    const dirs = Object.entries(t.dir).filter(([, n]) => n).map(([k, n]) => { const d = DIR[k]; return `<span class="dir ${d[0]}" title="${d[2]} ${n}건"><i>${d[1]}</i>${n}</span>`; }).join('');
    return `<span class="chip" title="${esc(t.ticker)} 언급 ${t.n}회">${esc(t.ticker)} <b>${t.n}</b>${dirs}</span>`;
  }
  function tickerTable(win, limit) {
    const tk = win.tickers;
    if (!tk || !tk.by_ticker.length) return `<p class="empty">언급된 티커가 없습니다.</p>`;
    const secs = limit ? tk.by_sector.slice(0, limit) : tk.by_sector;
    let h = `<div class="tbl"><table class="tickers"><thead><tr><th>축</th><th>섹터 (테마)</th><th class="num">시그널</th><th>티커, 언급 횟수, 방향</th></tr></thead><tbody>` +
      secs.map(s => `<tr><td class="nowrap">${esc(s.axis)}</td><td class="nowrap">${esc(s.theme)}</td><td class="num">${s.signals}</td><td class="chips-cell"><div class="chips">${s.tickers.map(tickerChip).join('')}</div></td></tr>`).join('') + `</tbody></table></div>`;
    if (limit && tk.by_sector.length > limit) h += `<p class="multi">섹터 ${tk.by_sector.length - limit}개 더 있음. <a href="#/trend">트렌드</a>에서 전체</p>`;
    h += `<h3 class="sub">티커별 합계 <span class="dim">섹터 무관, 많이 나온 순</span></h3><div class="chips">${tk.by_ticker.slice(0, 20).map(tickerChip).join('')}</div>`;
    const multi = tk.by_ticker.filter(t => t.themes.length > 1);
    if (multi.length) h += `<p class="multi">두 섹터 이상에서 나온 티커: ${multi.map(t => `${esc(t.ticker)} (${t.themes.map(esc).join(', ')})`).join(', ')}</p>`;
    return h;
  }

  function rawLine(date) {
    const day = D.raw[date];
    if (!day) return '';
    const names = Object.keys(day);
    const zero = names.filter(k => !day[k].count || day[k].error);
    return `수집 ${names.length}개 소스${zero.length ? `, 0건 ${zero.join(', ')}` : ''}`;
  }

  /* 화면 */
  function home() {
    const b = D.briefs[0];
    const w = D.trend.w30;
    const bits = [`최근 30일 장부 ${w.total}건`, `전체 ${D.ledger.length}건`, rawLine(b ? b.date : D.today)].filter(Boolean);
    let h = `<p class="dateline">${fmtDate(D.today)}</p><p class="hero-sub">${bits.join(', ')}</p>`;
    h += scaleChart(w, `최근 30일, ${w.from}부터 ${w.to}까지`);
    if (!D.ledger.length) h += `<p class="empty">장부가 비어 있습니다. /brief 를 실행하고 push 하면 여기에 쌓입니다.</p>`;
    if (w.tickers && w.tickers.by_ticker.length) h += `<p class="keys" style="margin-top:14px">30일 티커 언급 <span class="dim">많이 나온 순. 섹터별 묶음과 추이는 <a href="#/trend">트렌드 대시보드</a></span></p><div class="chips">${w.tickers.by_ticker.slice(0, 12).map(tickerChip).join('')}</div>`;
    if (b) h += `<h2 class="sec">${b.date === D.today ? '오늘의 브리프' : '최근 브리프'} <span class="dim">${b.date}</span></h2><div id="brief"></div>`;
    else h += `<h2 class="sec">브리프</h2><p class="empty">아직 브리프가 없습니다.</p>`;
    if (D.briefs.length > 1) {
      h += `<h2 class="sec">지난 브리프</h2><ul class="plain">` + D.briefs.slice(1, 8).map(x =>
        `<li><a href="#/brief/${x.date}">${x.date}</a> <span class="dim">구조적 ${x.structural}건, 논지 변화 ${esc(x.thesis)}</span></li>`).join('') + `</ul>`;
      if (D.briefs.length > 8) h += `<p class="dim" style="font-size:14px"><a href="#/briefs">전체 브리프 ${D.briefs.length}건</a></p>`;
    }
    app.innerHTML = h;
    if (b) renderBrief(document.getElementById('brief'), b);
    animateBars();
  }

  function brief(date) {
    const i = D.briefs.findIndex(x => x.date === date);
    if (i < 0) { app.innerHTML = `<p class="empty">${esc(date)} 브리프가 없습니다. <a href="#/briefs">브리프 목록</a></p>`; return; }
    const b = D.briefs[i], prev = D.briefs[i + 1], next = D.briefs[i - 1];
    const meta = [`구조적 ${b.none_today ? '없음' : b.structural + '건'}`, `논지 변화 ${b.thesis}`, rawLine(b.date)].filter(Boolean).join(', ');
    app.innerHTML = `<p class="dateline">${fmtDate(b.date)} 브리프</p><p class="hero-sub">${esc(meta)}</p><div id="brief"></div>` +
      `<nav class="pager" aria-label="브리프 이동"><span>${prev ? `<a href="#/brief/${prev.date}">이전 ${prev.date}</a>` : ''}</span><span>${next ? `<a href="#/brief/${next.date}">다음 ${next.date}</a>` : ''}</span></nav>`;
    renderBrief(document.getElementById('brief'), b);
  }

  function trend(arg) {
    const days = arg === '90' ? 90 : 30, t = D.trend, w = days === 90 ? t.w90 : t.w30;
    CUR = w; CURC = null;
    let h = `<p class="dateline">어느 축이 커지고 있는가</p><p class="hero-sub">기준일 ${D.today}, 장부 전체 ${D.ledger.length}건. 구조적 시그널만 셉니다.</p>`;
    if (!D.ledger.length) { app.innerHTML = h + `<p class="empty">장부가 비어 있습니다.</p>`; return; }
    h += `<div class="seg" role="tablist" aria-label="기간">` + [30, 90].map(n => `<a role="tab" aria-selected="${n === days}" href="#/trend/${n}">최근 ${n}일</a>`).join('') + `<span class="dim">${w.from} ~ ${w.to}, ${w.total}건</span></div>`;
    h += `<section class="dash">` + kpis(w) +
      `<div class="panel"><h3>축 추이 <span class="dim">누적 커짐 − 작아짐. 점은 시그널이 있던 날</span></h3>${legend()}<div class="chart-box" data-chart="line"></div></div>` +
      `<div class="panel"><h3>축 저울 <span class="dim">커짐 vs 작아짐 건수</span></h3>${scaleChart(w)}</div>` +
      `<div class="panel"><h3>일별 시그널 <span class="dim">축별로 쌓음</span></h3>${legend()}<div class="chart-box" data-chart="day"></div></div>` +
      `<div class="panel"><h3>티커 집계 <span class="dim">같은 섹터끼리 묶음. 막대 색은 방향</span></h3><p class="keys" style="margin:0 0 8px"><span class="dir up"><i>▲</i>유리</span> <span class="dir down"><i>▼</i>불리</span> <span class="dir both"><i>◆</i>양쪽</span></p>${tickerBars(w)}</div>` +
      thesisPanel(w) + `</section>`;
    h += `<h2 class="sec">축별 상세 <span class="dim">최근 ${days}일. 커짐/작아짐은 note 첫 단어, 유리/불리는 티커 기준</span></h2>` + axisTable(w);
    h += `<details class="more"><summary>티커 집계 표 (숫자 그대로)</summary>${tickerTable(w)}</details>`;
    h += `<h2 class="sec">30일 단위 추이 <span class="dim">최근에서 과거로, 건수 (커짐/작아짐)</span></h2><div class="tbl"><table><thead><tr><th>축</th>` +
      t.buckets.map(b => `<th class="num">${b.label}<br><span class="dim">${b.from} ~ ${b.to}</span></th>`).join('') + `</tr></thead><tbody>` +
      D.axes.map((a, ai) => `<tr><td class="nowrap">${a}</td>` + t.buckets.map(b => { const x = b.axes[ai]; return `<td class="num">${x.count} <span class="dim">(${x.grow}/${x.shrink})</span></td>`; }).join('') + `</tr>`).join('') + `</tbody></table></div>`;
    const c = t.w90.conflicts, c30 = t.w30.conflicts;
    h += `<h2 class="sec">축 간 충돌 <span class="dim">90일 ${c.total}건, 30일 ${c30.total}건</span></h2>`;
    if (!c.total) h += `<p class="empty">없음</p>`;
    else {
      h += `<ul class="plain">` + c.pairs.map(p => { const n30 = c30.pairs.find(q => q.pair === p.pair); return `<li>${esc(p.pair)} <span class="dim">90일 ${p.count}건, 30일 ${n30 ? n30.count : 0}건${p.count >= 2 ? ', 반복' : ''}</span></li>`; }).join('') + `</ul>`;
      h += `<div class="tbl wide" style="margin-top:12px"><table><thead><tr><th>날짜</th><th>축 / 테마</th><th class="fact">팩트</th><th class="note">해석</th></tr></thead><tbody>` +
        c.rows.map(r => `<tr><td class="date">${r.date}</td><td class="nowrap">${esc(r.axis)} / ${esc(r.theme)}</td><td class="fact">${esc(r.fact)}</td><td class="small note">${esc(r.note)}</td></tr>`).join('') + `</tbody></table></div>`;
    }
    app.innerHTML = h;
    drawCharts();
    animateBars();
  }

  function ledger() {
    const rows = [...D.ledger].sort((a, b) => (b.date + b.line).localeCompare(a.date + a.line) || b.line - a.line);
    app.innerHTML = `<p class="dateline">장부</p><p class="hero-sub">구조적 시그널만 쌓입니다. 한 줄이 한 사건, 추가만 하고 고치지 않습니다.</p>` +
      `<div class="filters"><label>축 <select id="f-axis"><option value="">전체</option>${D.axes.map(a => `<option>${a}</option>`).join('')}</select></label>` +
      `<label>기간 <select id="f-days"><option value="">전체</option><option value="30">최근 30일</option><option value="90">최근 90일</option></select></label>` +
      `<input type="search" id="f-q" placeholder="테마, 티커, 팩트 검색" aria-label="검색"><span class="count" id="f-count"></span></div>` + KEYS + `<div id="ledger-table"></div>`;
    const draw = () => {
      const ax = document.getElementById('f-axis').value, days = Number(document.getElementById('f-days').value), q = document.getElementById('f-q').value.trim().toLowerCase();
      const cut = days ? new Date(new Date(D.today).getTime() - days * 864e5).toISOString().slice(0, 10) : '';
      const sel = rows.filter(r => (!ax || r.axis === ax) && (!cut || r.date > cut) && (!q || [r.theme, r.fact, r.note, r.sectors.join(' '), (r.thesis || []).join(' ')].join(' ').toLowerCase().includes(q)));
      document.getElementById('f-count').textContent = `${sel.length}건`;
      const meta = r => 'horizon' in r ? `${esc(r.horizon)} · 크기 ${esc(r.impact)} · ${esc(r.channel)}${(r.thesis || []).length ? ' · ' + r.thesis.map(esc).join(' ') : ''}${r.reverses ? ` · 번복 줄 ${r.reverses}` : ''}` : '–';
      document.getElementById('ledger-table').innerHTML = sel.length ? `<div class="tbl wide"><table><thead><tr><th>날짜</th><th>축</th><th>테마</th><th class="fact">팩트</th><th>섹터</th><th>방향</th><th>확신</th><th>기간 · 크기 · 경로 · 논지</th><th class="note">해석</th></tr></thead><tbody>` +
        sel.map(r => `<tr><td class="date">${r.date}</td><td class="nowrap">${esc(r.axis)}</td><td class="nowrap">${esc(r.theme)}</td><td class="fact">${esc(r.fact)} <a href="${esc(r.source)}" target="_blank" rel="noopener">출처</a></td><td class="nowrap">${r.sectors.map(esc).join(', ')}</td><td>${dirBadge(r.direction)}</td><td>${confBadge(r.confidence)}</td><td class="small nowrap">${meta(r)}</td><td class="small note">${esc(r.note)}</td></tr>`).join('') +
        `</tbody></table></div>` : `<p class="empty">조건에 맞는 줄이 없습니다.</p>`;
    };
    ['f-axis', 'f-days'].forEach(id => document.getElementById(id).addEventListener('change', draw));
    document.getElementById('f-q').addEventListener('input', draw);
    draw();
  }

  function briefs() {
    app.innerHTML = `<p class="dateline">브리프</p><p class="hero-sub">${D.briefs.length}건</p>` + (D.briefs.length ?
      `<div class="tbl"><table><thead><tr><th>날짜</th><th class="num">구조적 시그널</th><th>3~4년 논지 변화</th></tr></thead><tbody>` +
      D.briefs.map(b => `<tr><td class="date"><a href="#/brief/${b.date}">${b.date}</a></td><td class="num">${b.none_today ? '없음' : b.structural}</td><td>${esc(b.thesis)}</td></tr>`).join('') + `</tbody></table></div>` :
      `<p class="empty">아직 브리프가 없습니다.</p>`);
  }

  function framework() {
    app.innerHTML = `<p class="dateline">판단 기준</p><p class="hero-sub">framework/thesis.md, axes.md, sector_map.yaml 그대로. Ken 이 고칩니다.</p><div id="thesis"></div><h2 class="sec">축 정의 <span class="dim">framework/axes.md</span></h2><div id="axes"></div><h2 class="sec">섹터 맵 <span class="dim">축, 테마, 티커 화이트리스트</span></h2><pre class="yaml">${esc(D.framework.sector_map)}</pre>`;
    if (D.framework.thesis_md) document.getElementById('thesis').appendChild(md(D.framework.thesis_md));
    document.getElementById('axes').appendChild(md(D.framework.axes_md));
  }

  const views = { home, trend: a => trend(a), companies: a => companies(a), ledger, briefs, framework, brief: a => brief(a) };
  const titles = { home: 'radar', trend: '트렌드', companies: '기업', ledger: '장부', briefs: '브리프', framework: '기준', brief: '브리프' };
  function route() {
    if (!D) return;
    const [seg, arg] = location.hash.replace(/^#\/?/, '').split('/');
    const name = views[seg] ? seg : 'home';
    document.querySelectorAll('#nav a').forEach(a => {
      const on = a.dataset.route === name || (name === 'brief' && a.dataset.route === 'briefs');
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = name === 'home' ? 'radar' : `${name === 'brief' ? (arg || '') + ' ' : ''}${titles[name]} | radar`;
    views[name](arg);
    window.scrollTo(0, 0);
  }

  fetch('data.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
    D = j;
    document.getElementById('gen').textContent = `빌드 ${j.generated_at.replace('T', ' ').slice(0, 16)} KST`;
    route();
  }).catch(e => { app.innerHTML = `<p class="empty">data.json 을 불러오지 못했습니다 (${esc(e.message)}). 빌드가 아직 안 됐거나 경로가 다릅니다.</p>`; });
  window.addEventListener('hashchange', route);
})();
</script>
</body>
</html>
