<style>
/* 디자인 원칙 (HCI)
   - 위계: 페이지 제목(h1) → 한눈에 요약 → 근거(카드·표) → 상세(접힘). 답을 먼저, 설명은 필요할 때 펼친다 (점진적 공개)
   - 일관성: 글자 크기 6단계, 간격 8px 배수, 모서리 3종(카드 14 · 컨트롤 10 · 알약). 같은 뜻은 같은 모양
   - 인지: 색만으로 뜻을 전하지 않는다 (▲▼◆ 기호 + 글자 + 색). 작은 글자도 대비 4.5:1 이상
   - 조작: 누르는 곳은 최소 32px, 주요 탐색은 44px. 키보드 초점은 항상 보인다
   - 글꼴: 고딕 한 가지 (IBM Plex Sans KR, 없으면 시스템 고딕). 티커·%·날짜가 많아 영문·숫자 모양이 고유한 글꼴을 쓴다. 숫자는 고정폭 숫자로 정렬
   - 장식: 색은 주색(파랑) + 중립 + 강조(빨강). 축 색 3개와 차트 계열색은 자료를 구분할 때만. 반투명 흐림·색 띠·알약 모양 남발 없음 */
:root{
  --ground:#F5F6F8; --panel:#FFFFFF; --ink:#141A22; --ink2:#4A5563; --muted:#667080;
  --hair:#DCE0E5; --hair2:#ECEEF1; --wash:#EEF1F4;
  --accent:#1D5FB0; --pos:#2a78d6; --pos-ink:#1D5FB0; --pos-solid:#1D5FB0; --neg:#e34948; --neg-ink:#BF2F2D; --both:#9AA2AB;
  --ax0:#4a3aa7; --ax1:#1baf7a; --ax2:#eb6834;
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300; --s6:#4a3aa7; --s7:#e34948;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --sans:var(--font);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",var(--font);
  --fs-cap:13px; --fs-sm:14px; --fs-body:16px; --fs-lg:18px; --fs-h2:21px; --fs-h1:30px;
  --r-card:12px; --r-ctl:8px; --r-tag:6px;
  --w:1080px; --gut:24px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 12px rgba(16,24,40,.06);
  --fold-0:rgba(255,255,255,0); --fold-end:#D7DCE2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0F1217; --panel:#171B22; --ink:#E8EBEF; --ink2:#AAB3BE; --muted:#8C96A3;
    --hair:#2A3038; --hair2:#20252C; --wash:#1D2229;
    --accent:#7DB2F2; --pos:#3987e5; --pos-ink:#6EA8F2; --pos-solid:#2F6FC0; --neg:#e66767; --neg-ink:#F28B89; --both:#5B646E;
    --ax0:#9085e9; --ax1:#199e70; --ax2:#d95926;
    --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300; --s6:#9085e9; --s7:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
    --fold-0:rgba(23,27,34,0); --fold-end:#0A0D11;
    color-scheme:dark;
  }
}

/* 기본 */
*{box-sizing:border-box}
html{background:var(--ground);-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{overflow-x:hidden;margin:0;font-family:var(--font);font-size:var(--fs-body);line-height:1.65;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font-family:inherit}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1:focus{outline:none}
.skip{position:absolute;left:12px;top:-64px;z-index:20;padding:10px 14px;border-radius:var(--r-ctl);background:var(--ink);color:var(--ground);font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.dim{color:var(--ink2);font-weight:400}
.small{font-size:var(--fs-cap)}
.empty,.loading{color:var(--ink2);font-size:15px;margin:16px 0}
.loading::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border-radius:50%;border:2px solid var(--hair);border-top-color:var(--ink2);vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gs{color:var(--pos-ink);font-weight:600}.ss{color:var(--neg-ink);font-weight:600}.ns{color:var(--ink)}
.pct{font-variant-numeric:tabular-nums;font-weight:700}
.keys{font-size:var(--fs-sm);color:var(--ink2);margin:8px 0;line-height:1.8}

/* 머리글 · 탐색: 화면을 내려도 위치와 이동 수단이 보인다 */
.top{position:sticky;top:0;z-index:10;background:var(--ground);border-bottom:1px solid var(--hair)}
.mast{max-width:var(--w);margin:0 auto;padding:0 var(--gut);display:flex;align-items:center;gap:8px 20px;min-height:64px}
.brand{display:inline-flex;align-items:center;gap:9px;min-height:44px;font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand img{display:block;width:27px;height:24px}
.tagline{margin:0;font-size:var(--fs-cap);color:var(--muted)}
.mast nav{margin-left:auto;display:flex;gap:2px}
.mast nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;border-radius:var(--r-ctl);color:var(--ink2);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s}
.mast nav a:hover{background:var(--wash);color:var(--ink)}
.mast nav a[aria-current=page]{color:var(--ink);font-weight:700;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
#app{max-width:var(--w);margin:0 auto;padding:0 var(--gut) 88px;min-height:60vh}
.foot{max-width:var(--w);margin:0 auto;padding:20px var(--gut) 44px;border-top:1px solid var(--hair);font-size:var(--fs-cap);color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 20px}
.foot a{color:var(--ink2)}

/* 페이지 제목: 위치(eyebrow) → 제목 → 한 줄 설명 → 자료 범위 */
.ph{padding:40px 0 4px}
.eyebrow{margin:0 0 8px;font-size:var(--fs-sm);font-weight:500;color:var(--muted)}
.eyebrow a{color:var(--ink2);text-decoration:none}.eyebrow a:hover{text-decoration:underline}
.eyebrow .sep{margin:0 6px;color:var(--hair)}
.ph h1{margin:0;font-size:var(--fs-h1);line-height:1.3;font-weight:700;letter-spacing:-.015em}
.lede{margin:12px 0 0;max-width:60ch;font-size:17px;line-height:1.65;color:var(--ink2)}
.metas{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;padding:0}
.metas li{font-size:var(--fs-cap);color:var(--ink2);background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-tag);padding:2px 11px;line-height:1.7;font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0}
.pager a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--hair);border-radius:var(--r-ctl);background:var(--panel);color:var(--ink);text-decoration:none;font-weight:500}
.pager a:hover{border-color:var(--ink2)}

/* 절 제목: 제목과 설명을 나눠 한 줄에 한 가지 정보 */
.sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin:56px 0 16px}
h2.sec{margin:0;font-size:var(--fs-h2);font-weight:700;letter-spacing:-.02em;line-height:1.35}
#app>h2.sec{margin:48px 0 14px}
h2.sec .dim{font-size:var(--fs-sm);margin-left:8px}
.sh-act{margin-left:auto;font-size:var(--fs-sm);font-weight:500}
.sh-act a{text-decoration:none}.sh-act a:hover{text-decoration:underline}
.sec-note{flex:0 0 100%;order:3;margin:0;font-size:var(--fs-sm);color:var(--ink2)}

/* 한눈에 요약: 답을 먼저 */

/* 펼침 공통 */
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details.dirbrief>summary::before,details.more>summary::before,.sig details>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
details[open].dirbrief>summary::before,details[open].more>summary::before,.sig details[open]>summary::before{transform:rotate(45deg)}

/* 쉬운 말 방향 브리프 */
.dirlead{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card);padding:20px 24px}
.dirlead .md{font-size:var(--fs-lg);line-height:1.75}
.dirlead .md p:last-child{margin-bottom:0}
details.dirbrief{margin:10px 0 0;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card)}
details.dirbrief>summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 20px;font-weight:600;border-radius:var(--r-card)}
details.dirbrief>summary:hover{background:var(--wash)}
details.dirbrief>summary .dim{font-size:var(--fs-sm)}
details.dirbrief>div{padding:4px 24px 22px;border-top:1px solid var(--hair2)}

/* 접은 카드 + 더 보기 (홈의 오늘의 브리프). 카드 아래쪽을 위→아래로 짙어지는 그라데이션으로 덮고 가운데에 글자 버튼 */
.sig.folded{max-height:var(--fold-h,200px);overflow:hidden}
.more-txt{display:block;width:100%;margin:10px 0 0;padding:8px 0 2px;border:0;background:none;color:var(--ink);font:inherit;font-size:var(--fs-body);font-weight:700;text-align:center;cursor:pointer}
.sig.folded>.more-txt{position:absolute;left:0;right:0;bottom:0;height:76px;margin:0;padding:0 0 16px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(to bottom,var(--fold-0) 0%,var(--panel) 35%,var(--fold-end) 100%)}
.more-txt:hover{text-decoration:underline;text-underline-offset:4px}
.more-txt:focus-visible{outline-offset:-6px}
/* 기호 읽는 법 */
details.legend{margin:0 0 14px;font-size:var(--fs-sm)}
details.legend>summary{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 8px;border-radius:var(--r-ctl);border:1px solid var(--hair);background:var(--panel);color:var(--ink2);font-weight:500}
details.legend>summary:hover{color:var(--ink);border-color:var(--ink2)}
details.legend>summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--wash);color:var(--ink);font-size:var(--fs-cap);font-weight:700}
details.legend[open]>summary{color:var(--ink)}
details.legend>div{margin:10px 0 0;padding:14px 18px;border-radius:var(--r-card);background:var(--panel);border:1px solid var(--hair);color:var(--ink2);line-height:1.8}
.legend dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
.legend dt{font-weight:600;color:var(--ink)}
.legend dd{margin:0}
@media (max-width:560px){.legend dl{grid-template-columns:1fr;gap:2px}.legend dd{margin-bottom:8px}}

/* 표 */
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm);line-height:1.55}
th{font-size:var(--fs-cap);font-weight:600;color:var(--ink2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--hair);white-space:nowrap;vertical-align:bottom}
td{padding:12px;border-bottom:1px solid var(--hair2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--wash) 55%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:0 0 6px;background:linear-gradient(to right,var(--panel) 30%,transparent),linear-gradient(to left,var(--panel) 30%,transparent) 100% 0,radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.14),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,12px 100%,12px 100%;background-attachment:local,local,scroll,scroll}
.tbl.wide{background-color:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card)}
.tbl.wide table{min-width:1000px}
th.fact,td.fact{min-width:380px}
th.note,td.note{min-width:300px}
td.date,td.nowrap,th.nowrap{white-space:nowrap;font-variant-numeric:tabular-nums}
td.small{font-size:var(--fs-cap);color:var(--ink2)}
table.secs td{vertical-align:middle}
table.secs td.axcell{min-width:104px}
table.secs td.num{white-space:nowrap}
ul.plain{list-style:none;padding:0;margin:0;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card)}
ul.plain li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;min-height:48px;padding:8px 18px;border-bottom:1px solid var(--hair2);font-size:15px;font-variant-numeric:tabular-nums}
ul.plain li:last-child{border-bottom:0}

/* 필터 · 탭 */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:28px 0 12px;padding:14px 16px;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-cap);font-weight:600;color:var(--ink2)}
.filters .q{flex:1 1 240px}
select,input[type=search]{font-size:15px;height:40px;padding:0 12px;border:1px solid var(--hair);border-radius:var(--r-ctl);background:var(--ground);color:var(--ink);min-width:0}
select:hover,input[type=search]:hover{border-color:var(--ink2)}
input[type=search]{width:100%}
.count{font-size:var(--fs-sm);color:var(--ink2);min-height:40px;display:inline-flex;align-items:center;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:24px 0 0;font-size:var(--fs-sm)}
/* 기간 탭 고정: 머리글(.top) 아래 8px 띄워 붙는다. 배경 없이 탭 알약만 떠 있다 */
.seg.sticky{--stick-gap:8px;position:sticky;top:calc(var(--top-h,65px) + var(--stick-gap));z-index:6;margin-top:16px;padding:10px 0}
.seg.sticky a{min-height:38px}
.seg-note{margin:4px 0 0;font-size:var(--fs-cap);color:var(--ink2)}
.seg[role=tablist]{padding:0}
.seg a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--hair);border-radius:var(--r-ctl);text-decoration:none;color:var(--ink2);background:var(--panel);font-weight:600;transition:border-color .15s,background-color .15s}
.seg a:hover{border-color:var(--ink2);color:var(--ink)}
.seg a[aria-selected=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg .dim{font-size:var(--fs-cap);flex:1 1 280px}
.seg button{font-size:var(--fs-sm);min-height:34px;padding:0 13px;border:1px solid var(--hair);border-radius:var(--r-ctl);background:var(--panel);color:var(--ink2);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button:hover{border-color:var(--ink2);color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg button[aria-pressed=true] i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 1.5px var(--ground)}

/* 배지: 기호 + 글자 + 색 */
.dir,.conf,.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:var(--fs-cap);font-weight:600;color:var(--ink)}
.dir i,.conf i{font-style:normal}
.dir i{font-size:11px;width:12px;text-align:center}
.dir.up i{color:var(--pos)}.dir.down i{color:var(--neg)}.dir.both i{color:var(--both)}
.conf{font-weight:500;color:var(--ink2)}
.conf i{display:inline-flex;gap:3px;align-items:center}
.conf s{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);text-decoration:none}
.conf s.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.st{min-height:22px;padding:0 9px;border-radius:var(--r-tag);border:1px solid var(--hair)}
.st.yes{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.st.no{color:var(--ink2);font-weight:500}
.ax0{--c:var(--ax0)}.ax1{--c:var(--ax1)}.ax2{--c:var(--ax2)}
.s0{--c:var(--s0)}.s1{--c:var(--s1)}.s2{--c:var(--s2)}.s3{--c:var(--s3)}.s4{--c:var(--s4)}.s5{--c:var(--s5)}.s6{--c:var(--s6)}.s7{--c:var(--s7)}
.axtag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px 0 8px;border-radius:var(--r-tag);font-size:var(--fs-cap);font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--c) 11%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 38%,var(--hair));white-space:nowrap}
.axtag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.lbl{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:var(--r-tag);font-size:var(--fs-cap);font-weight:600;white-space:nowrap;border:1px solid var(--hair);color:var(--ink2);background:var(--panel)}
.lbl-aligned3{background:var(--pos-solid);color:#fff;border-color:var(--pos-solid)}
.lbl-aligned2{color:var(--pos-ink);border-color:color-mix(in srgb,var(--pos) 60%,var(--hair))}
.lbl-aligned1{color:var(--ink)}
.lbl-headwind{color:var(--neg-ink);border-color:color-mix(in srgb,var(--neg) 60%,var(--hair))}
.lbl-mixed{color:var(--ink);border-style:dashed;border-color:var(--ink2)}
.lbl.dim{color:var(--muted)}

/* 축 점수 막대 (−1 ~ +1): 가운데 선 기준 오른쪽 밀어줌, 왼쪽 막음 */
.axes3{display:flex;flex-direction:column;gap:7px;margin:4px 0 14px}
.axb{display:grid;grid-template-columns:34px 1fr 46px;align-items:center;gap:10px;font-size:var(--fs-cap);line-height:1.4}
.axb .axl{color:var(--ink2);white-space:nowrap;font-weight:500}
.axt{position:relative;display:grid;grid-template-columns:1fr 1fr;height:10px;border-radius:5px;background:var(--wash)}
.axt::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.axneg{display:flex;justify-content:flex-end}
.axneg i{display:block;height:100%;background:var(--neg);border-radius:5px 0 0 5px}
.axpos i{display:block;height:100%;background:var(--pos);border-radius:0 5px 5px 0}
.axv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.axcell .axt{height:8px}

/* 카드 · 패널 */
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:20px 0 0}
.dash .full{grid-column:1/-1}
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card);padding:18px 20px 16px;min-width:0}
.panel h3{font-size:var(--fs-body);font-weight:700;margin:0 0 12px;display:flex;justify-content:space-between;gap:4px 12px;align-items:baseline;flex-wrap:wrap;line-height:1.45}
.panel h3 .dim{font-size:var(--fs-cap)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;border:1px solid var(--hair);border-radius:var(--r-card);background:var(--panel);min-width:0;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:4px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi b.txt{font-size:18px}
.kpi .axn{white-space:nowrap}.kpi .axn .sw2{width:9px;height:9px;margin-right:5px;vertical-align:2px}
.kpi b small{font-size:var(--fs-cap);font-weight:500;color:var(--ink2)}
.kpi>span{font-size:var(--fs-cap);font-weight:600;color:var(--ink2)}
.kpi b .small{font-size:inherit}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:12px;margin:0}
.dcard{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card);padding:18px 20px 16px;min-width:0;transition:border-color .15s,box-shadow .15s}
.dcard:hover{border-color:color-mix(in srgb,var(--ink2) 40%,var(--hair));box-shadow:var(--shadow)}
.dcard header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dcard h3{font-size:var(--fs-lg);font-weight:700;margin:2px 0 0;letter-spacing:-.015em;line-height:1.35}
.dcard h3 a{color:var(--ink);text-decoration:none}
.dcard h3 a:hover{text-decoration:underline}
.pct.big{font-size:32px;line-height:1.05;letter-spacing:-.03em}
.dcard .meta{font-size:var(--fs-cap);color:var(--ink2);margin:8px 0 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.glance{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:0}
.gl{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card);padding:16px 20px;min-width:0}
.gl h3{font-size:var(--fs-body);font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.gl ol{margin:0;padding:0;list-style:none;counter-reset:r}
.gl ol li{counter-increment:r;display:grid;grid-template-columns:20px 1fr auto;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--hair2);font-size:15px}
.gl ol li:first-child{border-top:0}
.gl ol li::before{content:counter(r);color:var(--muted);font-size:var(--fs-cap);font-variant-numeric:tabular-nums}
.gl ol li b{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--hair);border-radius:var(--r-tag);font-size:var(--fs-sm);font-weight:500;white-space:nowrap;background:var(--ground);color:var(--ink);text-decoration:none;transition:border-color .15s}
a.chip:hover{border-color:var(--ink2);background:var(--panel)}
.chip b{font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--fs-cap);color:var(--ink2);margin:0 0 8px}
.leg i,.sw2{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);vertical-align:-1px;margin-right:6px}
details.more{margin:16px 0 0;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card)}
details.more>summary{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;color:var(--ink2);font-size:15px;font-weight:600;border-radius:var(--r-card)}
details.more>summary:hover{background:var(--wash);color:var(--ink)}
details.more>.md{padding:0 22px 12px;border-top:1px solid var(--hair2)}

/* 차트 */
.chart-box{min-height:120px;position:relative}
svg.chart{display:block;width:100%;height:auto;font-family:var(--font)}
svg.chart .grid{stroke:var(--hair2);stroke-width:1}
svg.chart .grid.zero{stroke:var(--muted);stroke-dasharray:3 4;stroke-opacity:.6}
svg.chart .tick{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
svg.chart .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.chart .pt{fill:var(--c);stroke:var(--panel);stroke-width:2}
svg.chart .bar{fill:var(--c)}
svg.chart .lab{font-size:13px;font-weight:600;fill:var(--ink)}
svg.chart .hit{fill:transparent;cursor:crosshair}
svg.chart .xh{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 3;pointer-events:none}
.tip{position:absolute;top:8px;left:0;pointer-events:none;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-ctl);padding:8px 12px;font-size:var(--fs-cap);line-height:1.65;box-shadow:var(--shadow);white-space:nowrap;z-index:2}
.tip .tipd{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:600}
.tip b{font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:7px;vertical-align:-1px}
svg.spark{display:block;width:120px;height:28px}
svg.spark .ln{fill:none;stroke:var(--pos);stroke-width:1.75;stroke-linejoin:round}
svg.spark .mid{stroke:var(--hair);stroke-width:1;stroke-dasharray:2 2}
svg.spark .pt{fill:var(--pos)}
ul.feed{list-style:none;padding:0;margin:0}
ul.feed li{padding:14px 0;border-bottom:1px solid var(--hair2);font-size:15px;line-height:1.7}
ul.feed li:first-child{padding-top:4px}
ul.feed li:last-child{border-bottom:0;padding-bottom:0}
ul.feed .date{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:var(--fs-cap);font-weight:600;margin-right:2px}
ul.feed .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}

/* 시장 반응 */
.mkt{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:10px;padding:7px 12px;border-radius:var(--r-ctl);background:var(--wash);font-size:var(--fs-sm);color:var(--ink2);font-variant-numeric:tabular-nums}
.mkt b{font-weight:600}
.mkt .lbl{min-height:20px}

/* 본문 (markdown) */
.md{font-size:var(--fs-body);line-height:1.8}
.md>*:not(.tbl){max-width:68ch}
.md h1{font-size:var(--fs-h2);font-weight:700;line-height:1.4;margin:6px 0 18px}
.md>h1:first-child{display:none}
.md>h1:first-child+h2{margin-top:4px}
.md h2{font-size:var(--fs-lg);font-weight:700;line-height:1.45;letter-spacing:-.01em;margin:32px 0 10px}
.md h3{font-size:var(--fs-body);font-weight:700;margin:24px 0 8px}
.md>h2:first-child{margin-top:16px}
.md p{margin:0 0 14px}
.md ul,.md ol{padding-left:22px;margin:0 0 16px}
.md li{margin:6px 0}
.md li::marker{color:var(--muted)}
.md strong{font-weight:700}
.md .tbl{margin:0 0 18px}
.md table{font-size:var(--fs-sm);line-height:1.55;min-width:640px}
.md td{font-size:var(--fs-sm)}
.md code{font-family:var(--mono);background:var(--wash);padding:1px 6px;border-radius:5px;font-size:.9em}
.md hr{border:0;border-top:1px solid var(--hair);margin:28px 0}
.easy{background:var(--wash);border-radius:var(--r-card);padding:18px 22px 6px;margin:6px 0 26px}
.easy>h2{font-size:var(--fs-body);font-weight:700;margin:0 0 10px}

/* 브리프 카드 */
h3.axh{font-size:var(--fs-lg);font-weight:700;margin:32px 0 12px;display:flex;align-items:center;gap:10px}
h3.axh .sw2{width:12px;height:12px;border-radius:50%;margin:0}
h3.axh .dim{font-size:var(--fs-sm)}
.sigs{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 10px}
.sig{position:relative;background:var(--panel);border:1px solid var(--hair);border-radius:var(--r-card);padding:20px 22px 16px}
.sig header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.sig header .small a{font-weight:600}
.sig h3{font-size:20px;font-weight:700;margin:0 0 14px;line-height:1.4;letter-spacing:-.02em}
.sig p{margin:0 0 12px;font-size:var(--fs-body);line-height:1.75;max-width:68ch}
.sig p b{display:block;font-size:var(--fs-cap);font-weight:700;color:var(--ink2);margin:0 0 2px;letter-spacing:.01em}
.sig .chips{margin:12px 0 0}
/* 이득·손해 행: 라벨 · 티커 · 이유 */
.gls{margin:2px 0 0}
.glr{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:12px;row-gap:6px;align-items:baseline;padding:10px 0;border-top:1px solid var(--hair2)}
.glr:first-child{border-top:0;padding-top:4px}
.glk{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap}
.glk i{font-style:normal;font-size:11px}
.glr.up .glk{color:var(--pos-ink)}
.glr.down .glk{color:var(--neg-ink)}
.glt{display:flex;flex-wrap:wrap;gap:6px}
.glr p.gly{margin:0;font-size:var(--fs-body);line-height:1.7;max-width:62ch}
@media (max-width:560px){.glr{grid-template-columns:auto minmax(0,1fr)}.glr p.gly{grid-column:1/-1}}
.sig details{margin-top:14px;border-top:1px solid var(--hair2);padding-top:4px;font-size:var(--fs-sm)}
.sig details>summary{display:flex;align-items:center;gap:8px;min-height:40px;color:var(--ink2);font-weight:600}
.sig details>summary:hover{color:var(--ink)}
.sig details p{font-size:var(--fs-sm);line-height:1.7}
pre.yaml{font-family:var(--mono);font-size:var(--fs-cap);line-height:1.65;background:var(--panel);border:1px solid var(--hair);padding:16px 18px;border-radius:var(--r-card);overflow-x:auto;color:var(--ink);word-break:normal}

/* 관심 */
.att{display:flex;flex-direction:column;gap:8px}
.attrow{display:grid;grid-template-columns:minmax(160px,1.2fr) 2fr 120px;align-items:center;gap:12px;font-size:var(--fs-sm)}
.attlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atttrack{height:12px;background:var(--wash);border-radius:6px;overflow:hidden}
.atttrack i{display:block;height:100%;background:var(--pos);border-radius:6px}
.attval{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 약관 · 방침의 미입력 자리 */
mark.todo{background:color-mix(in srgb,var(--neg) 10%,var(--panel));color:var(--neg-ink);border:1px dashed color-mix(in srgb,var(--neg) 55%,var(--hair));border-radius:var(--r-tag);padding:0 5px;font-weight:600}
.todo-note{margin:0 0 20px;padding:12px 16px;border:1px dashed var(--hair);border-radius:var(--r-card);background:var(--panel);color:var(--ink2);font-size:var(--fs-sm)}

/* 경고 */
.warn{margin:24px 0 0;padding:14px 18px;border:1px solid color-mix(in srgb,var(--neg) 55%,var(--hair));border-radius:var(--r-card);background:color-mix(in srgb,var(--neg) 7%,var(--panel));font-size:var(--fs-sm)}
.warn ul{margin:6px 0 0;padding-left:20px}
.warn li{margin:2px 0}

/* 좁은 화면 */
@media (max-width:900px){.tagline{display:none}}
@media (max-width:760px){
  :root{--gut:16px;--fs-h1:25px;--fs-h2:19px}
  .mast{flex-wrap:wrap;min-height:0;padding-top:8px;gap:0}
  .mast nav{margin:0 calc(-1 * var(--gut));padding:0 var(--gut) 6px;width:calc(100% + 2 * var(--gut));overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 88%,transparent)}
  .mast nav::-webkit-scrollbar{display:none}
  .mast nav a{padding:0 12px}
  .ph{padding-top:28px}
  .lede{font-size:var(--fs-body)}
  .sh{margin-top:44px}
  .dash,.glance{grid-template-columns:minmax(0,1fr)}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpi b{font-size:22px}
  .dirlead{padding:16px 18px}
  .dirlead .md{font-size:17px}
  details.dirbrief>div,details.more>.md{padding-left:18px;padding-right:18px}
  .sig{padding:16px 16px 12px}
  .sig h3{font-size:18px}
  .attrow{grid-template-columns:1fr 1.2fr 88px}
  .filters label{flex:1 1 140px}
  .filters select{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media (forced-colors:active){.axneg i,.axpos i,.atttrack i{forced-color-adjust:none}.lbl,.axtag,.st{border:1px solid CanvasText}}
</style>

<noscript><p style="padding:24px">이 페이지는 JavaScript 로 장부와 브리프를 읽습니다. data.json 과 briefs/ 는 저장소에서 직접 볼 수 있습니다.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.12/lib/marked.umd.js" integrity="sha384-TuL/7aNYXEDWjlcHi2CR+Een2A5pigrtJ97Tmx3WG69mx5kCSp8yKHRISW9xSmgq" crossorigin="anonymous"></script>
<script>
(function () {
  const app = document.getElementById('app');
  let D = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const enc = s => encodeURIComponent(s);
  const fmtDate = s => { const [y, m, d] = s.split('-').map(Number); const w = '일월화수목금토'[new Date(y, m - 1, d).getDay()]; return `${y}년 ${m}월 ${d}일 ${w}요일`; };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  /* 기준(mode): 'live' 누적(유효기간 안의 시그널, 기본) 또는 'w30'·'w90'… 열린 창. 주소 끝의 /30, /90 이 창, 없으면 누적 */
  const modeOf = arg => (arg && D.board['w' + arg] ? 'w' + arg : 'live');
  const sfx = mode => (mode && mode !== 'live' ? '/' + mode.slice(1) : '');
  const board = mode => D.board[mode] || D.board.live;
  const serOf = mode => D.series[mode] || D.series.live;
  const winName = n => (n === 365 ? '1년' : `${n}일`);
  const modeName = mode => (mode === 'live' ? '누적' : `최근 ${winName(Number(mode.slice(1)))}`);
  const validityText = () => Object.entries(D.params.validity).map(([h, n]) => `${h} ${n}일`).join(' · ');
  const spanText = B => (B.mode === 'live' ? `${B.to} 기준 살아 있는 시그널 ${B.total}건` : `${B.from} ~ ${B.to} · ${B.total}건`);
  /* 시그널의 남은 비중 0~1: 당일 1, 유효기간 끝에 0. scoring.remaining 과 같은 식 */
  const remainOf = r => { const v = D.params.validity[r.horizon] || D.params.validity['분기']; const age = Math.round((new Date(D.today) - new Date(r.date)) / 864e5); return age < 0 || age >= v ? 0 : 1 - age / v; };
  const LIVE_KEY = ['누적', () => `시그널은 기간에 따라 ${validityText()} 동안 살아 있고, 그동안 가중치가 서서히 0으로 줄어듭니다. 지난 시그널은 장부에 남지만 점수에서 빠집니다. "최근 30일"은 새로 들어온 근거만 그대로 센 값입니다.`];
  const firstSentence = t => { const m = t.match(/^[\s\S]*?(다\.|\. )(?=\s|$)/); return (m ? m[0] : t).trim(); };   // 옛 Safari 를 위해 lookbehind 는 쓰지 않는다

  const DIR = { '+': ['up', '▲', '밀어줌'], '-': ['down', '▼', '막음'], '±': ['both', '◆', '양쪽'] };
  const CONF = { '0.3': ['conf-low', 1, '낮음'], '0.6': ['conf-mid', 2, '보통'], '0.8': ['conf-high', 3, '높음'] };
  const SC = ['s0', 's1', 's2', 's3', 's4', 's5', 's6', 's7'];
  const ALIGNED = ['aligned3', 'aligned2', 'aligned1'], CONTESTED = ['headwind', 'mixed'];
  const axIdx = a => D.axes.indexOf(a);
  const axCls = a => 'ax' + axIdx(a);
  const axTag = a => `<span class="axtag ${axCls(a)}">${esc(a)}</span>`;
  const dots = n => `<i aria-hidden="true">${[1, 2, 3].map(k => `<s${k <= n ? '' : ' class="off"'}></s>`).join('')}</i>`;
  /* 페이지 제목: 위치(eyebrow) → h1 → 한 줄 설명 → 자료 범위. 화면마다 같은 순서라 어디에 무엇이 있는지 외울 필요가 없다 */
  const pageHead = ({ eyebrow = '', title, lede = '', meta = [] }) => `<header class="ph">${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h1 tabindex="-1">${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}${meta.length ? `<ul class="metas" aria-label="자료 범위">${meta.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}</header>`;
  const crumb = (href, label) => `<a href="${href}">${label}</a><span class="sep" aria-hidden="true">›</span>`;
  const secHead = (title, note = '', action = '', id = '') => `<div class="sh"><h2 class="sec"${id ? ` id="${id}"` : ''}>${title}</h2>${action ? `<span class="sh-act">${action}</span>` : ''}${note ? `<p class="sec-note">${note}</p>` : ''}</div>`;
  /* 기호 설명은 처음 보는 사람에게만 필요하다. 접어 두고 필요할 때 펼친다 */
  const legendBox = (items, label = '기호 읽는 법') => `<details class="legend"><summary>${label}</summary><div><dl>${items.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></details>`;
  const dirBadge = v => { const d = DIR[String(v).trim()]; return d ? `<span class="dir ${d[0]}" title="방향 ${esc(v)}"><i>${d[1]}</i>${d[2]}</span>` : esc(v); };
  const confBadge = v => { const c = CONF[String(Number(v))]; return c ? `<span class="conf ${c[0]}" title="확신 ${esc(v)}">${dots(c[1])}${c[2]}</span>` : esc(v); };
  const stBadge = v => { const t = String(v).trim().toLowerCase(); return t === 'true' ? `<span class="st yes" title="문서로 남은 확정 사실">확정</span>` : t === 'false' ? `<span class="st no" title="발언·보도·조사 단계">미확정</span>` : esc(v); };
  const KEY_ITEMS = [
    ['구조적', `<span class="st yes">확정</span> 문서로 남은 것 · <span class="st no">미확정</span> 발언·보도 단계`],
    ['방향', `그 섹터를 <span class="dir up"><i>▲</i>밀어줌</span> · <span class="dir down"><i>▼</i>막음</span> · <span class="dir both"><i>◆</i>양쪽</span>`],
    ['확신', `사실이 맞는가. <span class="conf conf-low">${dots(1)}낮음 0.3</span> · <span class="conf conf-mid">${dots(2)}보통 0.6</span> · <span class="conf conf-high">${dots(3)}높음 0.8</span>`],
  ];
  const KEYS = legendBox(KEY_ITEMS);
  const MARKET_KEY = ['시장 반응', '시그널 전날 종가 대비 시그널 티커 평균 수익률과 같은 기간 SPY. 판정은 끝난 가장 긴 구간(20 → 5 → 최근 3거래일 이상)에서 SPY 보다 방향대로 움직였는지 (±0.5%p 안은 보합). 판단 재료이지 매매 신호가 아닙니다.'];
  const fmtNet = v => (Math.abs(v) < 0.005 ? '0' : (v > 0 ? '+' : '') + v.toFixed(2));
  const netCls = v => (v > 0 ? 'gs' : v < 0 ? 'ss' : 'dim');
  const pctCls = s => (s == null ? 'dim' : s >= 60 ? 'gs' : s <= 40 ? 'ss' : 'ns');
  const pctText = s => (s == null ? '–' : `${s}%`);
  /* 7일 변화. 값이 없는데 신호는 있으면 7일 전에는 점수가 없던 섹터 = 신규 */
  const deltaHtml = (v, n) => (v == null ? `<span class="dim small">${n ? '신규' : '–'}</span>` : `<span class="small ${v > 0 ? 'gs' : v < 0 ? 'ss' : 'dim'}">${v > 0 ? '+' : ''}${v}p</span>`);
  const labelHtml = l => `<span class="lbl lbl-${esc(l)}">${esc(D.labels[l] || l)}</span>`;
  const sectorLink = (s, mode) => (D.sectors[s] ? `<a href="#/sector/${enc(s)}${sfx(mode)}">${esc(s)}</a>` : `<span title="sector_map 에 없는 섹터">${esc(s)}</span>`);
  const tile = (v, l, cls) => `<div class="kpi"><b${cls ? ` class="${cls}"` : ''}>${v}</b><span>${l}</span></div>`;
  const banner = () => (D.warnings && D.warnings.length ? `<div class="warn" role="alert"><b>빌드 경고 ${D.warnings.length}건.</b> 자료 일부가 빠진 채 만들어졌습니다.<ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '');
  /* 장부가 창보다 짧으면 그 창은 장부 첫날부터다. 그 사실을 화면에 적는다 */
  /* ---- 시장 반응: 장부 줄 번호 → 사건 전날(장부 날짜 이틀 전) 종가 대비 티커 평균 수익률과 SPY. build.py 가 fetch/market.py 로 계산 ---- */
  const pctS = v => (v > 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
  const rcls = v => v > 0.0005 ? 'gs' : v < -0.0005 ? 'ss' : 'ns';
  const VLBL = { '방향대로': 'lbl-aligned2', '반대로': 'lbl-headwind', '보합': '', '아직': 'dim', '±': 'dim' };
  function marketHtml(line) {
    const x = D.market && D.market[line];
    if (!x) return '';
    const hs = Object.entries(x.h).filter(([, v]) => v).map(([h, v]) => `<span>${h}일 <b class="${rcls(v.r)}">${pctS(v.r)}</b> <span class="dim small">SPY ${pctS(v.spy)}</span></span>`);
    if (!hs.length && x.latest) hs.push(`<span>${x.latest.days}거래일 <b class="${rcls(x.latest.r)}">${pctS(x.latest.r)}</b> <span class="dim small">SPY ${pctS(x.latest.spy)}</span></span>`);
    const v = x.verdict ? `<span class="lbl ${VLBL[x.verdict] || ''}">${x.verdict}</span>` : '';
    return `<div class="mkt"><span class="dim small">시장 반응 · ${x.base.slice(5).replace('-', '/')} 종가 기준</span>${hs.length ? hs.join('') : '<span class="dim small">아직 거래일 없음</span>'}${v}</div>`;
  }
  const ledgerNote = () => { if (!D.first_date) return ''; const short = D.params.windows.filter(n => D.board['w' + n] && D.first_date > D.board['w' + n].from); return `장부는 ${D.first_date}부터${short.length ? ` (${short.map(winName).join('·')} 창은 그날부터)` : ''}`; };

  /* 축 점수 미니 막대: −1 ~ +1. 왼쪽(빨강) 막음, 오른쪽(파랑) 밀어줌 */
  function axisBar(a, net, n, withLabel = true) {
    const tip = `${a} ${fmtNet(net)}${n != null ? `, ${n}건` : ''}`;
    const track = `<span class="axt"${withLabel ? '' : ' style="grid-column:1/-1"'}><span class="axneg">${net < 0 ? `<i style="width:${(-net * 100).toFixed(0)}%"></i>` : ''}</span><span class="axpos">${net > 0 ? `<i style="width:${(net * 100).toFixed(0)}%"></i>` : ''}</span></span>`;
    return withLabel ? `<span class="axb" title="${esc(tip)}"><span class="axl">${esc(a)}</span>${track}<span class="axv ${netCls(net)}">${fmtNet(net)}</span></span>`
      : `<span class="axb" title="${esc(tip)}">${track}</span><span class="small ${netCls(net)}">${fmtNet(net)}</span>`;
  }
  const axes3 = axes => `<div class="axes3">${D.axes.map(a => { const x = axes[a]; const net = typeof x === 'number' ? x : x.net; return axisBar(a, net, typeof x === 'object' ? x.n : null); }).join('')}</div>`;

  /* ---- 마크다운 ---- */
  function md(text) {
    const el = document.createElement('div');
    el.className = 'md';
    const safe = text.split(/(`[^`]*`)/).map((seg, i) => (i % 2 ? seg : seg.replace(/~/g, '&#126;'))).join('');   // "3.50~3.75%" 의 물결표가 취소선이 되지 않게
    el.innerHTML = marked.parse(safe, { gfm: true, breaks: false });
    el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    el.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    return el;
  }
  const inlineMd = t => md(t).innerHTML.replace(/^\s*<p>/, '').replace(/<\/p>\s*$/, '');
  const plain = t => t.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '');
  function decorateTables(root) {
    root.querySelectorAll('table').forEach(t => {
      const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
      const cols = { dir: heads.indexOf('방향'), conf: heads.indexOf('확신'), st: heads.indexOf('구조적') };
      if (cols.dir < 0 && cols.conf < 0 && cols.st < 0) return;
      t.querySelectorAll('tbody tr').forEach(tr => {
        const tds = tr.children;
        if (cols.dir >= 0 && tds[cols.dir]) tds[cols.dir].innerHTML = dirBadge(tds[cols.dir].textContent);
        if (cols.conf >= 0 && tds[cols.conf]) tds[cols.conf].innerHTML = confBadge(tds[cols.conf].textContent);
        if (cols.st >= 0 && tds[cols.st]) tds[cols.st].innerHTML = stBadge(tds[cols.st].textContent);
      });
    });
  }

  /* ---- 방향 브리프 (briefs/direction.md). "한 줄 요약" 절은 바로 보이고, 나머지는 펼쳐 읽는다 ---- */
  function dirBriefParts(text) {
    const date = (text.match(/^# .*?(\d{4}-\d{2}-\d{2})/m) || [])[1] || '';
    const body = text.replace(/^# .*\n/, '');
    const k = body.search(/^## /m), intro = (k < 0 ? body : body.slice(0, k)).trim();
    const secs = splitSections(body), lead = secs.find(x => /^한 줄 요약/.test(x.title)), rest = secs.filter(x => x !== lead);
    return { date, lead: lead ? lead.md.trim() : intro, full: (lead ? intro + '\n\n' : '') + rest.map(x => `## ${x.title}\n${x.md}`).join('\n'),
      count: rest.filter(x => /^\d/.test(x.title)).length, minutes: Math.max(1, Math.round(body.length / 500)) };
  }

  /* ---- 브리프. 카드는 build.py 가 구조화한 signals 로 그리고, 나머지 절만 마크다운으로 그린다 ---- */
  const briefCache = {};
  function fetchBrief(b) {
    if (b.md) return Promise.resolve(b.md);
    if (!briefCache[b.date]) briefCache[b.date] = fetch(`briefs/${b.date}.md`, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
    return briefCache[b.date];
  }
  const splitSections = text => text.split(/^## /m).slice(1).map(p => { const nl = p.indexOf('\n'); return { title: p.slice(0, nl).trim(), md: p.slice(nl + 1) }; });
  /* 이득·손해: 한 줄에 라벨, 티커, 이유. 이득 먼저 */
  function gainLoss(gl) {
    const rows = gl.slice().sort((a, c) => (a.kind === 'gain' ? 0 : 1) - (c.kind === 'gain' ? 0 : 1));
    return `<div class="gls">` + rows.map(g => {
      const up = g.kind === 'gain';
      const tk = g.tickers.length ? g.tickers.map(t => `<span class="chip">${esc(t)}</span>`).join('') : '<span class="dim small">티커 없음</span>';
      return `<div class="glr ${up ? 'up' : 'down'}"><span class="glk"><i aria-hidden="true">${up ? '▲' : '▼'}</i>${up ? '이득' : '손해'}</span><span class="glt">${tk}</span><p class="gly">${inlineMd(g.why)}</p></div>`;
    }).join('') + `</div>`;
  }
  function signalCard(s) {
    const gl = (s.easy && s.easy.gl) || [];
    const title = s.easy ? s.easy.name : firstSentence(plain(s.fact)).slice(0, 70);
    return `<article class="sig"><header>${axTag(s.axis)}${s.structural == null ? '' : stBadge(s.structural)}${dirBadge(s.direction)}${confBadge(s.confidence)}<span class="dim small">${sectorLink(s.sector)}</span></header><h3>${esc(title)}</h3>` +
      (s.easy ? s.easy.parts.map(([k, v]) => `<p><b>${esc(k)}</b>${inlineMd(v)}</p>`).join('') : '') +
      (gl.length ? gainLoss(gl) : s.tickers.length ? `<div class="chips">${s.tickers.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : '') + (s.line ? marketHtml(s.line) : '') +
      `<details><summary>근거와 출처</summary><p>${inlineMd(s.fact)}</p>${s.interp ? `<p class="dim">${inlineMd(s.interp)}</p>` : ''}</details></article>`;
  }
  /* compact: 오늘 탭용. 축별 카드만 두고 섹터 정렬·버린 뉴스·30일 누적·시장 반응·맵 수정 제안은 브리프 탭(#/brief/날짜)에만 */
  function renderBrief(container, b, text, compact) {
    const secs = splitSections(text);
    const isAxis = t => D.axes.includes(t), isEasy = t => t.startsWith('쉬운 말로');
    let cards = '';
    for (const a of D.axes) {
      const list = b.signals.filter(s => s.axis === a), sec = secs.find(x => x.title === a);
      if (!sec) continue;
      cards += `<h3 class="axh ${axCls(a)}"><i class="sw2"></i>${esc(a)} <span class="dim">${list.length ? `${list.length}건` : '해당 없음'}</span></h3>`;
      if (list.length) cards += `<div class="sigs">${list.map(signalCard).join('')}</div>`;
    }
    container.innerHTML = KEYS + cards + (b.none_today ? `<p class="keys">오늘 구조적 시그널 없음. 위 카드는 아직 확정되지 않은 재료입니다.</p>` : '');
    const rest = secs.filter(x => !isAxis(x.title) && !isEasy(x.title));
    if (compact) {
      if (rest.length) container.insertAdjacentHTML('beforeend', `<p class="keys">${rest.map(x => esc(x.title.replace(/\s*\(.*\)\s*$/, ''))).join(' · ')}은 <a href="#/brief/${esc(b.date)}">브리프 탭</a>에서 봅니다.</p>`);
    } else for (const x of rest) container.appendChild(md('## ' + x.title + '\n' + x.md));
    const dd = document.createElement('details'); dd.className = 'more'; dd.innerHTML = '<summary>원본 시그널 표 · 해석 · 확인 방법 메모</summary>';
    for (const x of secs.filter(x => isAxis(x.title) || isEasy(x.title))) dd.appendChild(md('## ' + x.title + '\n' + x.md));
    container.appendChild(dd);
    decorateTables(container);
  }
  /* 카드 박스가 max px 를 넘으면 접고 아래쪽 그라데이션 위에 글자 버튼 "더 보기". 안 넘으면 그대로. 펼치면 "접기"
     접는 높이는 max 와 "제목 아래 + 그라데이션 높이" 중 큰 값이라 제목은 가리지 않는다. 접어도 거의 안 줄어드는 카드는 그대로 둔다 */
  const FOLD_FADE = 76;
  function clampCard(card, max) {
    const old = card.querySelector(':scope > .more-txt'); if (old) old.remove();
    card.classList.remove('folded'); card.style.removeProperty('--fold-h');
    const natural = card.offsetHeight;
    if (natural <= max) return;
    const t = card.querySelector('h3'), titleBottom = t ? t.offsetTop + t.offsetHeight : 0;
    const foldH = Math.max(max, titleBottom + FOLD_FADE - 4);
    if (natural <= foldH + 8) return;
    if (!card.id) card.id = 'sig-' + Math.random().toString(36).slice(2, 8);
    card.style.setProperty('--fold-h', foldH + 'px'); card.classList.add('folded');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'more-txt'; btn.setAttribute('aria-controls', card.id); btn.setAttribute('aria-expanded', 'false'); btn.textContent = '더 보기';
    btn.addEventListener('click', () => {
      const open = card.classList.toggle('folded') === false;
      btn.setAttribute('aria-expanded', String(open)); btn.textContent = open ? '접기' : '더 보기';
      if (!open) { const top = card.getBoundingClientRect().top; if (top < 0) window.scrollBy(0, top - 80); }
    });
    card.appendChild(btn);
  }
  function mountBrief(container, b, opts = {}) {
    container.innerHTML = `<p class="loading">브리프 불러오는 중</p>`;
    fetchBrief(b).then(text => {
      if (!container.isConnected) return;
      renderBrief(container, b, text, opts.compact);
      if (opts.clamp) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => container.querySelectorAll('.sig').forEach(c => clampCard(c, opts.clamp)));
    })
      .catch(e => { container.innerHTML = `<p class="empty">briefs/${esc(b.date)}.md 를 불러오지 못했습니다 (${esc(e.message)}).</p>`; });
  }

  /* ---- 차트 (SVG 직접). 폭은 컨테이너에 맞추고 창 크기가 바뀌면 다시 그린다 ---- */
  const mdShort = d => { const [, m, dd] = d.split('-').map(Number); return `${m}/${dd}`; };
  const xStep = n => (n > 200 ? Math.ceil(n / 24) : n > 40 ? 14 : 7);   // 라벨 25개 안팎으로. 누적·긴 창은 날짜가 수백 개
  function frame(el, { H, m, lo, hi, n, label, ticks, fmtY, band }) {
    const W = Math.max(280, el.clientWidth || 440), iw = W - m.l - m.r, ih = H - m.t - m.b;
    const x = i => m.l + (band ? (i + 0.5) * (iw / n) : (n > 1 ? i / (n - 1) * iw : iw / 2)), y = v => m.t + (hi - v) / (hi - lo) * ih;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">`;
    for (const v of ticks) s += `<line class="grid${v === 50 && hi === 100 ? ' zero' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="tick" x="${m.l - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtY(v)}</text>`;
    return { W, H, m, iw, ih, x, y, open: s };
  }
  const dateAxis = (f, dates) => { let s = ''; const n = dates.length; for (let i = n - 1; i >= 0; i -= xStep(n)) s += `<text class="tick" x="${f.x(i).toFixed(1)}" y="${f.H - 8}" text-anchor="middle">${mdShort(dates[i])}</text>`; return s; };

  /* 정렬 % 라인: 값은 0~100, 신호 없는 날(null)은 선을 끊는다. 홑점은 점으로. 직접 라벨은 4개까지, 그 이상은 범례(칩)로 */
  function pctLines(el, dates, sers, { label, H = 240, endLabels = true } = {}) {
    if (!dates.length) { el.innerHTML = `<p class="empty">아직 장부에 자료가 없습니다.</p>`; return; }
    endLabels = endLabels && sers.length <= 4;
    const n = dates.length;
    const f = frame(el, { H, m: { l: 36, r: endLabels ? 124 : 14, t: 12, b: 26 }, lo: 0, hi: 100, n, label, ticks: [0, 25, 50, 75, 100], fmtY: v => v + '%' });
    let s = f.open + dateAxis(f, dates);
    const ends = [];
    sers.forEach(sr => {
      let seg = [];
      const flush = () => {
        if (seg.length === 1) s += `<circle class="pt ${sr.cls}" cx="${seg[0][0]}" cy="${seg[0][1]}" r="3.5"/>`;
        else if (seg.length > 1) s += `<path class="ln ${sr.cls}" d="M${seg.map(p => p.join(',')).join('L')}"/>`;
        seg = [];
      };
      sr.values.forEach((v, i) => { if (v == null) { flush(); return; } seg.push([f.x(i).toFixed(1), f.y(v).toFixed(1)]); });
      flush();
      let li = n - 1; while (li >= 0 && sr.values[li] == null) li--;
      if (li >= 0) ends.push({ cls: sr.cls, name: sr.name, v: sr.values[li], y: f.y(sr.values[li]) });
    });
    if (endLabels) {
      ends.sort((p, q) => p.y - q.y);
      for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
      for (let i = ends.length - 1; i >= 0; i--) { if (ends[i].y > f.H - f.m.b - 2) ends[i].y = f.H - f.m.b - 2; if (i < ends.length - 1 && ends[i + 1].y - ends[i].y < 13) ends[i].y = ends[i + 1].y - 13; }
      for (const e of ends) s += `<text class="lab ${e.cls}" x="${f.W - f.m.r + 8}" y="${(e.y + 4).toFixed(1)}">${esc(e.name)} ${e.v}%</text>`;
    }
    s += `<line class="xh" x1="0" x2="0" y1="${f.m.t}" y2="${f.H - f.m.b}" style="display:none"/><rect class="hit" x="${f.m.l}" y="${f.m.t}" width="${f.iw}" height="${f.ih}"/>`;
    el.innerHTML = s + `</svg><div class="tip" hidden></div>`;
    hover(el, f, dates, sers, v => `${v}%`);
  }
  /* 호버: 세로선 + 그날의 값 툴팁 */
  function hover(el, f, dates, sers, fmt) {
    const svg = el.querySelector('svg'), hit = el.querySelector('rect.hit'), xh = el.querySelector('line.xh'), tip = el.querySelector('.tip');
    const n = dates.length;
    hit.addEventListener('mousemove', ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (f.W / r.width);
      const i = Math.max(0, Math.min(n - 1, Math.round((px - f.m.l) / (n > 1 ? f.iw / (n - 1) : 1))));
      const x = f.x(i); xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.style.display = '';
      const rows = sers.map(sr => (sr.values[i] == null ? '' : `<div><i class="${sr.cls}"></i>${esc(sr.name)} <b>${fmt(sr.values[i])}</b></div>`)).join('');

      const ax = x.axes[a], ev = rows.filter(r => r.axis === a);
      h += `<div class="panel full"><h3><span>${axTag(a)} <span class="${netCls(ax.net)}">${fmtNet(ax.net)}</span></span><span class="dim">${ax.n}건 · <span class="dir up"><i>▲</i>${ax.up}</span> <span class="dir down"><i>▼</i>${ax.down}</span> <span class="dir both"><i>◆</i>${ax.both}</span> · 가중 합 ${ax.raw > 0 ? '+' : ''}${ax.raw}</span></h3>` +
        (ev.length ? `<ul class="feed">` + ev.map(r => `<li><div class="meta"><span class="date">${r.date}</span>${dirBadge(r.direction)}${confBadge(r.confidence)}<span class="dim small">${esc(r.horizon)} · 크기 ${esc(r.impact)} · ${esc(r.channel)}${r.reverses ? ` · 번복 줄 ${r.reverses}` : ''}${live ? ` · 남은 비중 ${Math.round(remainOf(r) * 100)}%` : ''}</span><span class="dim small">${(r.tickers || []).map(esc).join(', ')}</span></div>${esc(r.fact)} <a href="${esc(r.source)}" target="_blank" rel="noopener">출처</a><br><span class="small dim">${esc(r.note)}</span>${marketHtml(r.line)}</li>`).join('') + `</ul>` : `<p class="empty">이 축의 근거가 아직 없습니다. "아직 모른다"이지 "아니다"가 아닙니다.</p>`) + `</div>`;
    }
    h += `</section>`;
    app.innerHTML = h;
    REDRAW = () => pctLines(app.querySelector('[data-chart="sector"]'), S.dates, [{ name, cls: 's0', values: S.sectors[name] }], { label: `${name} 정렬 % 추이`, endLabels: false });
    REDRAW();
  }

  /* 추이: 섹터 선택은 최대 8개. 색은 선택한 섹터에 고정되고 다른 섹터를 껐다 켜도 바뀌지 않는다. 창을 바꾸면 그 창에 신호 없는 섹터는 선택에서 빠진다 */
  let SEL = null; const SLOT = new Map();
  const slotOf = name => { if (!SLOT.has(name)) { const used = new Set(SLOT.values()); SLOT.set(name, SC.find(c => !used.has(c)) || SC[SC.length - 1]); } return SLOT.get(name); };
  function trend(arg) {
    const mode = modeOf(arg), B = board(mode), S = serOf(mode), A = D.activity[mode] || D.activity.live, c = B.counts, mn = modeName(mode);
    const active = B.sectors.filter(x => x.n), activeNames = new Set(active.map(x => x.sector));
    if (!SEL) SEL = active.slice().sort((a, b) => (Math.abs(b.score - 50) - Math.abs(a.score - 50)) || (b.n - a.n)).slice(0, 6).map(x => x.sector);
    for (const s of SEL) if (!activeNames.has(s)) SLOT.delete(s);
    SEL = SEL.filter(s => activeNames.has(s));
    SEL.forEach(slotOf);
    let h = pageHead({ eyebrow: '추이', title: '근거는 어떻게 바뀌어 왔나', lede: '정렬 %를 날마다 그날 기준으로 다시 계산해 선으로 그렸습니다. 누적은 수준, 최근 30일은 새로 들어온 근거입니다. 선 위에 마우스를 올리면 그날 값이 보입니다.', meta: [`기준일 ${D.today}`, `장부 전체 ${D.ledger.length}건`, ledgerNote()].filter(Boolean).map(esc) });
    if (!D.ledger.length) { app.innerHTML = h + `<p class="empty">장부가 비어 있습니다.</p>`; REDRAW = null; return; }
    h += segTabs('#/trend', mode, spanText(B), true);
    h += `<section class="dash"><div class="kpis full">` + tile(B.total, `${mn} 구조적 시그널`) + tile(A.axes.map(x => `<span class="axn ${axCls(x.axis)}" title="${esc(x.axis)} ${x.count}건"><i class="sw2" aria-hidden="true"></i>${x.count}</span>`).join(' <small>/</small> '), `${D.axes.join(' / ')} 건수`) +
      tile(`${c.aligned3 + c.aligned2} <small>3축 ${c.aligned3}</small>`, '2축 이상 정렬 섹터') + tile(`${c.headwind} <small>엇갈림 ${c.mixed}</small>`, '역풍 섹터') + `</div>`;
    h += `<div class="panel full"><h3>섹터 정렬 % 추이 <span class="dim">섹터를 눌러 켜고 끕니다 (최대 8개). 처음에는 중립(50%)에서 먼 섹터가 켜져 있습니다.</span></h3><div class="seg" style="margin:0 0 8px" role="group" aria-label="섹터 선택">` +
      active.sort(byScore).map(x => `<button type="button" data-sel="${esc(x.sector)}" aria-pressed="${SEL.includes(x.sector)}" class="${SEL.includes(x.sector) ? slotOf(x.sector) : ''}"><i></i>${esc(x.sector)} ${x.score}%</button>`).join('') + `</div><div class="chart-box" data-chart="sectors"></div></div>`;
    h += `<div class="panel full"><h3>방향 정렬 % 추이 <span class="dim">소속 섹터의 평균</span></h3>${legend(B.directions.map((x, i) => [x.direction, SC[i % SC.length]]))}<div class="chart-box" data-chart="directions"></div></div>`;
    h += `<div class="panel full"><h3>일별 시그널 <span class="dim">축별로 쌓음</span></h3>${axisLegend()}<div class="chart-box" data-chart="daily"></div></div>`;
    h += `<div class="panel full"><h3>축별 상세 <span class="dim">${mn}. 방향은 섹터 기준</span></h3><div class="tbl"><table><thead><tr><th>축</th><th class="num">건수</th><th class="num">비중</th><th class="num">밀어줌 / 막음 / 양쪽</th><th class="num">평균 확신</th><th>상위 섹터</th><th>상위 티커</th></tr></thead><tbody>` +
      A.axes.map(x => `<tr><td class="nowrap">${axTag(x.axis)}</td><td class="num">${x.count}</td><td class="num">${A.total ? Math.round(x.share * 100) + '%' : '–'}</td><td class="num">${x.dir['+']} / ${x.dir['-']} / ${x.dir['±']}</td><td class="num">${x.avg_conf ?? '–'}</td><td class="small">${x.sectors.map(([k, v]) => `${esc(k)}(${v})`).join(', ') || '–'}</td><td class="small">${x.tickers.map(([k, v]) => `${esc(k)}(${v})`).join(', ') || '–'}</td></tr>`).join('') + `</tbody></table></div></div></section>`;
    app.innerHTML = h;
    const drawSectors = () => pctLines(app.querySelector('[data-chart="sectors"]'), S.dates, SEL.map(s => ({ name: s, cls: slotOf(s), values: S.sectors[s] })), { label: `섹터 정렬 % 추이, ${mn}` });
    const drawAll = () => {
      drawSectors();
      pctLines(app.querySelector('[data-chart="directions"]'), S.dates, B.directions.map((x, i) => ({ name: x.direction, cls: SC[i % SC.length], values: S.directions[x.direction] })), { label: `방향 정렬 % 추이, ${mn}` });
      const { days: dd, per } = dailyCounts(D.ledger, B.from, B.to);
      stackChart(app.querySelector('[data-chart="daily"]'), dd, D.axes.map(a => ({ name: a, cls: axCls(a), counts: per[axIdx(a)] })), `일별 구조적 시그널 건수, ${B.from} ~ ${B.to}`);
    };
    app.querySelectorAll('button[data-sel]').forEach(btn => btn.addEventListener('click', () => {
      const s = btn.dataset.sel;
      if (SEL.includes(s)) { SEL = SEL.filter(z => z !== s); SLOT.delete(s); btn.setAttribute('aria-pressed', 'false'); btn.className = ''; }
      else if (SEL.length >= 8) { return; }
      else { SEL = [...SEL, s]; btn.setAttribute('aria-pressed', 'true'); btn.className = slotOf(s); }
      drawSectors();
    }));
    REDRAW = drawAll;
    drawAll();
  }

  function ledger() {
    REDRAW = null;
    const rows = [...D.ledger].sort((a, b) => b.date.localeCompare(a.date) || b.line - a.line);
    rows.forEach(r => { r._q = [r.sector, r.fact, r.note, (r.tickers || []).join(' ')].join(' ').toLowerCase(); });
    const sectorNames = [...new Set([...Object.keys(D.sectors), ...rows.map(r => r.sector).filter(Boolean)])];   // 맵에 없는 옛 섹터도 고를 수 있게
    app.innerHTML = pageHead({ eyebrow: '장부', title: '쌓인 근거 전부', lede: '문서로 확정된 구조적 시그널만 쌓입니다. 한 줄이 한 사건이고, 추가만 하고 고치지 않습니다.', meta: [`전체 ${D.ledger.length}건`, D.first_date ? `${D.first_date}부터` : '', D.market_meta ? `종가 ${D.market_meta.asof} 까지 (${esc(D.market_meta.source.split(' (')[0])})` : ''].filter(Boolean) }) +
      `<div class="filters"><label>축 <select id="f-axis"><option value="">전체</option>${D.axes.map(a => `<option>${a}</option>`).join('')}</select></label>` +
      `<label>섹터 <select id="f-sector"><option value="">전체</option>${sectorNames.map(s => `<option>${esc(s)}</option>`).join('')}</select></label>` +
      `<label>기간 <select id="f-days"><option value="">전체</option>${D.params.windows.map(n => `<option value="${n}">최근 ${winName(n)}</option>`).join('')}</select></label>` +
      `<label class="q">검색 <input type="search" id="f-q" placeholder="섹터, 티커, 팩트"></label><span class="count" id="f-count" aria-live="polite"></span></div>` + legendBox([...KEY_ITEMS, MARKET_KEY]) + `<div id="ledger-table"></div>`;
    const meta = r => `${esc(r.horizon)} · 크기 ${esc(r.impact)} · ${esc(r.channel)}${r.reverses ? ` · 번복 줄 ${r.reverses}` : ''}`;
    const draw = () => {
      const ax = document.getElementById('f-axis').value, sc = document.getElementById('f-sector').value, days = Number(document.getElementById('f-days').value), q = document.getElementById('f-q').value.trim().toLowerCase();
      const cut = days ? new Date(new Date(D.today).getTime() - days * 864e5).toISOString().slice(0, 10) : '';
      const sel = rows.filter(r => (!ax || r.axis === ax) && (!sc || r.sector === sc) && (!cut || r.date > cut) && (!q || r._q.includes(q)));
      document.getElementById('f-count').textContent = `${sel.length}건`;
      document.getElementById('ledger-table').innerHTML = sel.length ? `<div class="tbl wide"><table><thead><tr><th>날짜</th><th>축</th><th>섹터</th><th class="fact">팩트</th><th>티커</th><th>방향</th><th>확신</th><th>기간 · 크기 · 경로</th><th class="note">해석</th></tr></thead><tbody>` +
        sel.map(r => `<tr><td class="date">${r.date}<br><span class="dim small">줄 ${r.line}</span></td><td class="nowrap">${axTag(r.axis)}</td><td class="nowrap">${sectorLink(r.sector)}</td><td class="fact">${esc(r.fact)} <a href="${esc(r.source)}" target="_blank" rel="noopener">출처</a>${marketHtml(r.line)}</td><td class="nowrap">${(r.tickers || []).map(esc).join(', ')}</td><td>${dirBadge(r.direction)}</td><td>${confBadge(r.confidence)}</td><td class="small nowrap">${meta(r)}</td><td class="small note">${esc(r.note)}</td></tr>`).join('') +
        `</tbody></table></div>` : `<p class="empty">조건에 맞는 줄이 없습니다.</p>`;
    };
    ['f-axis', 'f-sector', 'f-days'].forEach(id => document.getElementById(id).addEventListener('change', draw));
    document.getElementById('f-q').addEventListener('input', debounce(draw, 150));
    draw();
  }

  function briefs() {
    REDRAW = null;
    app.innerHTML = pageHead({ eyebrow: '브리프', title: '일간 브리프', lede: '매일 아침 그날 뉴스를 세 축으로 나눠 쓴 브리프입니다.', meta: [`${D.briefs.length}건`] }) + (D.briefs.length ?
      `<div class="tbl wide" style="margin-top:24px"><table style="min-width:0"><thead><tr><th>날짜</th><th class="num">구조적 시그널</th><th class="num">시그널 카드</th></tr></thead><tbody>` +
      D.briefs.map(b => `<tr><td class="date"><a href="#/brief/${b.date}">${fmtDate(b.date)}</a></td><td class="num">${b.none_today ? '없음' : b.structural}</td><td class="num">${b.signals.length}</td></tr>`).join('') + `</tbody></table></div>` :
      `<p class="empty">아직 브리프가 없습니다. 다음 /brief 부터 쌓입니다.</p>`);
  }
  function brief(date) {
    const i = D.briefs.findIndex(x => x.date === date);
    if (i < 0) { app.innerHTML = `<p class="empty">${esc(date)} 브리프가 없습니다. <a href="#/briefs">브리프 목록</a></p>`; REDRAW = null; return; }
    REDRAW = null;
    const b = D.briefs[i], prev = D.briefs[i + 1], next = D.briefs[i - 1];
    app.innerHTML = pageHead({ eyebrow: crumb('#/briefs', '브리프') + esc(b.date), title: `${fmtDate(b.date)} 브리프`, meta: [`구조적 ${b.none_today ? '없음' : b.structural + '건'}`, rawLine(b.date)].filter(Boolean).map(esc) }) + `<div id="brief" style="margin-top:24px"></div>` +
      `<nav class="pager" aria-label="브리프 이동"><span>${prev ? `<a href="#/brief/${prev.date}" rel="prev">← 이전 ${prev.date}</a>` : ''}</span><span>${next ? `<a href="#/brief/${next.date}" rel="next">다음 ${next.date} →</a>` : ''}</span></nav>`;
    mountBrief(document.getElementById('brief'), b);
  }
  const fwCache = {};
  const fetchText = p => { if (!fwCache[p]) fwCache[p] = fetch(p, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }); return fwCache[p]; };
  function framework() {
    REDRAW = null;
    app.innerHTML = pageHead({ eyebrow: '기준', title: '판단 기준', lede: 'framework/axes.md, sector_map.yaml, sources.yaml 을 그대로 보여줍니다. Ken 이 고칩니다.', meta: [`K = ${D.params.K}`, `기간 가중 ${Object.entries(D.params.HW).map(([k, v]) => `${k} ${v}`).join(' · ')}`, `유효기간 ${validityText()}`, '구현 fetch/scoring.py'] }) + `<div id="axes" style="margin-top:24px"><p class="loading">불러오는 중</p></div><h2 class="sec">방향·섹터·티커 <span class="dim">framework/sector_map.yaml</span></h2><pre class="yaml" id="smap"></pre><h2 class="sec">수집 소스 <span class="dim">framework/sources.yaml</span></h2><pre class="yaml" id="srcs"></pre>`;
    Promise.all([fetchText('framework/axes.md'), fetchText('framework/sector_map.yaml'), fetchText('framework/sources.yaml')]).then(([a, s, r]) => {
      const ax = document.getElementById('axes'); if (!ax) return;
      ax.innerHTML = ''; ax.appendChild(md(a)); document.getElementById('smap').textContent = s; document.getElementById('srcs').textContent = r;
    }).catch(e => { const ax = document.getElementById('axes'); if (ax) ax.innerHTML = `<p class="empty">기준 문서를 불러오지 못했습니다 (${esc(e.message)}).</p>`; });
  }

  /* 이용약관·개인정보처리방침: site/legal/*.md 를 그대로 보여준다. [입력 필요 ...]·[확인 필요 ...] 는 운영자가 채울 자리라 눈에 띄게 표시 */
  function legal(file, title, lede) {
    REDRAW = null;
    app.innerHTML = pageHead({ eyebrow: '안내', title, lede }) + `<div id="legal" style="margin-top:24px"><p class="loading">불러오는 중</p></div>`;
    fetchText(`legal/${file}`).then(t => {
      const box = document.getElementById('legal'); if (!box) return;
      const todo = (t.match(/\[(입력 필요|확인 필요)[^\]]*\]/g) || []).length;
      box.innerHTML = todo ? `<p class="todo-note" role="note">아직 채우지 않은 항목이 ${todo}곳 있습니다. 표시된 자리는 운영자가 사실을 확인해 채워야 합니다.</p>` : '';
      box.appendChild(md(t.replace(/^# .*\n/, '').replace(/\[(입력 필요|확인 필요)[^\]]*\]/g, m => `<mark class="todo">${esc(m)}</mark>`)));
    }).catch(e => { const box = document.getElementById('legal'); if (box) box.innerHTML = `<p class="empty">문서를 불러오지 못했습니다 (${esc(e.message)}).</p>`; });
  }
  const terms = () => legal('terms.md', '이용약관', 'Radar 를 이용할 때의 조건입니다.');
  const privacy = () => legal('privacy.md', '개인정보처리방침', '이 사이트가 방문자의 정보를 어떻게 다루는지 적었습니다.');
  const views = { home, sectors, sector, trend, ledger, briefs, brief, framework, terms, privacy };
  const titles = { home: 'Radar', sectors: '섹터', sector: '섹터', trend: '추이', ledger: '장부', briefs: '브리프', brief: '브리프', framework: '기준', terms: '이용약관', privacy: '개인정보처리방침' };
  function route() {
    if (!D) return;
    const [seg, a1, a2] = location.hash.replace(/^#\/?/, '').split('/');
    const name = views[seg] ? seg : 'home';
    document.querySelectorAll('#nav a').forEach(a => {
      const on = a.dataset.route === name || (name === 'brief' && a.dataset.route === 'briefs') || (name === 'sector' && a.dataset.route === 'sectors');
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    let arg = a1 || '';
    try { arg = decodeURIComponent(arg); } catch (e) { /* 그대로 둔다 */ }
    document.title = name === 'home' ? 'Radar' : `${['brief', 'sector'].includes(name) ? arg + ' ' : ''}${titles[name]} | Radar`;
    const key = ['sector', 'brief'].includes(name) ? `${name}/${arg}` : name, samePage = key === LAST_KEY, y = window.scrollY;
    LAST_KEY = key;
    if (name === 'sector') sector(arg, a2); else views[name](arg);
    app.insertAdjacentHTML('afterbegin', banner());
    if (samePage) {   /* 기준(누적·창)만 바뀜: 보던 자리를 지킨다 */
      window.scrollTo(0, y);
      if (NAVIGATED) { const tab = app.querySelector('.seg a[aria-selected=true]'); if (tab) tab.focus({ preventScroll: true }); }
    } else {
      window.scrollTo(0, 0);
      if (NAVIGATED) { const h1 = app.querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); }
    }
  }
  let NAVIGATED = false, LAST_KEY = null;
  /* 고정 머리글 높이를 CSS 변수로 (좁은 화면에서는 메뉴가 두 줄이라 높이가 바뀐다) */
  const topEl = document.querySelector('.top');
  const setTop = () => document.documentElement.style.setProperty('--top-h', `${topEl ? topEl.offsetHeight : 0}px`);
  if (topEl && 'ResizeObserver' in window) new ResizeObserver(setTop).observe(topEl); else window.addEventListener('resize', setTop);
  setTop();

  fetch('data.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
    D = j;
    document.getElementById('gen').textContent = `빌드 ${j.generated_at.replace('T', ' ').slice(0, 16)} KST`;
    route();
  }).catch(e => { app.innerHTML = `<p class="empty">data.json 을 불러오지 못했습니다 (${esc(e.message)}). 빌드가 아직 안 됐거나 경로가 다릅니다.</p>`; });
  window.addEventListener('hashchange', () => { NAVIGATED = true; route(); });
})();
</script>
</body>
</html>
