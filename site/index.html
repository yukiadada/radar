<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radar</title>
<meta name="description" content="기술 · 사회 · 정책 세 축으로 읽는 세상의 방향과 섹터 정렬">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F3F4F2; --ink:#1E2A3A; --ink2:#5A6675; --muted:#6F7A86;
  --hair:#D8DCE0; --hair2:#E7EAED; --wash:#E9ECEF; --panel:#FBFBFA;
  --accent:#2a78d6; --pos:#2a78d6; --neg:#e34948; --both:#A6ADB4;
  --ax0:#4a3aa7; --ax1:#1baf7a; --ax2:#eb6834;
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300; --s6:#4a3aa7; --s7:#e34948;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Apple SD Gothic Neo","Nanum Myeongjo",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#14171B; --ink:#ECEEF0; --ink2:#A9B1BA; --muted:#8A939D;
    --hair:#2B3138; --hair2:#22272D; --wash:#1C2026; --panel:#1A1E24;
    --accent:#3987e5; --pos:#3987e5; --neg:#e66767; --both:#5B646E;
    --ax0:#9085e9; --ax1:#199e70; --ax2:#d95926;
    --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300; --s6:#9085e9; --s7:#e66767;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.7;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mast,#app,.foot{max-width:960px;margin:0 auto;padding-left:24px;padding-right:24px}
.mast{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-top:22px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.brand{font-weight:600;font-size:21px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.tagline{margin:0;font-size:13.5px;color:var(--ink2)}
.mast nav{margin-left:auto;display:flex;gap:16px;font-size:14px}
.mast nav a{color:var(--ink2);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap}
.mast nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
#app{padding-bottom:72px;min-height:60vh}
.foot{padding-top:18px;padding-bottom:40px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:16px}
.foot a{color:var(--muted)}
h2.sec{font-size:15px;font-weight:600;margin:40px 0 12px;padding-top:14px;border-top:1px solid var(--hair)}
h2.sec .dim,.dim{color:var(--ink2);font-weight:400}
.small{font-size:13px}
.empty,.loading{color:var(--ink2);font-size:15px;margin:16px 0}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:6px 0;border-bottom:1px solid var(--hair2);font-size:15px}
.pager{display:flex;justify-content:space-between;font-size:14px;margin:28px 0 0}
.dateline{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.35;margin:30px 0 2px}
.hero-sub{color:var(--ink2);font-size:14px;margin:0;max-width:74ch}
.gs{color:var(--pos);font-weight:500}.ss{color:var(--neg);font-weight:500}.ns{color:var(--ink)}
@media (max-width:640px){.mast nav{margin-left:0;width:100%;gap:14px;overflow-x:auto;padding-bottom:2px}.tagline{display:none}.dateline{font-size:22px}}

/* 표 */
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
th{font-size:12.5px;font-weight:500;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap;vertical-align:bottom}
td{padding:9px 10px;border-bottom:1px solid var(--hair2);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:0 0 6px}
.tbl.wide table{min-width:960px}
th.fact,td.fact{min-width:360px}
th.note,td.note{min-width:300px}
td.date,td.nowrap,th.nowrap{white-space:nowrap;font-variant-numeric:tabular-nums}
td.small{font-size:13px;color:var(--ink2)}
table.secs td{vertical-align:middle}
table.secs td.axcell{min-width:96px}
table.secs td.num{white-space:nowrap}

/* 필터·탭 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px;font-size:14px}
.filters label{color:var(--ink2)}
select,input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--hair);border-radius:6px;background:var(--ground);color:var(--ink)}
input[type=search]{min-width:200px}
.count{color:var(--ink2);font-size:13.5px}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 0;font-size:14px}
.seg a{padding:4px 13px;border:1px solid var(--hair);border-radius:999px;text-decoration:none;color:var(--ink2)}
.seg a[aria-selected=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg .dim{margin-left:4px;font-size:13px}
.seg button{font:inherit;font-size:12.5px;padding:2px 11px;border:1px solid var(--hair);border-radius:999px;background:transparent;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.seg button[aria-pressed=true] i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:-1px}

/* 배지 */
.keys{font-size:13px;color:var(--ink2);margin:0 0 8px;line-height:1.8}
.dir,.conf,.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink)}
.dir i,.conf i{font-style:normal}
.dir i{font-size:11px;width:12px;text-align:center}
.dir.up i{color:var(--pos)}.dir.down i{color:var(--neg)}.dir.both i{color:var(--both)}
.conf i{display:inline-flex;gap:3px;align-items:center}
.conf s{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);text-decoration:none}
.conf s.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.st{padding:1px 8px;border-radius:999px;border:1px solid var(--hair);font-size:12px}
.st.yes{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.st.no{color:var(--ink2)}
.ax0{--c:var(--ax0)}.ax1{--c:var(--ax1)}.ax2{--c:var(--ax2)}
.s0{--c:var(--s0)}.s1{--c:var(--s1)}.s2{--c:var(--s2)}.s3{--c:var(--s3)}.s4{--c:var(--s4)}.s5{--c:var(--s5)}.s6{--c:var(--s6)}.s7{--c:var(--s7)}
.axtag{display:inline-block;padding:0 7px;border-radius:999px;font-size:12px;font-weight:500;color:var(--c);border:1px solid var(--c);white-space:nowrap;line-height:1.7}
.lbl{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid var(--hair);color:var(--ink2);line-height:1.8}
.lbl-aligned3{background:var(--pos);color:#fff;border-color:var(--pos)}
.lbl-aligned2{color:var(--pos);border-color:var(--pos)}
.lbl-aligned1{color:var(--ink)}
.lbl-headwind{color:var(--neg);border-color:var(--neg)}
.lbl-mixed{color:var(--ink);border-style:dashed}
.pct{font-variant-numeric:tabular-nums;font-weight:600}
.pct.big{font-size:26px;line-height:1.2}

/* 축 점수 미니 막대 (−1 ~ +1) */
.axes3{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.axb{display:grid;grid-template-columns:34px 1fr 44px;align-items:center;gap:8px;font-size:12.5px;line-height:1.4}
.axb .axl{color:var(--ink2);white-space:nowrap}
.axt{display:grid;grid-template-columns:1fr 1fr;height:9px}
.axneg{display:flex;justify-content:flex-end;border-right:1px solid var(--hair)}
.axneg i{display:block;height:100%;background:var(--neg);border-radius:3px 0 0 3px}
.axpos i{display:block;height:100%;background:var(--pos);border-radius:0 3px 3px 0}
.axv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.axcell .axt{height:8px}

/* 패널·카드 */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 0}
.dash .full{grid-column:1/-1}
.panel{border:1px solid var(--hair);border-radius:12px;padding:14px 16px 12px;background:var(--panel);min-width:0}
.panel h3{font-size:14px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h3 .dim{font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{padding:10px 14px;border:1px solid var(--hair);border-radius:10px;background:var(--panel);min-width:0}
.kpi b{display:block;font-size:24px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi b.txt{font-size:17px}
.kpi b small{font-size:13px;font-weight:500;color:var(--ink2)}
.kpi span{font-size:12.5px;color:var(--ink2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 6px}
.dcard{border:1px solid var(--hair);border-radius:12px;padding:14px 16px 12px;background:var(--panel);min-width:0}
.dcard header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dcard h3{font-size:16px;font-weight:600;margin:0}
.dcard h3 a{color:var(--ink);text-decoration:none}
.dcard .meta{font-size:12.5px;color:var(--ink2);margin:2px 0 6px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.gl{border:1px solid var(--hair);border-radius:12px;padding:12px 14px;background:var(--panel);min-width:0}
.gl h3{font-size:13.5px;font-weight:600;margin:0 0 6px}
.gl ol{margin:0;padding-left:20px;font-size:14px;line-height:1.75}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:2px 10px;border:1px solid var(--hair);border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--ground);color:var(--ink);text-decoration:none}
.chip b{font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--ink2);margin:0 0 6px}
.leg i,.sw2{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);vertical-align:-1px;margin-right:5px}
.more{margin:10px 0 0;font-size:14px}
.more summary{cursor:pointer;color:var(--ink2);padding:4px 0}
@media (max-width:760px){.dash,.dgrid,.glance{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:20px}}

/* 차트 */
.chart-box{min-height:120px;position:relative}
svg.chart{display:block;width:100%;height:auto;font-family:var(--sans)}
svg.chart .grid{stroke:var(--hair2);stroke-width:1}
svg.chart .grid.zero{stroke:var(--hair);stroke-dasharray:3 3}
svg.chart .tick{font-size:11px;fill:var(--muted)}
svg.chart .ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.chart .pt{fill:var(--c);stroke:var(--panel);stroke-width:1.5}
svg.chart .bar{fill:var(--c)}
svg.chart .lab{font-size:12px;font-weight:500;fill:var(--c)}
svg.chart .hit{fill:transparent;cursor:crosshair}
svg.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;pointer-events:none}
.tip{position:absolute;top:8px;left:0;pointer-events:none;background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.6;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;z-index:2}
.tip .tipd{color:var(--ink2);font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:-1px}
svg.spark{display:block;width:120px;height:28px}
svg.spark .ln{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round}
svg.spark .mid{stroke:var(--hair);stroke-width:1;stroke-dasharray:2 2}
svg.spark .pt{fill:var(--accent)}
ul.feed{list-style:none;padding:0;margin:0}
ul.feed li{padding:9px 0;border-bottom:1px solid var(--hair2);font-size:14px;line-height:1.6}
ul.feed li:last-child{border-bottom:0}
ul.feed .date{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;margin-right:4px}
ul.feed .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:2px}

/* 브리프 본문 (markdown) */
.md{font-family:var(--serif);font-size:17px;line-height:1.85}
.md>*:not(.tbl){max-width:74ch}
.md h1{font-family:var(--sans);font-size:20px;font-weight:600;line-height:1.4;margin:6px 0 18px}
.md>h1:first-child{display:none}
.md>h1:first-child+h2{border-top:0;margin-top:4px}
.md h2{font-family:var(--sans);font-size:15px;font-weight:600;margin:36px 0 10px;padding-top:12px;border-top:1px solid var(--hair)}
.md p{margin:0 0 14px}
.md ul{padding-left:20px;margin:0 0 14px}
.md li{margin:5px 0}
.md .tbl{margin:0 0 16px}
.md table{font-family:var(--sans);font-size:14px;line-height:1.55;min-width:640px}
.md td{font-size:14px}
.md code{font-family:var(--sans);background:var(--wash);padding:1px 5px;border-radius:4px;font-size:.92em}
.easy{background:var(--wash);border-radius:12px;padding:18px 22px 6px;margin:6px 0 26px}
.easy>h2{font-family:var(--sans);font-size:15px;font-weight:600;margin:0 0 10px}
.easy .md>ul{padding-left:0;list-style:none}
.easy .md>ul>li{margin:0 0 16px}
.easy .md>ul>li>ul{padding-left:18px;margin-top:4px}
.easy .md strong{font-family:var(--sans);font-weight:600;font-size:15.5px}
h3.axh{font-size:15px;font-weight:600;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h3.axh .dim{font-size:13px}
.sigs{display:grid;grid-template-columns:1fr;gap:12px;margin:6px 0 10px}
.sig{border:1px solid var(--hair);border-radius:12px;padding:14px 16px;background:var(--panel)}
.sig header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:4px}
.sig h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:2px 0 8px;line-height:1.4}
.sig p{margin:0 0 6px;font-family:var(--serif);font-size:15.5px;line-height:1.75}
.sig p b{font-family:var(--sans);font-weight:600;margin-right:4px;font-size:14px}
.sig .chips{margin:6px 0 2px}
.sig details{margin-top:8px;font-size:13.5px}.sig summary{cursor:pointer;color:var(--ink2)}
.sig details p{font-size:14px;font-family:var(--sans)}
pre.yaml{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.6;background:var(--wash);padding:16px 18px;border-radius:8px;overflow-x:auto;color:var(--ink)}
.att{display:flex;flex-direction:column;gap:6px}
.attrow{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 110px;align-items:center;gap:8px;font-size:13.5px}
.attlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atttrack{height:12px;background:var(--wash);border-radius:3px;overflow:hidden}.atttrack i{display:block;height:100%;background:var(--accent);border-radius:3px}
.attval{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.attrow{grid-template-columns:1fr 1.3fr 84px}}
.warn{margin:18px 0 0;padding:10px 14px;border:1px solid var(--neg);border-radius:10px;background:color-mix(in srgb,var(--neg) 8%,var(--panel));font-size:13.5px}
.warn ul{margin:4px 0 0;padding-left:18px}
.warn li{margin:2px 0}
</style>
</head>
<body>
<header class="mast">
  <a class="brand" href="#/">radar</a>
  <p class="tagline">기술 · 사회 · 정책 세 축으로 읽는 세상의 방향</p>
  <nav id="nav" aria-label="주 메뉴">
    <a href="#/" data-route="home">오늘</a>
    <a href="#/sectors" data-route="sectors">섹터</a>
    <a href="#/trend" data-route="trend">추이</a>
    <a href="#/ledger" data-route="ledger">장부</a>
    <a href="#/briefs" data-route="briefs">브리프</a>
    <a href="#/framework" data-route="framework">기준</a>
  </nav>
</header>
<main id="app"><p class="loading">불러오는 중</p></main>
<footer class="foot"><span id="gen"></span><a href="https://github.com/yukiadada/radar">저장소</a><span>판단 재료이지 매매 신호가 아닙니다</span></footer>
<noscript><p style="padding:24px">이 페이지는 JavaScript 로 장부와 브리프를 읽습니다. data.json 과 briefs/ 는 저장소에서 직접 볼 수 있습니다.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.12/lib/marked.umd.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  let D = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const enc = s => encodeURIComponent(s);
  const fmtDate = s => { const [y, m, d] = s.split('-').map(Number); const w = '일월화수목금토'[new Date(y, m - 1, d).getDay()]; return `${y}년 ${m}월 ${d}일 ${w}요일`; };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const daysOf = arg => (arg === '90' ? 90 : 30);
  const board = days => (days === 90 ? D.board.w90 : D.board.w30);
  const serOf = days => (days === 90 ? D.series.w90 : D.series.w30);
  const firstSentence = t => { const m = t.match(/^[\s\S]*?(다\.|\. )(?=\s|$)/); return (m ? m[0] : t).trim(); };   // 옛 Safari 를 위해 lookbehind 는 쓰지 않는다

  const DIR = { '+': ['up', '▲', '밀어줌'], '-': ['down', '▼', '막음'], '±': ['both', '◆', '양쪽'] };
  const CONF = { '0.3': ['conf-low', 1, '낮음'], '0.6': ['conf-mid', 2, '보통'], '0.8': ['conf-high', 3, '높음'] };
  const SC = ['s0', 's1', 's2', 's3', 's4', 's5', 's6', 's7'];
  const ALIGNED = ['aligned3', 'aligned2', 'aligned1'], CONTESTED = ['headwind', 'mixed'];
  const axIdx = a => D.axes.indexOf(a);
  const axCls = a => 'ax' + axIdx(a);
  const axTag = a => `<span class="axtag ${axCls(a)}">${esc(a)}</span>`;
  const dots = n => `<i aria-hidden="true">${[1, 2, 3].map(k => `<s${k <= n ? '' : ' class="off"'}></s>`).join('')}</i>`;
  const dirBadge = v => { const d = DIR[String(v).trim()]; return d ? `<span class="dir ${d[0]}" title="방향 ${esc(v)}"><i>${d[1]}</i>${d[2]}</span>` : esc(v); };
  const confBadge = v => { const c = CONF[String(Number(v))]; return c ? `<span class="conf ${c[0]}" title="확신 ${esc(v)}">${dots(c[1])}${c[2]}</span>` : esc(v); };
  const stBadge = v => { const t = String(v).trim().toLowerCase(); return t === 'true' ? `<span class="st yes" title="문서로 남은 확정 사실">확정</span>` : t === 'false' ? `<span class="st no" title="발언·보도·조사 단계">미확정</span>` : esc(v); };
  const KEYS = `<p class="keys">구조적은 <span class="st yes">확정</span> 문서로 남은 것, <span class="st no">미확정</span> 발언·보도 단계. 방향은 그 섹터를 <span class="dir up"><i>▲</i>밀어줌</span> <span class="dir down"><i>▼</i>막음</span> <span class="dir both"><i>◆</i>양쪽</span>. 확신은 <span class="conf conf-low">${dots(1)}낮음 0.3</span> <span class="conf conf-mid">${dots(2)}보통 0.6</span> <span class="conf conf-high">${dots(3)}높음 0.8</span></p>`;
  const fmtNet = v => (Math.abs(v) < 0.005 ? '0' : (v > 0 ? '+' : '') + v.toFixed(2));
  const netCls = v => (v > 0 ? 'gs' : v < 0 ? 'ss' : 'dim');
  const pctCls = s => (s == null ? 'dim' : s >= 60 ? 'gs' : s <= 40 ? 'ss' : 'ns');
  const pctText = s => (s == null ? '–' : `${s}%`);
  /* 7일 변화. 값이 없는데 신호는 있으면 7일 전에는 점수가 없던 섹터 = 신규 */
  const deltaHtml = (v, n) => (v == null ? `<span class="dim small">${n ? '신규' : '–'}</span>` : `<span class="small ${v > 0 ? 'gs' : v < 0 ? 'ss' : 'dim'}">${v > 0 ? '+' : ''}${v}p</span>`);
  const labelHtml = l => `<span class="lbl lbl-${esc(l)}">${esc(D.labels[l] || l)}</span>`;
  const sectorLink = (s, days) => (D.sectors[s] ? `<a href="#/sector/${enc(s)}${days === 90 ? '/90' : ''}">${esc(s)}</a>` : `<span title="sector_map 에 없는 섹터">${esc(s)}</span>`);
  const tile = (v, l, cls) => `<div class="kpi"><b${cls ? ` class="${cls}"` : ''}>${v}</b><span>${l}</span></div>`;
  const banner = () => (D.warnings && D.warnings.length ? `<div class="warn" role="alert"><b>빌드 경고 ${D.warnings.length}건</b> — 자료 일부가 빠진 채 만들어졌습니다.<ul>${D.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '');
  /* 장부가 창보다 짧으면 30일·90일 창이 같은 자료다. 그 사실을 화면에 적는다 */
  const ledgerNote = () => { if (!D.first_date) return ''; const same = D.first_date > D.board.w90.from; return `장부는 ${D.first_date}부터${same ? ' — 아직 90일이 안 돼 30일·90일 창이 같은 자료입니다' : ''}`; };

  /* 축 점수 미니 막대: −1 ~ +1. 왼쪽(빨강) 막음, 오른쪽(파랑) 밀어줌 */
  function axisBar(a, net, n, withLabel = true) {
    const tip = `${a} ${fmtNet(net)}${n != null ? `, ${n}건` : ''}`;
    const track = `<span class="axt"${withLabel ? '' : ' style="grid-column:1/-1"'}><span class="axneg">${net < 0 ? `<i style="width:${(-net * 100).toFixed(0)}%"></i>` : ''}</span><span class="axpos">${net > 0 ? `<i style="width:${(net * 100).toFixed(0)}%"></i>` : ''}</span></span>`;
    return withLabel ? `<span class="axb" title="${esc(tip)}"><span class="axl">${esc(a)}</span>${track}<span class="axv ${netCls(net)}">${fmtNet(net)}</span></span>`
      : `<span class="axb" title="${esc(tip)}">${track}</span><span class="small ${netCls(net)}">${fmtNet(net)}</span>`;
  }
  const axes3 = axes => `<div class="axes3">${D.axes.map(a => { const x = axes[a]; const net = typeof x === 'number' ? x : x.net; return axisBar(a, net, typeof x === 'object' ? x.n : null); }).join('')}</div>`;

  /* ---- 마크다운 ---- */
  function md(text) {
    const el = document.createElement('div');
    el.className = 'md';
    const safe = text.split(/(`[^`]*`)/).map((seg, i) => (i % 2 ? seg : seg.replace(/~/g, '&#126;'))).join('');   // "3.50~3.75%" 의 물결표가 취소선이 되지 않게
    el.innerHTML = marked.parse(safe, { gfm: true, breaks: false });
    el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    el.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    return el;
  }
  const inlineMd = t => md(t).innerHTML.replace(/^\s*<p>/, '').replace(/<\/p>\s*$/, '');
  const plain = t => t.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '');
  function decorateTables(root) {
    root.querySelectorAll('table').forEach(t => {
      const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
      const cols = { dir: heads.indexOf('방향'), conf: heads.indexOf('확신'), st: heads.indexOf('구조적') };
      if (cols.dir < 0 && cols.conf < 0 && cols.st < 0) return;
      t.querySelectorAll('tbody tr').forEach(tr => {
        const tds = tr.children;
        if (cols.dir >= 0 && tds[cols.dir]) tds[cols.dir].innerHTML = dirBadge(tds[cols.dir].textContent);
        if (cols.conf >= 0 && tds[cols.conf]) tds[cols.conf].innerHTML = confBadge(tds[cols.conf].textContent);
        if (cols.st >= 0 && tds[cols.st]) tds[cols.st].innerHTML = stBadge(tds[cols.st].textContent);
      });
    });
  }

  /* ---- 브리프. 카드는 build.py 가 구조화한 signals 로 그리고, 나머지 절만 마크다운으로 그린다 ---- */
  const briefCache = {};
  function fetchBrief(b) {
    if (b.md) return Promise.resolve(b.md);
    if (!briefCache[b.date]) briefCache[b.date] = fetch(`briefs/${b.date}.md`, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
    return briefCache[b.date];
  }
  const splitSections = text => text.split(/^## /m).slice(1).map(p => { const nl = p.indexOf('\n'); return { title: p.slice(0, nl).trim(), md: p.slice(nl + 1) }; });
  function signalCard(s) {
    const title = s.easy ? s.easy.name : firstSentence(plain(s.fact)).slice(0, 70);
    return `<article class="sig"><header>${axTag(s.axis)}${s.structural == null ? '' : stBadge(s.structural)}${dirBadge(s.direction)}${confBadge(s.confidence)}<span class="dim small">${sectorLink(s.sector)}</span></header><h3>${esc(title)}</h3>` +
      (s.easy ? s.easy.parts.map(([k, v]) => `<p><b>${esc(k)}</b>${inlineMd(v)}</p>`).join('') : '') +
      (s.tickers.length ? `<div class="chips">${s.tickers.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : '') +
      `<details><summary>근거와 출처</summary><p>${inlineMd(s.fact)}</p>${s.interp ? `<p class="dim">${inlineMd(s.interp)}</p>` : ''}</details></article>`;
  }
  function renderBrief(container, b, text) {
    const secs = splitSections(text);
    const isAxis = t => D.axes.includes(t), isEasy = t => t.startsWith('쉬운 말로');
    let cards = '';
    for (const a of D.axes) {
      const list = b.signals.filter(s => s.axis === a), sec = secs.find(x => x.title === a);
      if (!sec) continue;
      cards += `<h3 class="axh ${axCls(a)}"><i class="sw2"></i>${esc(a)} <span class="dim">${list.length ? `${list.length}건` : '해당 없음'}</span></h3>`;
      if (list.length) cards += `<div class="sigs">${list.map(signalCard).join('')}</div>`;
    }
    container.innerHTML = KEYS + cards + (b.none_today ? `<p class="keys">오늘 구조적 시그널 없음. 위 카드는 아직 확정되지 않은 재료입니다.</p>` : '');
    for (const x of secs.filter(x => !isAxis(x.title) && !isEasy(x.title))) container.appendChild(md('## ' + x.title + '\n' + x.md));
    const dd = document.createElement('details'); dd.className = 'more'; dd.innerHTML = '<summary>원본 시그널 표·해석·확인 방법 메모</summary>';
    for (const x of secs.filter(x => isAxis(x.title) || isEasy(x.title))) dd.appendChild(md('## ' + x.title + '\n' + x.md));
    container.appendChild(dd);
    decorateTables(container);
  }
  function mountBrief(container, b) {
    container.innerHTML = `<p class="loading">브리프 불러오는 중</p>`;
    fetchBrief(b).then(text => { if (container.isConnected) renderBrief(container, b, text); })
      .catch(e => { container.innerHTML = `<p class="empty">briefs/${esc(b.date)}.md 를 불러오지 못했습니다 (${esc(e.message)}).</p>`; });
  }

  /* ---- 차트 (SVG 직접). 폭은 컨테이너에 맞추고 창 크기가 바뀌면 다시 그린다 ---- */
  const mdShort = d => { const [, m, dd] = d.split('-').map(Number); return `${m}/${dd}`; };
  const xStep = n => (n > 40 ? 14 : 7);
  function frame(el, { H, m, lo, hi, n, label, ticks, fmtY, band }) {
    const W = Math.max(280, el.clientWidth || 440), iw = W - m.l - m.r, ih = H - m.t - m.b;
    const x = i => m.l + (band ? (i + 0.5) * (iw / n) : (n > 1 ? i / (n - 1) * iw : iw / 2)), y = v => m.t + (hi - v) / (hi - lo) * ih;
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">`;
    for (const v of ticks) s += `<line class="grid${v === 50 && hi === 100 ? ' zero' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="tick" x="${m.l - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmtY(v)}</text>`;
    return { W, H, m, iw, ih, x, y, open: s };
  }
  const dateAxis = (f, dates) => { let s = ''; const n = dates.length; for (let i = n - 1; i >= 0; i -= xStep(n)) s += `<text class="tick" x="${f.x(i).toFixed(1)}" y="${f.H - 8}" text-anchor="middle">${mdShort(dates[i])}</text>`; return s; };

  /* 정렬 % 라인: 값은 0~100, 신호 없는 날(null)은 선을 끊는다. 홑점은 점으로. 직접 라벨은 4개까지, 그 이상은 범례(칩)로 */
  function pctLines(el, dates, sers, { label, H = 240, endLabels = true } = {}) {
    if (!dates.length) { el.innerHTML = `<p class="empty">아직 장부에 자료가 없습니다.</p>`; return; }
    endLabels = endLabels && sers.length <= 4;
    const n = dates.length;
    const f = frame(el, { H, m: { l: 36, r: endLabels ? 124 : 14, t: 12, b: 26 }, lo: 0, hi: 100, n, label, ticks: [0, 25, 50, 75, 100], fmtY: v => v + '%' });
    let s = f.open + dateAxis(f, dates);
    const ends = [];
    sers.forEach(sr => {
      let seg = [];
      const flush = () => {
        if (seg.length === 1) s += `<circle class="pt ${sr.cls}" cx="${seg[0][0]}" cy="${seg[0][1]}" r="3.5"/>`;
        else if (seg.length > 1) s += `<path class="ln ${sr.cls}" d="M${seg.map(p => p.join(',')).join('L')}"/>`;
        seg = [];
      };
      sr.values.forEach((v, i) => { if (v == null) { flush(); return; } seg.push([f.x(i).toFixed(1), f.y(v).toFixed(1)]); });
      flush();
      let li = n - 1; while (li >= 0 && sr.values[li] == null) li--;
      if (li >= 0) ends.push({ cls: sr.cls, name: sr.name, v: sr.values[li], y: f.y(sr.values[li]) });
    });
    if (endLabels) {
      ends.sort((p, q) => p.y - q.y);
      for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
      for (let i = ends.length - 1; i >= 0; i--) { if (ends[i].y > f.H - f.m.b - 2) ends[i].y = f.H - f.m.b - 2; if (i < ends.length - 1 && ends[i + 1].y - ends[i].y < 13) ends[i].y = ends[i + 1].y - 13; }
      for (const e of ends) s += `<text class="lab ${e.cls}" x="${f.W - f.m.r + 8}" y="${(e.y + 4).toFixed(1)}">${esc(e.name)} ${e.v}%</text>`;
    }
    s += `<line class="xh" x1="0" x2="0" y1="${f.m.t}" y2="${f.H - f.m.b}" style="display:none"/><rect class="hit" x="${f.m.l}" y="${f.m.t}" width="${f.iw}" height="${f.ih}"/>`;
    el.innerHTML = s + `</svg><div class="tip" hidden></div>`;
    hover(el, f, dates, sers, v => `${v}%`);
  }
  /* 호버: 세로선 + 그날의 값 툴팁 */
  function hover(el, f, dates, sers, fmt) {
    const svg = el.querySelector('svg'), hit = el.querySelector('rect.hit'), xh = el.querySelector('line.xh'), tip = el.querySelector('.tip');
    const n = dates.length;
    hit.addEventListener('mousemove', ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (f.W / r.width);
      const i = Math.max(0, Math.min(n - 1, Math.round((px - f.m.l) / (n > 1 ? f.iw / (n - 1) : 1))));
      const x = f.x(i); xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.style.display = '';
      const rows = sers.map(sr => (sr.values[i] == null ? '' : `<div><i class="${sr.cls}"></i>${esc(sr.name)} <b>${fmt(sr.values[i])}</b></div>`)).join('');
      tip.innerHTML = `<div class="tipd">${dates[i]}</div>${rows || '<div class="dim">신호 없음</div>'}`;
      tip.hidden = false;
      const left = x / f.W * r.width; tip.style.left = `${Math.max(0, Math.min(left + 12, r.width - tip.offsetWidth - 4))}px`;
    });
    hit.addEventListener('mouseleave', () => { tip.hidden = true; xh.style.display = 'none'; });
  }
  /* 쌓은 막대: 날짜별 건수를 축 색으로 */
  function stackChart(el, dates, ser, label) {
    const n = dates.length, tot = dates.map((_, i) => ser.reduce((acc, x) => acc + x.counts[i], 0)), hi = Math.max(1, ...tot);
    const step = Math.max(1, Math.ceil(hi / 4)), ticks = []; for (let v = 0; v <= hi; v += step) ticks.push(v);
    const f = frame(el, { H: 180, m: { l: 26, r: 10, t: 12, b: 26 }, lo: 0, hi, n, label, ticks, fmtY: String, band: true });
    let s = f.open + dateAxis(f, dates); const bw = f.iw / n, gap = Math.min(3, bw * 0.3);
    dates.forEach((d, i) => {
      let acc = 0; const parts = [];
      ser.forEach(x => { const c = x.counts[i]; if (!c) return; s += `<rect class="bar ${x.cls}" x="${(f.m.l + i * bw + gap / 2).toFixed(1)}" y="${f.y(acc + c).toFixed(1)}" width="${Math.max(1, bw - gap).toFixed(1)}" height="${(f.y(acc) - f.y(acc + c)).toFixed(1)}"/>`; acc += c; parts.push(`${x.name} ${c}`); });
      if (acc) s += `<rect class="hit" x="${(f.m.l + i * bw).toFixed(1)}" y="${f.m.t}" width="${bw.toFixed(1)}" height="${f.ih}"><title>${d}: ${parts.join(', ')} (총 ${acc}건)</title></rect>`;
    });
    el.innerHTML = s + `</svg>`;
  }
  /* 스파크라인: 표 안의 추이 */
  function spark(values) {
    const n = values.length, W = 120, H = 28, x = i => (n > 1 ? i / (n - 1) * (W - 4) + 2 : W / 2), y = v => H - 2 - (v / 100) * (H - 4);
    let s = `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line class="mid" x1="0" x2="${W}" y1="${y(50).toFixed(1)}" y2="${y(50).toFixed(1)}"/>`;
    let seg = []; const flush = () => { if (seg.length === 1) s += `<circle class="pt" cx="${seg[0][0]}" cy="${seg[0][1]}" r="2"/>`; else if (seg.length > 1) s += `<path class="ln" d="M${seg.map(p => p.join(',')).join('L')}"/>`; seg = []; };
    values.forEach((v, i) => { if (v == null) { flush(); return; } seg.push([x(i).toFixed(1), y(v).toFixed(1)]); }); flush();
    return s + `</svg>`;
  }
  const dateRange = (from, to) => { const out = []; for (let t = Date.parse(from + 'T00:00:00Z'); t <= Date.parse(to + 'T00:00:00Z'); t += 864e5) out.push(new Date(t).toISOString().slice(0, 10)); return out; };
  function dailyCounts(rows, from, to) {
    const days = dateRange(from, to), idx = Object.fromEntries(days.map((d, i) => [d, i]));
    const per = D.axes.map(() => days.map(() => 0));
    for (const r of rows) { const i = idx[r.date], k = axIdx(r.axis); if (i != null && k >= 0) per[k][i]++; }
    return { days, per };
  }

  let REDRAW = null;
  window.addEventListener('resize', debounce(() => { if (REDRAW) REDRAW(); }, 150));
  const segTabs = (base, days, note) => `<div class="seg" role="tablist" aria-label="기간">` + [30, 90].map(n => `<a role="tab" aria-selected="${n === days}" href="${base}${n === 90 ? '/90' : ''}">최근 ${n}일</a>`).join('') + `<span class="dim">${note}</span></div>`;
  const legend = items => `<div class="leg">${items.map(([name, cls]) => `<span class="${cls}"><i></i>${esc(name)}</span>`).join('')}</div>`;
  const axisLegend = () => legend(D.axes.map(a => [a, axCls(a)]));
  function rawLine(date) {
    const day = D.raw[date];
    if (!day) return '';
    const names = Object.keys(day).filter(k => day[k].current !== false), zero = names.filter(k => !day[k].count || day[k].error);
    return `수집 ${names.length}개 소스${zero.length ? `, 0건 ${zero.join(', ')}` : ''}`;
  }
  const byScore = (a, b) => (b.score - a.score) || (b.n - a.n) || a.sector.localeCompare(b.sector);

  /* ---- 화면 ---- */
  function dirCard(x, B, days) {
    const chips = x.sectors.map(s => { const sb = B.sectors.find(z => z.sector === s); return `<a class="chip" href="#/sector/${enc(s)}${days === 90 ? '/90' : ''}">${esc(s)} <b class="${pctCls(sb.score)}">${pctText(sb.score)}</b></a>`; }).join('');
    return `<article class="dcard"><header><h3><a href="#/sectors${days === 90 ? '/90' : ''}">${esc(x.direction)}</a></h3><b class="pct big ${pctCls(x.score)}">${pctText(x.score)}</b></header>` +
      `<div class="meta">${labelHtml(x.label)}<span>${x.n}건 · 섹터 ${x.active}/${x.sectors.length}</span><span>7일 ${deltaHtml(x.delta, x.n)}</span></div>${axes3(x.axes)}<div class="chips">${chips}</div></article>`;
  }
  function home() {
    const B = D.board.w30, b = D.briefs[0];
    REDRAW = null;
    const bits = [`최근 30일 장부 ${B.total}건`, `전체 ${D.ledger.length}건`, ledgerNote(), rawLine(b ? b.date : D.today)].filter(Boolean);
    let h = `<p class="dateline">${fmtDate(D.today)}</p><p class="hero-sub">${bits.join(' · ')}</p>`;
    const dirs = B.directions.filter(x => x.n).sort((a, c) => (c.score - a.score) || (c.n - a.n)), quiet = B.directions.filter(x => !x.n);
    h += `<h2 class="sec">지금 세상의 방향 <span class="dim">최근 30일 장부. 세 축이 같은 쪽을 가리킬수록 %가 높다 (50%가 중립) · <a href="#/sectors">섹터 →</a></span></h2>`;
    h += dirs.length ? `<div class="dgrid">${dirs.map(x => dirCard(x, B, 30)).join('')}</div>` : `<p class="empty">아직 장부에 시그널이 없습니다.</p>`;
    if (quiet.length) h += `<p class="keys">신호 없는 방향: ${quiet.map(x => esc(x.direction)).join(', ')}</p>`;
    const secs = B.sectors.filter(x => x.n);
    const ups = secs.filter(x => ALIGNED.includes(x.label)).sort(byScore).slice(0, 5);
    const downs = secs.filter(x => CONTESTED.includes(x.label)).sort((a, c) => (a.score - c.score) || (c.n - a.n)).slice(0, 5);
    const neutral = secs.filter(x => x.label === 'neutral');
    const li = x => `<li>${sectorLink(x.sector)} <b class="${pctCls(x.score)}">${x.score}%</b> <span class="dim small">${esc(D.labels[x.label])} · ${x.n}건</span></li>`;
    h += `<section class="glance"><div class="gl"><h3>밀어주는 축만 있는 섹터</h3>${ups.length ? `<ol>${ups.map(li).join('')}</ol>` : '<p class="empty">없음</p>'}</div><div class="gl"><h3>역풍·엇갈림 섹터</h3>${downs.length ? `<ol>${downs.map(li).join('')}</ol>` : '<p class="empty">없음</p>'}${neutral.length ? `<p class="keys" style="margin:8px 0 0">양쪽(± 만 있어 축 점수 0): ${neutral.map(x => sectorLink(x.sector)).join(', ')}</p>` : ''}</div></section>`;
    if (b) h += `<h2 class="sec">${b.date === D.today ? '오늘의 브리프' : '최근 브리프'} <span class="dim">${b.date}</span></h2><div id="brief"></div>`;
    else h += `<h2 class="sec">브리프</h2><p class="empty">아직 새 체계의 브리프가 없습니다. 다음 /brief 부터 쌓입니다.</p>`;
    if (D.briefs.length > 1) {
      h += `<h2 class="sec">지난 브리프</h2><ul class="plain">` + D.briefs.slice(1, 8).map(x => `<li><a href="#/brief/${x.date}">${x.date}</a> <span class="dim">구조적 ${x.none_today ? '없음' : x.structural + '건'}</span></li>`).join('') + `</ul>`;
      if (D.briefs.length > 8) h += `<p class="dim" style="font-size:14px"><a href="#/briefs">전체 브리프 ${D.briefs.length}건</a></p>`;
    }
    app.innerHTML = h;
    if (b) mountBrief(document.getElementById('brief'), b);
  }

  function attentionPanel(A, limit) {
    if (!A || !A.sectors.length || !A.days_present7) return '';
    const top = A.sectors.slice(0, limit || 12), max = Math.max(1, ...top.map(t => t.n7));
    const note = A.comparable ? `괄호는 지난주 대비 비중 변화(%p)` : `지난주 자료가 ${A.days_present_prev7}일뿐이라 비교는 다음 주부터`;
    return `<div class="panel full"><h3>관심 <span class="dim">최근 7일 수집 헤드라인 ${A.headlines7}건(수집 ${A.days_present7}일)에서 섹터 keywords 가 언급된 건수와 비중. ${note}</span></h3><div class="att">` +
      top.map(t => `<div class="attrow"><span class="attlab" title="${esc(t.sector)}">${sectorLink(t.sector)} <span class="dim small">${esc(t.direction)}</span></span><span class="atttrack"><i style="width:${(t.n7 / max * 100).toFixed(1)}%"></i></span><span class="attval">${t.n7} <span class="dim small">${t.share7}%</span>${A.comparable ? ` <span class="${t.delta_pp > 0 ? 'gs' : t.delta_pp < 0 ? 'ss' : 'dim'} small">(${t.delta_pp > 0 ? '+' : ''}${t.delta_pp}p)</span>` : ''}</span></div>`).join('') +
      `</div><p class="keys" style="margin:8px 0 0">관심은 언급량이라 방향이 없습니다. 검색어 때문에 편향이 있으니 절대량보다 순위와 주간 변화를 봅니다. 관심은 높은데 근거(정렬)가 없는 곳, 관심은 낮은데 근거가 쌓이는 곳을 찾는 용도입니다.</p></div>`;
  }
  function sectors(arg) {
    const days = daysOf(arg), B = board(days), S = serOf(days), c = B.counts;
    REDRAW = null;
    let h = `<p class="dateline">어느 섹터에 근거가 쌓이는가</p><p class="hero-sub">섹터마다 ${D.axes.join('·')} 세 축의 점수(−1~+1)와 정렬 %(50 + 50 × 세 축 평균)를 냅니다. 축 점수는 시그널의 방향 × 가중치(크기 × 기간) 합을 ${D.params.K}으로 나눈 것. 100%는 세 축 모두 밀어줌, 0%는 모두 역풍, 50%는 중립. 방향(내러티브)은 소속 섹터의 평균입니다. 점수는 근거의 누적이지 수익률 예측이 아닙니다.</p>`;
    h += segTabs('#/sectors', days, `${B.from} ~ ${B.to}, ${B.total}건. 3축 정렬 ${c.aligned3} · 2축 ${c.aligned2} · 1축 ${c.aligned1} · 엇갈림 ${c.mixed} · 양쪽 ${c.neutral} · 역풍 ${c.headwind} · 신호 없음 ${c.none}${ledgerNote() ? ` · ${ledgerNote()}` : ''}`);
    h += `<section class="dash">`;
    for (const dir of B.directions) {
      const rows = dir.sectors.map(s => B.sectors.find(z => z.sector === s));
      h += `<div class="panel full"><h3><span>${esc(dir.direction)} <b class="pct ${pctCls(dir.score)}">${pctText(dir.score)}</b> ${labelHtml(dir.label)}</span><span class="dim">${dir.n}건 · 섹터 ${dir.active}/${dir.sectors.length} · 7일 ${deltaHtml(dir.delta, dir.n)}</span></h3>` +
        (dir.n ? axes3(dir.axes) : '') +
        `<div class="tbl"><table class="secs"><thead><tr><th>섹터</th><th>티커</th>${D.axes.map(a => `<th class="${axCls(a)}"><i class="sw2"></i>${esc(a)}</th>`).join('')}<th class="num">정렬</th><th>상태</th><th class="num">건수</th><th class="num">7일</th><th>추이</th></tr></thead><tbody>` +
        rows.map(x => `<tr><td class="nowrap"><b>${sectorLink(x.sector, days)}</b></td><td class="small">${x.tickers.map(esc).join(', ')}</td>` +
          D.axes.map(a => `<td class="axcell">${x.n ? axisBar(a, x.axes[a].net, x.axes[a].n, false) : '<span class="dim small">–</span>'}</td>`).join('') +
          `<td class="num"><b class="pct ${pctCls(x.score)}">${pctText(x.score)}</b></td><td>${labelHtml(x.label)}</td><td class="num">${x.n}</td><td class="num">${deltaHtml(x.delta, x.n)}</td><td>${x.n ? spark(S.sectors[x.sector]) : ''}</td></tr>`).join('') +
        `</tbody></table></div></div>`;
    }
    h += attentionPanel(D.attention) + `</section>`;
    app.innerHTML = h;
  }

  function sector(name, arg) {
    const days = daysOf(arg), B = board(days), S = serOf(days), x = B.sectors.find(z => z.sector === name), cfg = D.sectors[name];
    if (!x || !cfg) { app.innerHTML = `<p class="empty">${esc(name)} 섹터가 sector_map 에 없습니다. <a href="#/sectors">섹터 목록</a></p>`; REDRAW = null; return; }
    const rows = D.ledger.filter(r => r.sector === name && r.date >= B.from && r.date <= B.to).sort((a, c) => c.date.localeCompare(a.date) || c.line - a.line);
    let h = `<p class="dateline">${esc(name)}</p><p class="hero-sub">${esc(cfg.direction)} · ${cfg.tickers.map(esc).join(', ')}${cfg.note ? ` · ${esc(cfg.note)}` : ''}</p>`;
    h += segTabs(`#/sector/${enc(name)}`, days, `${B.from} ~ ${B.to}, ${x.n}건${ledgerNote() ? ` · ${ledgerNote()}` : ''}`);
    h += `<section class="dash"><div class="kpis full">` + tile(`<span class="${pctCls(x.score)}">${pctText(x.score)}</span>`, `정렬 (최근 ${days}일)`) + tile(labelHtml(x.label), '상태', 'txt') + tile(x.n, `시그널 건수`) + tile(deltaHtml(x.delta, x.n).replace(/ small/, ''), '7일 변화', 'txt') + `</div>`;
    h += `<div class="panel full"><h3>정렬 % 추이 <span class="dim">날마다 그날 기준 최근 ${days}일 창으로 다시 계산. 신호 없는 날은 비어 있음</span></h3><div class="chart-box" data-chart="sector"></div></div>`;
    for (const a of D.axes) {
      const ax = x.axes[a], ev = rows.filter(r => r.axis === a);
      h += `<div class="panel full"><h3><span>${axTag(a)} <span class="${netCls(ax.net)}">${fmtNet(ax.net)}</span></span><span class="dim">${ax.n}건 · <span class="dir up"><i>▲</i>${ax.up}</span> <span class="dir down"><i>▼</i>${ax.down}</span> <span class="dir both"><i>◆</i>${ax.both}</span> · 가중 합 ${ax.raw > 0 ? '+' : ''}${ax.raw}</span></h3>` +
        (ev.length ? `<ul class="feed">` + ev.map(r => `<li><div class="meta"><span class="date">${r.date}</span>${dirBadge(r.direction)}${confBadge(r.confidence)}<span class="dim small">${esc(r.horizon)} · 크기 ${esc(r.impact)} · ${esc(r.channel)}${r.reverses ? ` · 번복 줄 ${r.reverses}` : ''}</span><span class="dim small">${(r.tickers || []).map(esc).join(', ')}</span></div>${esc(r.fact)} <a href="${esc(r.source)}" target="_blank" rel="noopener">출처</a><br><span class="small dim">${esc(r.note)}</span></li>`).join('') + `</ul>` : `<p class="empty">이 축의 근거가 아직 없습니다. "아직 모른다"이지 "아니다"가 아닙니다.</p>`) + `</div>`;
    }
    h += `</section>`;
    app.innerHTML = h;
    REDRAW = () => pctLines(app.querySelector('[data-chart="sector"]'), S.dates, [{ name, cls: 's0', values: S.sectors[name] }], { label: `${name} 정렬 % 추이`, endLabels: false });
    REDRAW();
  }

  /* 추이: 섹터 선택은 최대 8개. 색은 선택한 섹터에 고정되고 다른 섹터를 껐다 켜도 바뀌지 않는다. 창을 바꾸면 그 창에 신호 없는 섹터는 선택에서 빠진다 */
  let SEL = null; const SLOT = new Map();
  const slotOf = name => { if (!SLOT.has(name)) { const used = new Set(SLOT.values()); SLOT.set(name, SC.find(c => !used.has(c)) || SC[SC.length - 1]); } return SLOT.get(name); };
  function trend(arg) {
    const days = daysOf(arg), B = board(days), S = serOf(days), A = D.activity[days === 90 ? 'w90' : 'w30'], c = B.counts;
    const active = B.sectors.filter(x => x.n), activeNames = new Set(active.map(x => x.sector));
    if (!SEL) SEL = active.slice().sort((a, b) => (Math.abs(b.score - 50) - Math.abs(a.score - 50)) || (b.n - a.n)).slice(0, 6).map(x => x.sector);
    for (const s of SEL) if (!activeNames.has(s)) SLOT.delete(s);
    SEL = SEL.filter(s => activeNames.has(s));
    SEL.forEach(slotOf);
    let h = `<p class="dateline">추이</p><p class="hero-sub">기준일 ${D.today}, 장부 전체 ${D.ledger.length}건. 정렬 %는 날마다 그날 기준 창으로 다시 계산한 값입니다.${ledgerNote() ? ` ${ledgerNote()}.` : ''}</p>`;
    if (!D.ledger.length) { app.innerHTML = h + `<p class="empty">장부가 비어 있습니다.</p>`; REDRAW = null; return; }
    h += segTabs('#/trend', days, `${B.from} ~ ${B.to}, ${B.total}건`);
    h += `<section class="dash"><div class="kpis full">` + tile(B.total, `최근 ${days}일 구조적 시그널`) + tile(A.axes.map(x => `<span class="${axCls(x.axis)}" style="color:var(--c)">${x.count}</span>`).join(' <small>/</small> '), `${D.axes.join(' / ')} 건수`) +
      tile(`${c.aligned3 + c.aligned2} <small>3축 ${c.aligned3}</small>`, '2축 이상 정렬 섹터') + tile(`${c.headwind} <small>엇갈림 ${c.mixed}</small>`, '역풍 섹터') + `</div>`;
    h += `<div class="panel full"><h3>섹터 정렬 % 추이 <span class="dim">칩을 눌러 섹터를 고른다. 최대 8개, 기본은 중립(50%)에서 먼 순. 선 위에 마우스를 올리면 그날 값</span></h3><div class="seg" style="margin:0 0 8px" role="group" aria-label="섹터 선택">` +
      active.sort(byScore).map(x => `<button type="button" data-sel="${esc(x.sector)}" aria-pressed="${SEL.includes(x.sector)}" class="${SEL.includes(x.sector) ? slotOf(x.sector) : ''}"><i></i>${esc(x.sector)} ${x.score}%</button>`).join('') + `</div><div class="chart-box" data-chart="sectors"></div></div>`;
    h += `<div class="panel full"><h3>방향 정렬 % 추이 <span class="dim">소속 섹터의 평균</span></h3>${legend(B.directions.map((x, i) => [x.direction, SC[i % SC.length]]))}<div class="chart-box" data-chart="directions"></div></div>`;
    h += `<div class="panel full"><h3>일별 시그널 <span class="dim">축별로 쌓음</span></h3>${axisLegend()}<div class="chart-box" data-chart="daily"></div></div>`;
    h += `<div class="panel full"><h3>축별 상세 <span class="dim">최근 ${days}일. 방향은 섹터 기준</span></h3><div class="tbl"><table><thead><tr><th>축</th><th class="num">건수</th><th class="num">비중</th><th class="num">밀어줌 / 막음 / 양쪽</th><th class="num">평균 확신</th><th>상위 섹터</th><th>상위 티커</th></tr></thead><tbody>` +
      A.axes.map(x => `<tr><td class="nowrap">${axTag(x.axis)}</td><td class="num">${x.count}</td><td class="num">${A.total ? Math.round(x.share * 100) + '%' : '–'}</td><td class="num">${x.dir['+']} / ${x.dir['-']} / ${x.dir['±']}</td><td class="num">${x.avg_conf ?? '–'}</td><td class="small">${x.sectors.map(([k, v]) => `${esc(k)}(${v})`).join(', ') || '–'}</td><td class="small">${x.tickers.map(([k, v]) => `${esc(k)}(${v})`).join(', ') || '–'}</td></tr>`).join('') + `</tbody></table></div></div></section>`;
    app.innerHTML = h;
    const drawSectors = () => pctLines(app.querySelector('[data-chart="sectors"]'), S.dates, SEL.map(s => ({ name: s, cls: slotOf(s), values: S.sectors[s] })), { label: `섹터 정렬 % 추이, 최근 ${days}일 창` });
    const drawAll = () => {
      drawSectors();
      pctLines(app.querySelector('[data-chart="directions"]'), S.dates, B.directions.map((x, i) => ({ name: x.direction, cls: SC[i % SC.length], values: S.directions[x.direction] })), { label: `방향 정렬 % 추이, 최근 ${days}일 창` });
      const { days: dd, per } = dailyCounts(D.ledger, B.from, B.to);
      stackChart(app.querySelector('[data-chart="daily"]'), dd, D.axes.map(a => ({ name: a, cls: axCls(a), counts: per[axIdx(a)] })), `일별 구조적 시그널 건수, 최근 ${days}일`);
    };
    app.querySelectorAll('button[data-sel]').forEach(btn => btn.addEventListener('click', () => {
      const s = btn.dataset.sel;
      if (SEL.includes(s)) { SEL = SEL.filter(z => z !== s); SLOT.delete(s); btn.setAttribute('aria-pressed', 'false'); btn.className = ''; }
      else if (SEL.length >= 8) { return; }
      else { SEL = [...SEL, s]; btn.setAttribute('aria-pressed', 'true'); btn.className = slotOf(s); }
      drawSectors();
    }));
    REDRAW = drawAll;
    drawAll();
  }

  function ledger() {
    REDRAW = null;
    const rows = [...D.ledger].sort((a, b) => b.date.localeCompare(a.date) || b.line - a.line);
    rows.forEach(r => { r._q = [r.sector, r.fact, r.note, (r.tickers || []).join(' ')].join(' ').toLowerCase(); });
    const sectorNames = [...new Set([...Object.keys(D.sectors), ...rows.map(r => r.sector).filter(Boolean)])];   // 맵에 없는 옛 섹터도 고를 수 있게
    app.innerHTML = `<p class="dateline">장부</p><p class="hero-sub">구조적 시그널만 쌓입니다. 한 줄이 한 사건, 추가만 하고 고치지 않습니다.</p>` +
      `<div class="filters"><label>축 <select id="f-axis"><option value="">전체</option>${D.axes.map(a => `<option>${a}</option>`).join('')}</select></label>` +
      `<label>섹터 <select id="f-sector"><option value="">전체</option>${sectorNames.map(s => `<option>${esc(s)}</option>`).join('')}</select></label>` +
      `<label>기간 <select id="f-days"><option value="">전체</option><option value="30">최근 30일</option><option value="90">최근 90일</option></select></label>` +
      `<input type="search" id="f-q" placeholder="섹터, 티커, 팩트 검색" aria-label="검색"><span class="count" id="f-count"></span></div>` + KEYS + `<div id="ledger-table"></div>`;
    const meta = r => `${esc(r.horizon)} · 크기 ${esc(r.impact)} · ${esc(r.channel)}${r.reverses ? ` · 번복 줄 ${r.reverses}` : ''}`;
    const draw = () => {
      const ax = document.getElementById('f-axis').value, sc = document.getElementById('f-sector').value, days = Number(document.getElementById('f-days').value), q = document.getElementById('f-q').value.trim().toLowerCase();
      const cut = days ? new Date(new Date(D.today).getTime() - days * 864e5).toISOString().slice(0, 10) : '';
      const sel = rows.filter(r => (!ax || r.axis === ax) && (!sc || r.sector === sc) && (!cut || r.date > cut) && (!q || r._q.includes(q)));
      document.getElementById('f-count').textContent = `${sel.length}건`;
      document.getElementById('ledger-table').innerHTML = sel.length ? `<div class="tbl wide"><table><thead><tr><th>날짜</th><th>축</th><th>섹터</th><th class="fact">팩트</th><th>티커</th><th>방향</th><th>확신</th><th>기간 · 크기 · 경로</th><th class="note">해석</th></tr></thead><tbody>` +
        sel.map(r => `<tr><td class="date">${r.date}<br><span class="dim small">줄 ${r.line}</span></td><td class="nowrap">${axTag(r.axis)}</td><td class="nowrap">${sectorLink(r.sector)}</td><td class="fact">${esc(r.fact)} <a href="${esc(r.source)}" target="_blank" rel="noopener">출처</a></td><td class="nowrap">${(r.tickers || []).map(esc).join(', ')}</td><td>${dirBadge(r.direction)}</td><td>${confBadge(r.confidence)}</td><td class="small nowrap">${meta(r)}</td><td class="small note">${esc(r.note)}</td></tr>`).join('') +
        `</tbody></table></div>` : `<p class="empty">조건에 맞는 줄이 없습니다.</p>`;
    };
    ['f-axis', 'f-sector', 'f-days'].forEach(id => document.getElementById(id).addEventListener('change', draw));
    document.getElementById('f-q').addEventListener('input', debounce(draw, 150));
    draw();
  }

  function briefs() {
    REDRAW = null;
    app.innerHTML = `<p class="dateline">브리프</p><p class="hero-sub">${D.briefs.length}건</p>` + (D.briefs.length ?
      `<div class="tbl"><table><thead><tr><th>날짜</th><th class="num">구조적 시그널</th><th class="num">시그널 카드</th></tr></thead><tbody>` +
      D.briefs.map(b => `<tr><td class="date"><a href="#/brief/${b.date}">${b.date}</a></td><td class="num">${b.none_today ? '없음' : b.structural}</td><td class="num">${b.signals.length}</td></tr>`).join('') + `</tbody></table></div>` :
      `<p class="empty">아직 브리프가 없습니다. 다음 /brief 부터 쌓입니다.</p>`);
  }
  function brief(date) {
    const i = D.briefs.findIndex(x => x.date === date);
    if (i < 0) { app.innerHTML = `<p class="empty">${esc(date)} 브리프가 없습니다. <a href="#/briefs">브리프 목록</a></p>`; REDRAW = null; return; }
    REDRAW = null;
    const b = D.briefs[i], prev = D.briefs[i + 1], next = D.briefs[i - 1];
    const meta = [`구조적 ${b.none_today ? '없음' : b.structural + '건'}`, rawLine(b.date)].filter(Boolean).join(', ');
    app.innerHTML = `<p class="dateline">${fmtDate(b.date)} 브리프</p><p class="hero-sub">${esc(meta)}</p><div id="brief"></div>` +
      `<nav class="pager" aria-label="브리프 이동"><span>${prev ? `<a href="#/brief/${prev.date}">이전 ${prev.date}</a>` : ''}</span><span>${next ? `<a href="#/brief/${next.date}">다음 ${next.date}</a>` : ''}</span></nav>`;
    mountBrief(document.getElementById('brief'), b);
  }
  const fwCache = {};
  const fetchText = p => { if (!fwCache[p]) fwCache[p] = fetch(p, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }); return fwCache[p]; };
  function framework() {
    REDRAW = null;
    app.innerHTML = `<p class="dateline">판단 기준</p><p class="hero-sub">framework/axes.md, sector_map.yaml, sources.yaml 그대로. Ken 이 고칩니다. 점수 계산의 구현은 fetch/scoring.py 하나입니다 (K=${D.params.K}, 기간 가중 ${Object.entries(D.params.HW).map(([k, v]) => `${k} ${v}`).join(' · ')}).</p><div id="axes"><p class="loading">불러오는 중</p></div><h2 class="sec">방향·섹터·티커 <span class="dim">framework/sector_map.yaml</span></h2><pre class="yaml" id="smap"></pre><h2 class="sec">수집 소스 <span class="dim">framework/sources.yaml</span></h2><pre class="yaml" id="srcs"></pre>`;
    Promise.all([fetchText('framework/axes.md'), fetchText('framework/sector_map.yaml'), fetchText('framework/sources.yaml')]).then(([a, s, r]) => {
      const ax = document.getElementById('axes'); if (!ax) return;
      ax.innerHTML = ''; ax.appendChild(md(a)); document.getElementById('smap').textContent = s; document.getElementById('srcs').textContent = r;
    }).catch(e => { const ax = document.getElementById('axes'); if (ax) ax.innerHTML = `<p class="empty">기준 문서를 불러오지 못했습니다 (${esc(e.message)}).</p>`; });
  }

  const views = { home, sectors, sector, trend, ledger, briefs, brief, framework };
  const titles = { home: 'radar', sectors: '섹터', sector: '섹터', trend: '추이', ledger: '장부', briefs: '브리프', brief: '브리프', framework: '기준' };
  function route() {
    if (!D) return;
    const [seg, a1, a2] = location.hash.replace(/^#\/?/, '').split('/');
    const name = views[seg] ? seg : 'home';
    document.querySelectorAll('#nav a').forEach(a => {
      const on = a.dataset.route === name || (name === 'brief' && a.dataset.route === 'briefs') || (name === 'sector' && a.dataset.route === 'sectors');
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    let arg = a1 || '';
    try { arg = decodeURIComponent(arg); } catch (e) { /* 그대로 둔다 */ }
    document.title = name === 'home' ? 'radar' : `${['brief', 'sector'].includes(name) ? arg + ' ' : ''}${titles[name]} | radar`;
    if (name === 'sector') sector(arg, a2); else views[name](arg);
    app.insertAdjacentHTML('afterbegin', banner());
    window.scrollTo(0, 0);
  }

  fetch('data.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
    D = j;
    document.getElementById('gen').textContent = `빌드 ${j.generated_at.replace('T', ' ').slice(0, 16)} KST`;
    route();
  }).catch(e => { app.innerHTML = `<p class="empty">data.json 을 불러오지 못했습니다 (${esc(e.message)}). 빌드가 아직 안 됐거나 경로가 다릅니다.</p>`; });
  window.addEventListener('hashchange', route);
})();
</script>
</body>
</html>
