# 방향(내러티브) → 섹터 → 티커. Claude 는 이 파일의 섹터 이름과 티커만 쓴다. 추가·삭제는 Ken 이 한다.
# 최상위 키 = 방향(세상이 그쪽으로 흐른다는 가설). 그 아래 = 섹터. 섹터 이름은 장부 sector 필드와 글자 단위로 같아야 한다.
# tickers 는 ETF 를 앞에, 개별 종목은 그 섹터의 대표일 때만. 티커는 한 섹터에만 둔다 (정렬 % 이중 집계 방지).
# keywords 는 수집 헤드라인에서 그 섹터가 얼마나 언급되는지 세는 데만 쓴다 (사이트 '관심'). 영어 소문자, 단어 경계, 대소문자 무시. 분류·장부에는 쓰지 않는다.
# 값 안에 ' #' 을 쓰면 주석으로 잘린다. 리스트 값 안에 쉼표를 쓰지 않는다.

AI 인프라:
  AI 반도체:
    tickers: [SMH, NVDA, AVGO, TSM]
    note: 학습·추론 칩과 파운드리. 하이퍼스케일러 capex 의 직접 수혜
    keywords: [nvidia, gpu, semiconductor, chips, tsmc, "chip export", broadcom]
  하이퍼스케일러:
    tickers: [QQQ, MSFT, GOOGL, AMZN, META]
    note: capex 주체이자 모델·클라우드 판매자. 반독점·저작권 판결의 당사자
    keywords: [microsoft, google, alphabet, amazon, meta, cloud, openai, azure, hyperscaler]
  전력/데이터센터:
    tickers: [PWR, VST, CEG, XLU]
    note: 데이터센터 전력 계약, 원전 재가동, 전력 시공. AI 의 1차 병목
    keywords: ["data center", "data centers", "power grid", nuclear, utility, utilities, electricity, "power purchase", reactor, capex]
  전기화 원자재:
    tickers: [COPX, URA]
    note: 구리·우라늄. 데이터센터·전기화의 3~5년 공급 제약
    keywords: [copper, uranium, lithium, "rare earth", mining]
  소프트웨어:
    tickers: [IGV]
    note: AI 수익화의 다음 단계. 에이전트·코파일럿 매출. 대체로 후행
    keywords: [software, saas, copilot, "ai agent", "ai agents", "ai adoption"]

피지컬 AI:
  로봇/자율주행:
    tickers: [BOTZ, TSLA]
    note: 휴머노이드·산업 로봇·자율주행. 사회 수용(안전·규제)이 병목
    keywords: [robot, robots, robotics, humanoid, tesla, optimus, autonomous, "self-driving", waymo]
  우주/위성:
    tickers: [SPCX]
    note: 발사·위성통신·궤도 컴퓨트. SpaceX 2026-06-12 Nasdaq 상장. 정부 발사 계약은 정책 축으로 기록
    keywords: [spacex, starlink, satellite, satellites, rocket, starship]

미국 산업 회귀:
  산업재/리쇼어링:
    tickers: [XLI, CAT]
    note: 관세·산업정책으로 미국 내 생산·건설이 늘 때의 수혜. 보복관세 비용은 −
    keywords: [tariff, tariffs, reshoring, "section 232", "section 301", "trade deal", "import duties", manufacturing]
  방산:
    tickers: [ITA, LMT, RTX]
    note: 국방예산, 지정학, 골든돔
    keywords: [pentagon, "defense budget", "defense department", missile, nato, "arms sale", "golden dome"]
  에너지:
    tickers: [XLE, XOP]
    note: 시추 규제 완화, 전략비축유, DPA 에너지 권한. 유가 등락 자체는 시그널 아님
    keywords: [oil, drilling, opec, lng, "energy secretary", pipeline, "strategic petroleum", "interior department"]

금리·달러 체제:
  금리/국채:
    tickers: [TLT, IEF, IWM]
    note: FOMC 결정과 국채 발행 구조에 가장 민감. IWM 은 금리 인하 수혜
    keywords: [fed, fomc, "rate cut", "rate hike", "interest rate", "interest rates", "treasury yields", "bond market", powell]
  은행/자본시장:
    tickers: [XLF, KRE, JPM, BLK]
    note: 자본규제 완화, 자본시장 활황, 운용사의 상품 확장
    keywords: ["bank capital", basel, fdic, occ, deregulation, "community bank", "stress test", jpmorgan, "goldman sachs", blackrock, "wall street", "private credit"]
  달러/신흥국:
    tickers: [UUP, EEM]
    note: 달러 약세 = UUP −, 신흥국 EEM +. 둘 다 쓰면 ±
    keywords: ["dollar index", "us dollar", "u.s. dollar", "weaker dollar", "stronger dollar", dxy, yuan, currency]
  귀금속:
    tickers: [GLD, SLV]
    note: 연준 독립성·달러 신뢰의 헤지. 중앙은행 금 매입
    keywords: [gold, silver, bullion]
  지수:
    tickers: [SPY, RSP]
    note: 시장 전체에 닿는 시그널용. SPY 대비 RSP(동일가중)는 집중도 척도
    keywords: ["s&p 500", "stock market", nasdaq, "dow jones"]

코인 제도권 편입:
  코인 ETF:
    tickers: [IBIT, ETHA, BITO]
    note: 현물·선물 ETF. 기관 자금흐름의 직접 지표. 은행·운용사의 코인 상품 진입도 여기
    keywords: ["bitcoin etf", "spot etf", ibit, etha, bito, "etf inflows", "etf outflows", "ether etf", "bitcoin futures"]
  거래소/인프라:
    tickers: [COIN, HOOD]
    note: 규제 확정의 1차 수혜. 시장구조법·SEC/CFTC 관할
    keywords: [coinbase, robinhood, kalshi, cftc, "crypto exchange", "clarity act"]
  기업 보유:
    tickers: [MSTR]
    note: 재무제표 보유 결정
    keywords: [microstrategy, "bitcoin treasury", "strategy inc", saylor]
  스테이블코인/결제:
    tickers: [CRCL, PYPL]
    note: 스테이블코인 법안, 발행량, 결제 채택
    keywords: [stablecoin, stablecoins, usdc, circle, tether, "genius act", paypal]

소비·생활 변화:
  소비:
    tickers: [XLY, XLP]
    note: 소비 패턴과 물가·관세의 소비자 전가. 재량 XLY 와 필수 XLP 는 방향이 갈릴 수 있다
    keywords: [cpi, inflation, "consumer spending", "retail sales", "consumer prices", "consumer sentiment", ppi]
  헬스케어:
    tickers: [XLV, IHE]
    note: 약가·메디케어 정책, GLP-1·고령화 수요
    keywords: ["drug price", "drug prices", medicare, medicaid, fda, pharma, "most favored nation", "glp-1", ozempic, "aging population"]
  주택/건설:
    tickers: [XHB]
    note: 이민·노동 공급, 금리, 주거 형태 변화
    keywords: [immigration, visa, "h-1b", deportation, housing, "home sales", "mortgage rates"]

# 사용 규칙
# - 하나의 시그널에 티커 최대 3개. 원칙적으로 그 섹터의 tickers 에서 고른다. 다른 섹터의 티커를 쓰면 note 에 이유를 적는다.
# - 맵에 없는 티커가 필요하면 브리프 "맵 수정 제안"에만 적는다. 3회 이상 반복 등장할 때만 추가를 검토한다.
