# 축 → 테마 → 티커 화이트리스트
# Claude는 이 파일에 있는 티커만 인용한다. 추가/삭제는 Ken이 한다.
# ETF를 앞에, 개별 종목은 뒤에. 개별 종목은 "그 테마의 대표"일 때만 넣는다.
# 티커는 한 테마에만 둔다(티커 집계의 이중 계산 방지). 다른 테마의 티커를 쓸 때는 note 에 이유를 적는다.
# keywords 는 수집 헤드라인에서 그 테마가 얼마나 언급되는지 세는 데만 쓴다(사이트 '관심 테마'). 영어 소문자, 단어 경계로 대소문자 무시 매칭. 분류·장부에는 쓰지 않는다.

정치권력:
  관세/리쇼어링:
    tickers: [XLI, CAT]
    note: 관세·산업정책 수혜 산업재. 전력 시공(PWR)은 기술권력 전력/인프라 테마
    keywords: [tariff, tariffs, reshoring, "section 232", "section 301", "trade deal", "import duties"]
  방산:
    tickers: [ITA, LMT, RTX]
    note: 국방예산 증액, 지정학
    keywords: [pentagon, "defense budget", "defense department", missile, nato, "arms sale", "golden dome"]
  에너지 정책:
    tickers: [XLE, XOP]
    note: 시추 규제 완화, 전략비축유
    keywords: [oil, drilling, opec, lng, "energy secretary", pipeline, "strategic petroleum", "interior department"]
  금융 규제완화:
    tickers: [XLF, KRE]
    note: 자본규제·지역은행 규제 완화
    keywords: ["bank capital", basel, fdic, occ, deregulation, "community bank", "stress test"]
  헬스케어 정책:
    tickers: [XLV, IHE]
    note: 약가·메디케어. 방향은 대체로 -
    keywords: ["drug price", "drug prices", medicare, medicaid, fda, pharma, "most favored nation"]
  이민/노동:
    tickers: [XHB]
    note: 건설 노동 공급. 방향 대체로 -. 주택은 금리 민감도가 더 크므로 금리 사건은 자본권력 유동성/금리
    keywords: [immigration, visa, "h-1b", deportation, "labor market", unemployment]
  소비/물가:
    tickers: [XLY, XLP]
    note: 관세·이민 비용의 소비자 전가. 방향 대체로 -
    keywords: [cpi, inflation, "consumer spending", "retail sales", "consumer prices", ppi]

기술권력:
  AI capex:
    tickers: [SMH, NVDA, AVGO, TSM]
    note: 하이퍼스케일러 capex 가이던스가 직접 연결
    keywords: [capex, "data center", "data centers", nvidia, gpu, "ai infrastructure", chips, semiconductor]
  하이퍼스케일러:
    tickers: [QQQ, MSFT, GOOGL, AMZN, META]
    note: capex 주체이자 반독점 대상
    keywords: [microsoft, google, alphabet, amazon, meta, cloud, openai, azure]
  전력/인프라:
    tickers: [PWR, VST, CEG, XLU]
    note: 데이터센터 전력 계약, 원전, 전력 시공
    keywords: ["power grid", nuclear, utility, utilities, electricity, "power purchase", reactor]
  전기화/원자재:
    tickers: [COPX, URA]
    note: 데이터센터·전기화의 원자재 병목(구리, 우라늄). 3~5년 공급 제약
    keywords: [copper, uranium, lithium, "rare earth", mining]
  소프트웨어:
    tickers: [IGV]
    note: AI 수익화의 다음 단계. 대체로 후행
    keywords: [software, saas, copilot, "ai agent", "ai agents"]
  피지컬 AI/로봇:
    tickers: [BOTZ, TSLA]
    note: 기존 관심 테마. 아직 시그널 빈도 낮을 것
    keywords: [robot, robots, robotics, humanoid, tesla, optimus, autonomous]
  우주/위성:
    tickers: [SPCX]
    note: 발사·위성통신·궤도 컴퓨트. SpaceX 2026-06-12 Nasdaq 상장. 정부 발사 계약은 정치권력 방산과 겹치나 티커는 여기에만 (Ken 승인 2026-09-12)
    keywords: [spacex, starlink, satellite, satellites, rocket, starship]

자본권력:
  유동성/금리:
    tickers: [TLT, IEF, IWM]
    note: 금리 방향에 가장 민감한 자산. IWM은 금리 인하 수혜
    keywords: [fed, fomc, "rate cut", "rate hike", "interest rate", "interest rates", "treasury yields", "bond market", powell]
  대형은행/운용사:
    tickers: [JPM, BLK]
    note: 자본시장 활황, 월가의 사업 확장. 금융 ETF(XLF)는 정치권력 금융 규제완화 테마
    keywords: [jpmorgan, "goldman sachs", blackrock, "morgan stanley", "wall street", "private credit", citigroup]
  달러:
    tickers: [UUP, EEM]
    note: 달러 약세 = UUP -, 신흥국(EEM) +. 방향은 티커마다 반대이므로 시그널에 둘 다 쓰면 ±
    keywords: ["dollar index", "us dollar", "u.s. dollar", "weaker dollar", "stronger dollar", dxy, yuan, currency]
  귀금속:
    tickers: [GLD, SLV]
    note: 연준 독립성 훼손·달러 신뢰 하락의 헤지
    keywords: [gold, silver, bullion]
  시장 전체:
    tickers: [SPY, RSP]
    note: 다른 테마에 안 걸리는 광범위 유동성 시그널용. SPY 대비 RSP(동일가중)는 집중도 척도. QQQ 는 기술권력 하이퍼스케일러
    keywords: ["s&p 500", "stock market", nasdaq, "dow jones"]

코인:
  현물 ETF:
    tickers: [IBIT, ETHA]
    note: 기관 자금흐름의 직접 지표. 은행·운용사가 코인 ETF 사업에 진입하는 사건도 이 테마
    keywords: ["bitcoin etf", "spot etf", ibit, etha, "etf inflows", "etf outflows", "ether etf"]
  선물 ETF:
    tickers: [BITO]
    note: 비트코인 선물 ETF(ProShares). 옵션·인컴 상품 수요와 기관의 파생 접근. 기업 관찰 대상 (Ken 요청 2026-09-16)
    keywords: [bito, "futures etf", "bitcoin futures"]
  거래소/인프라:
    tickers: [COIN, HOOD]
    note: 규제 확정의 1차 수혜
    keywords: [coinbase, robinhood, kalshi, cftc, "crypto exchange"]
  기업 보유:
    tickers: [MSTR]
    note: 재무제표 보유 결정
    keywords: [microstrategy, "bitcoin treasury", "strategy inc", saylor]
  스테이블코인/결제:
    tickers: [CRCL, PYPL]
    note: 스테이블코인 법안 연결
    keywords: [stablecoin, stablecoins, usdc, circle, tether, "genius act", paypal]

# 사용 규칙
# - 하나의 시그널에 최대 3개 티커.
# - 테마 키(관세/리쇼어링 등)는 signals.jsonl의 theme 필드와 정확히 일치해야 한다.
# - "맵 수정 제안"으로 올라온 티커는 3회 이상 반복 등장할 때만 추가를 검토한다.
